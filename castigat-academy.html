etteurs en sc\xE8ne.","Aux Bouffes du Nord \xE0 Paris (1974\u20132010), il cr\xE9e un th\xE9\xE2tre universel et \xE9pur\xE9. Le Mahabharata en 9 heures, La Temp\xEAte, Hamlet sont des explorations de l'essence th\xE9\xE2trale, cherchant toujours ce qui est n\xE9cessaire et enlevant tout ce qui est superflu."],quiz:[{q:"Selon Peter Brook, qu'est-ce qui est absolument n\xE9cessaire pour faire du th\xE9\xE2tre ?",o:["D\xE9cor, costumes et lumi\xE8re","Un acteur, un spectateur et un espace","Un texte excellent","Des effets sp\xE9ciaux"],a:1},{q:"En quelle ann\xE9e Peter Brook publie-t-il L'Espace vide ?",o:["1960","1968","1975","1985"],a:1},{q:"Combien de forme de th\xE9\xE2tre Brook distingue-t-il dans sa th\xE9orie ?",o:["Deux","Trois","Quatre","Cinq"],a:2}]},{id:"h_in4",title:"Le th\xE9\xE2tre japonais \u2014 N\xF4 et Kabuki",cat:"Histoire",icon:"\u{1F3EF}",dur:"13 min",xp:40,content:["Le N\xF4 est n\xE9 au XIVe si\xE8cle au Japon. C'est un th\xE9\xE2tre extr\xEAmement codifi\xE9 et \xE9pur\xE9 : mouvements lents et stylis\xE9s, masques magnifiques (chaque masque change l'\xE9nergie du personnage), textes po\xE9tiques dits sur une musique. Un spectacle dure 3-4 heures \u2014 g\xE9n\xE9ralement une t\xE9tralogie.","Les acteurs du N\xF4 se transmettent le r\xE9pertoire de p\xE8re en fils depuis 700 ans. Il y a cinq \xE9coles principales. Chaque geste a un sens pr\xE9cis, transmis de mani\xE8re extr\xEAmement fid\xE8le. Le 'ma' (le silence, l'espace) est aussi important que l'action.","Le Kabuki est le contraire du N\xF4 : explosif, spectaculaire, color\xE9. N\xE9 au XVIIe si\xE8cle avec des femmes qui dansaient en public (d'o\xF9 son nom : ka=chanson, bu=danse, ki=technique). Les femmes ont \xE9t\xE9 interdites, remplac\xE9es par des 'onnagata' (hommes jouant les r\xF4les f\xE9minins).","Le Kabuki est populaire, dramatique, physique. Les acteurs surjouent volontairement. Les costumes sont magnifiques, le maquillage (kumadori) cr\xE9e des masques de couleur. Deux choses en commun avec le N\xF4 : la transmission de p\xE8re en fils, et une vision du th\xE9\xE2tre comme art rituel immuable."],quiz:[{q:"Depuis combien de si\xE8cles le r\xE9pertoire du N\xF4 est-il transmis dans les familles ?",o:["3 si\xE8cles","5 si\xE8cles","7 si\xE8cles","10 si\xE8cles"],a:2},{q:"Qu'est-ce que le 'ma' dans le th\xE9\xE2tre N\xF4 ?",o:["Un costume","Le silence et l'espace entre les actions","Un masque sp\xE9cial","Un type de musique"],a:1},{q:"Qu'est-ce qu'un 'onnagata' au Kabuki ?",o:["Une danseuse","Un homme jouant les r\xF4les f\xE9minins","Un musicien","Un metteur en sc\xE8ne"],a:1}]}],artiste:[{id:"h_ar1",title:"Le th\xE9\xE2tre contemporain",cat:"Histoire",icon:"\u{1F32C}\uFE0F",dur:"12 min",xp:40,content:["Depuis les ann\xE9es 1980, le th\xE9\xE2tre explose ses propres fronti\xE8res : performance, installation, th\xE9\xE2tre immersif, th\xE9\xE2tre documentaire, \xE9criture de plateau (le spectacle se cr\xE9e sans texte pr\xE9alable).","Les figures majeures : Pina Bausch (Tanztheater de Wuppertal \u2014 danse et th\xE9\xE2tre fusionnent), Robert Wilson (tableaux visuels hypnotiques au ralenti), Romeo Castellucci (images choc et beaut\xE9 plastique radicale).","Le th\xE9\xE2tre documentaire utilise de vrais t\xE9moignages, interviews, archives : Milo Rau reconstitue des proc\xE8s, Rimini Protokoll met des 'experts du quotidien' (non-acteurs) sur sc\xE8ne. La fronti\xE8re entre r\xE9el et fiction s'efface.","Le th\xE9\xE2tre immersif (Sleep No More de Punchdrunk, les cr\xE9ations de Music Hall) transforme le spectateur en participant actif qui d\xE9ambule dans l'espace. Il n'y a plus de sc\xE8ne, plus de salle \u2014 le th\xE9\xE2tre est partout."],quiz:[{q:"Qu'est-ce que l'\xE9criture de plateau ?",o:["\xC9crire un texte sur le plateau","Cr\xE9er le spectacle sans texte pr\xE9alable, directement en r\xE9p\xE9titions","\xC9crire debout","Un logiciel de dramaturgie"],a:1},{q:"Quelle compagnie a cr\xE9\xE9 le spectacle immersif Sleep No More ?",o:["Complicit\xE9","Punchdrunk","Rimini Protokoll","Th\xE9\xE2tre du Soleil"],a:1},{q:"Que met Rimini Protokoll sur sc\xE8ne \xE0 la place d'acteurs professionnels ?",o:["Des robots","Des experts du quotidien (non-acteurs)","Des hologrammes","Des animaux"],a:1}]},{id:"h_ar2",title:"Les grandes metteuses en sc\xE8ne",cat:"Auteurs",icon:"\u2712\uFE0F",dur:"10 min",xp:35,content:["Ariane Mnouchkine (n\xE9e en 1939) fonde le Th\xE9\xE2tre du Soleil en 1964 \xE0 la Cartoucherie de Vincennes. Travail collectif, engagement politique, inspiration asiatique (kabuki, kathakali). Les Atrides, 1789, Le Dernier Caravans\xE9rail.","Pina Bausch (1940\u20132009) invente le Tanztheater \xE0 Wuppertal : ses danseurs parlent, crient, rient, pleurent. Caf\xE9 M\xFCller, Le Sacre du printemps, Kontakthof \u2014 un langage universel qui touche aux tripes.","Katie Mitchell (n\xE9e en 1964) pionni\xE8re du 'live cinema' : des cam\xE9ras filment les acteurs en direct, le r\xE9sultat est projet\xE9 en temps r\xE9el. Le spectateur voit \xE0 la fois le film ET sa fabrication. Technique bluffante.","Ces femmes ont prouv\xE9 que la mise en sc\xE8ne est un art de cr\xE9ation \xE0 part enti\xE8re \u2014 pas une simple 'illustration' du texte. Chacune a invent\xE9 un langage sc\xE9nique qui n'existait pas avant elle."],quiz:[{q:"En quelle ann\xE9e Mnouchkine fonde-t-elle le Th\xE9\xE2tre du Soleil ?",o:["1958","1964","1972","1980"],a:1},{q:"Qu'est-ce que le Tanztheater de Pina Bausch ?",o:["Du th\xE9\xE2tre uniquement dans\xE9","Une fusion de danse, th\xE9\xE2tre, parole et \xE9motion","Un ballet classique moderne","Du mime musical"],a:1},{q:"Quelle technique Katie Mitchell a-t-elle popularis\xE9e au th\xE9\xE2tre ?",o:["Le masque neutre","Le live cinema (cam\xE9ras en direct sur sc\xE8ne)","Le th\xE9\xE2tre de rue","L'improvisation longue"],a:1}]},{id:"h_ar3",title:"Grotowski et le th\xE9\xE2tre pauvre",cat:"Techniques",icon:"\u{1F3AD}",dur:"12 min",xp:45,content:["Jerzy Grotowski (1933\u20131999), metteur en sc\xE8ne polonais, pose une question radicale : que reste-t-il du th\xE9\xE2tre si on enl\xE8ve tout ? Pas de d\xE9cor, pas de costume, pas de lumi\xE8re \xE9labor\xE9e, pas de musique, pas de maquillage. R\xE9ponse : l'acteur et le spectateur. C'est le 'th\xE9\xE2tre pauvre'.","L'acteur grotowskien n'est pas un 'com\xE9dien' au sens classique. C'est un 'acteur saint' qui se donne totalement, sans protection, sans masque social. L'entra\xEEnement est spirituel autant que physique. Il s'agit d'un acte de v\xE9rit\xE9 absolue, presque shamanique.","Les spectacles du Th\xE9\xE2tre Laboratoire de Wroc\u0142aw (Akropolis, Le Prince Constant, Apocalypsis cum Figuris) sont jou\xE9s pour 40-60 spectateurs maximum. La proximit\xE9 physique est absolue \u2014 les acteurs jouent parfois \xE0 30 cm du public. C'est une rencontre humaine, pas un spectacle.","Apr\xE8s 1970, Grotowski abandonne le spectacle public pour le 'parath\xE9\xE2tre' puis 'l'art comme v\xE9hicule' \u2014 explorer les limites de la transformation humaine. Son influence est immense : formation de l'acteur, th\xE9\xE2tre exp\xE9rimental, r\xE9flexion spirituelle sur l'essence du th\xE9\xE2tre."],quiz:[{q:"Combien de spectateurs maximum voyaient les spectacles de Grotowski ?",o:["200","100","40-60","10"],a:2},{q:"Qu'est-ce qu'un 'acteur saint' chez Grotowski ?",o:["Un acteur religieux","Un acteur qui joue seulement des r\xF4les divins","Un acteur qui se donne totalement, sans protection","Un acteur qui prie avant de jouer"],a:2},{q:"Qu'est-ce que Grotowski explore apr\xE8s 1970 ?",o:["Le th\xE9\xE2tre cin\xE9matographique","L'art comme v\xE9hicule et la transformation humaine","Le th\xE9\xE2tre pour enfants","Le doublage cin\xE9ma"],a:1}]},{id:"h_ar4",title:"Le th\xE9\xE2tre de boulevard",cat:"Histoire",icon:"\u{1F3AA}",dur:"10 min",xp:40,content:["Le th\xE9\xE2tre de boulevard na\xEEt au XIXe si\xE8cle \xE0 Paris, sur les grands boulevards (d'o\xF9 son nom). C'est un th\xE9\xE2tre de divertissement populaire, l\xE9ger, rapide, m\xE9canique \u2014 l'opposite du drame romantique lourd.","Les ma\xEEtres du boulevard : Eug\xE8ne Labiche (La Poudre aux yeux, Un Chapeau de paille d'Italie), \xC9mile Augier (Le Gendre de M. Poirier). Le style : intrigues savamment nou\xE9es, quiproquos, poursuites, transformations spectaculaires, fins heureuses o\xF9 tout s'arrange.","La technique du boulevard : \xE9conomie narrative, personnages typ\xE9s mais non psychologiques, chutes de r\xE9plique pr\xE9cises, rythme effr\xE9n\xE9. Les intrigues s'empilent, les malentendus cascadent, tout doit rouler comme une m\xE9canique bien huil\xE9e. Une pi\xE8ce mal ficel\xE9e s'\xE9croule ; une bien ficel\xE9e est indestructible.","L'influence du boulevard est immense : le cin\xE9ma comique fran\xE7ais (Tati, Audiard), la com\xE9die hollywoodienne, les films de Lubitsch. Mais le boulevard aussi s'est fig\xE9 : ses conventions (le couple, la bourgeoisie bienveillante) semblent dat\xE9es. Pourtant, le rire ne s'use jamais \u2014 et le boulevard reste un conservatoire du rire sc\xE9nique."],quiz:[{q:"D'o\xF9 vient le nom 'th\xE9\xE2tre de boulevard' ?",o:["Du nom d'un auteur","Des grands boulevards de Paris","D'une th\xE9orie dramatique","D'un quartier riche"],a:1},{q:"Quel est l'objectif primaire du th\xE9\xE2tre de boulevard ?",o:["Explorer la psychologie humaine","Divertir et faire rire","Critiquer la soci\xE9t\xE9","Enseigner une morale"],a:1},{q:"Qui est un des ma\xEEtres du th\xE9\xE2tre de boulevard ?",o:["Victor Hugo","Eug\xE8ne Labiche","Alexandre Dumas","Gustave Flaubert"],a:1}]}],metteur:[{id:"h_me1",title:"Peter Brook \u2014 l'espace vide",cat:"Techniques",icon:"\u{1F3AD}",dur:"12 min",xp:45,content:["Peter Brook (1925\u20132022) : 'Je peux prendre n'importe quel espace vide et l'appeler une sc\xE8ne nue. Un homme traverse cet espace vide pendant que quelqu'un d'autre l'observe, et c'est tout ce dont j'ai besoin pour qu'un acte de th\xE9\xE2tre s'engage.'","Son livre L'Espace vide (1968) distingue quatre formes de th\xE9\xE2tre : le th\xE9\xE2tre mortel (ennuyeux, fig\xE9 dans ses conventions), le sacr\xE9 (rituel, invisible), le brut (populaire, direct), et l'imm\xE9diat (vivant, en prise avec l'instant).","Aux Bouffes du Nord \xE0 Paris (1974\u20132010), dans ce th\xE9\xE2tre en ruines magnifiques, il cr\xE9e un th\xE9\xE2tre universel : Le Mahabharata (9 heures), La Cerisaie, Hamlet avec Adrian Lester, La Temp\xEAte \u2014 une qu\xEAte d'essentialit\xE9.","Brook a travaill\xE9 sur tous les continents, avec des acteurs de toutes origines. Sa conviction : le th\xE9\xE2tre est le lieu o\xF9 l'invisible devient visible. Il cherche toujours \xE0 enlever \u2014 jamais \xE0 ajouter."],quiz:[{q:"En quelle ann\xE9e L'Espace vide est-il publi\xE9 ?",o:["1958","1968","1978","1988"],a:1},{q:"Quel th\xE9\xE2tre parisien Brook a-t-il dirig\xE9 pendant 36 ans ?",o:["L'Od\xE9on","Les Bouffes du Nord","Le Th\xE9\xE2tre de la Ville","La Cartoucherie"],a:1},{q:"Combien de temps dure la mise en sc\xE8ne du Mahabharata par Brook ?",o:["3 heures","6 heures","9 heures","12 heures"],a:2}]},{id:"h_me2",title:"Grotowski \u2014 le th\xE9\xE2tre pauvre",cat:"Techniques",icon:"\u{1F3AD}",dur:"12 min",xp:45,content:["Jerzy Grotowski (1933\u20131999), metteur en sc\xE8ne polonais, pose une question radicale : que reste-t-il si on enl\xE8ve tout \u2014 d\xE9cor, costume, lumi\xE8re, musique ? R\xE9ponse : l'acteur et le spectateur. C'est le 'th\xE9\xE2tre pauvre'.","L'acteur grotowskien est un 'acteur saint' qui se donne totalement, sans protection, sans masque social. L'entra\xEEnement est extr\xEAme : vocalement, physiquement, psychologiquement. Ce n'est pas de la performance \u2014 c'est un acte de v\xE9rit\xE9.","Ses spectacles au Th\xE9\xE2tre Laboratoire de Wroc\u0142aw (Akropolis, Le Prince Constant, Apocalypsis cum Figuris) sont jou\xE9s pour 40-60 spectateurs maximum. La proximit\xE9 est absolue \u2014 les acteurs jouent parfois \xE0 30 cm du public.","Apr\xE8s 1970, Grotowski abandonne le spectacle pour le 'parath\xE9\xE2tre' puis 'l'art comme v\xE9hicule' \u2014 la rencontre humaine sans public. Son influence sur le th\xE9\xE2tre exp\xE9rimental, la formation de l'acteur, et la r\xE9flexion sur l'essence du th\xE9\xE2tre est incommensurable."],quiz:[{q:"Quelle est la question fondamentale de Grotowski ?",o:["Comment remplir les salles ?","Que reste-t-il quand on enl\xE8ve tout sauf l'acteur et le spectateur ?","Comment moderniser les classiques ?","Comment former des stars ?"],a:1},{q:"Combien de spectateurs maximum dans les spectacles de Grotowski ?",o:["200","100","40-60","10"],a:2},{q:"Qu'est-ce que Grotowski fait apr\xE8s 1970 ?",o:["Il fait du cin\xE9ma","Il abandonne le spectacle pour le parath\xE9\xE2tre","Il dirige un th\xE9\xE2tre national","Il enseigne \xE0 l'universit\xE9"],a:1}]},{id:"h_me3",title:"Pina Bausch et le Tanztheater",cat:"Techniques",icon:"\u{1F483}",dur:"13 min",xp:50,content:["Pina Bausch (1940\u20132009) invente le Tanztheater (th\xE9\xE2tre de danse) : elle rompt avec le ballet classique et la danse moderne pure. Elle m\xE9lange la danse, le th\xE9\xE2tre, le cirque, la vie r\xE9elle. La danse n'a plus besoin d'\xEAtre belle \u2014 elle doit \xEAtre vraie.","Son langage : des mouvements quotidiens (marcher, s'asseoir, tomber) m\xE9lang\xE9s \xE0 des mouvements de danse ; des costumes ordinaires ou \xE9labor\xE9s selon le spectacle ; une relation intime avec le public ; des th\xE8mes universels (l'amour, la mort, la solitude, la joie).","Ses cr\xE9ations : Caf\xE9 M\xFCller (1978 \u2014 les danseurs se d\xE9placent dans l'obscurit\xE9 comme somnambules), Kontakthof (1978 \u2014 une salle de danse pour adolescents et danseurs professionnels qui se croisent), The Rite of Spring (2005 \u2014 une r\xE9\xE9criture visc\xE9rale du Sacre du printemps de Stravinsky).","Cie Tanztheater Wuppertal Pina Bausch : une \xE9cole de vie o\xF9 danser c'est parler de soi, de ses blessures, de ses joies. Apr\xE8s sa mort, la compagnie continue sous direction de Adolfo Fern\xE1ndez et Rainer H\xF6gger. Son h\xE9ritage transforme la danse mondiale."],quiz:[{q:"Qu'est-ce que le Tanztheater de Pina Bausch ?",o:["Ballet classique","Th\xE9\xE2tre de danse m\xE9lang\xE9 \xE0 la vie r\xE9elle","Danse moderne pure","Cirque contemporain"],a:1},{q:"En quelle ann\xE9e Pina Bausch cr\xE9e-t-elle Caf\xE9 M\xFCller ?",o:["1968","1975","1978","1985"],a:2},{q:"Quel est le principe fondamental de Pina Bausch ?",o:["La danse doit \xEAtre belle","La danse doit \xEAtre vraie et exprimer la vie r\xE9elle","La danse doit respecter les r\xE8gles classiques","La danse n'est qu'un divertissement"],a:1}]},{id:"h_me4",title:"La dramaturgie contemporaine \u2014 Kolt\xE8s, Lagarce, Mouawad",cat:"Dramaturgie",icon:"\u{1F4D6}",dur:"12 min",xp:50,content:["Bernard-Marie Kolt\xE8s (1948\u20131989) : une urgence incandescente. Ses textes sont des cris qui refusent la lin\xE9arit\xE9 narrative. Dans la solitude des champs de coton \u2014 une sc\xE8ne, deux personnages, une nuit d'attente charg\xE9e d'amour et de violence suspendue. Roberto Zucco \u2014 un assassin sans remords qui fascine. L'\xE9criture est musicale, jamais neutre.","Jean-Luc Lagarce (1957\u20131995) : Juste la fin du monde raconte un homme mourant qui revient voir sa famille \u2014 mais le spectacle est surtout leurs r\xE9actions, leurs non-dits, leurs efforts. L'\xE9criture est faite de b\xE9gaiements, de retours en arri\xE8re, de phrases qui se d\xE9ploient mais ne se terminent jamais vraiment.","Wajdi Mouawad (n\xE9 en 1968) : Incendies \u2014 une pi\xE8ce monumentale sur la m\xE9moire familiale, la vengeance, les secrets. Le texte est \xE9pique, avec des sauts temporels, des ch\u0153urs. Une th\xE9\xE2tralit\xE9 totale o\xF9 le drame personnel devient cosmique.","La dramaturgie contemporaine : elle refuse le bien-faire traditionnel. Elle s\xE8me l'angoisse, la beaut\xE9, la confusion. Elle demande au spectateur de faire du sens lui-m\xEAme, pas de lui livrer une histoire ficel\xE9e. C'est un th\xE9\xE2tre o\xF9 la forme ET le contenu sont politiques."],quiz:[{q:"Quel est le sujet principal de 'Juste la fin du monde' de Lagarce ?",o:["Un assassin qui terrorise la ville","Un homme mourant qui revient voir sa famille","Une femme qui fuit sa maison","Un amour impossible entre deux hommes"],a:1},{q:"Qu'est-ce qui caract\xE9rise l'\xE9criture de Kolt\xE8s ?",o:["Elle est directe et transparente","Elle est musicale et refusant la lin\xE9arit\xE9","Elle suit les lois du drame classique","Elle est minimaliste"],a:1},{q:"Quel est l'effet d'une dramaturgie contemporaine sur le spectateur ?",o:["Elle lui fournit une histoire claire","Elle lui demande de faire du sens lui-m\xEAme","Elle le repose avec une belle histoire","Elle l'endort"],a:1}]}],monstre:[{id:"h_mo1",title:"Le m\xE9tier de com\xE9dien",cat:"Industrie",icon:"\u{1F3AD}",dur:"15 min",xp:50,content:["Le statut d'intermittent du spectacle : 507 heures de travail d\xE9clar\xE9es sur 12 mois pour ouvrir des droits \xE0 l'assurance ch\xF4mage. Un syst\xE8me unique au monde, cr\xE9\xE9 en 1936, constamment menac\xE9 et constamment d\xE9fendu.","Le parcours type : formation (conservatoire, \xE9cole priv\xE9e, compagnie), premiers r\xF4les (courts m\xE9trages, figuration, petites salles), castings (CV, bande d\xE9mo, photo, agent), construction progressive d'un r\xE9seau et d'une r\xE9putation.","Les grandes \xE9coles : le CNSAD (Conservatoire National Sup\xE9rieur d'Art Dramatique \u2014 l'\xE9cole de la Com\xE9die-Fran\xE7aise), le TNS (Th\xE9\xE2tre National de Strasbourg), l'ENSATT (Lyon), le Cours Florent, l'ESAD, les conservatoires r\xE9gionaux.","La r\xE9alit\xE9 \xE9conomique : seuls 3% des com\xE9diens vivent exclusivement de leur art. La plupart cumulent : doublage, voix off, formation, animation, mise en sc\xE8ne. La passion est le moteur \u2014 pas le salaire."],quiz:[{q:"Combien d'heures faut-il d\xE9clarer pour le statut d'intermittent ?",o:["307 heures","407 heures","507 heures","607 heures"],a:2},{q:"En quelle ann\xE9e le statut d'intermittent a-t-il \xE9t\xE9 cr\xE9\xE9 ?",o:["1920","1936","1945","1968"],a:1},{q:"Quel pourcentage de com\xE9diens vit exclusivement de son art ?",o:["3%","10%","25%","50%"],a:0}]},{id:"h_mo2",title:"L'\xE9cosyst\xE8me du spectacle vivant",cat:"Industrie",icon:"\u{1F3DB}\uFE0F",dur:"12 min",xp:40,content:["Le spectacle vivant en France : 250 000 emplois, 8 milliards d'euros de chiffre d'affaires. C'est un secteur \xE9conomique majeur, pas seulement un 'hobby culturel'.","Les structures de diffusion : 5 Th\xE9\xE2tres Nationaux (Com\xE9die-Fran\xE7aise, Od\xE9on, Chaillot, Colline, TNS), 38 CDN (Centres Dramatiques Nationaux), 76 Sc\xE8nes Nationales, des centaines de sc\xE8nes conventionn\xE9es et de compagnies ind\xE9pendantes.","Le financement : DRAC (Direction R\xE9gionale des Affaires Culturelles \u2014 \xC9tat), collectivit\xE9s territoriales (r\xE9gions, d\xE9partements, villes), billetterie (souvent moins de 30% du budget), m\xE9c\xE9nat priv\xE9 (encore faible en France compar\xE9 aux pays anglo-saxons).","L'agent artistique prend 10% des cachets de l'artiste. C'est un alli\xE9 indispensable pour acc\xE9der aux castings cin\xE9ma et TV. Au th\xE9\xE2tre, le r\xE9seau personnel reste plus important que l'agent."],quiz:[{q:"Combien de Th\xE9\xE2tres Nationaux existe-t-il en France ?",o:["3","5","7","10"],a:1},{q:"Quelle part du budget d'un th\xE9\xE2tre public la billetterie repr\xE9sente-t-elle en moyenne ?",o:["Moins de 30%","50%","70%","90%"],a:0},{q:"Que signifie DRAC ?",o:["Direction R\xE9gionale des Arts et de la Culture","Direction R\xE9gionale des Affaires Culturelles","D\xE9partement de Recherche en Art Contemporain","D\xE9l\xE9gation aux Relations Artistiques et Culturelles"],a:1}]},{id:"h_mo3",title:"Le th\xE9\xE2tre \xE9lisab\xE9thain",cat:"Histoire",icon:"\u{1F3DB}\uFE0F",dur:"12 min",xp:55,content:["Le th\xE9\xE2tre \xE9lisab\xE9thain (1558\u20131603, r\xE8gne d'\xC9lisabeth Ire) est l'\xE2ge d'or du th\xE9\xE2tre anglais. Shakespeare, Marlowe, Jonson \xE9crivent dans un contexte de modernit\xE9 politique, de confiance commerciale et de curiosit\xE9 intellectuelle. Londres devient le centre du monde th\xE9\xE2tral.","Le Globe Theatre (1599) incarne l'arch\xE9type : une structure circulaire, des galeries couvertes pour la noblesse, un parterre pour les 'groundlings' (le peuple debout), une sc\xE8ne sans d\xE9cor illusionniste. Les pi\xE8ces \xE9taient jou\xE9es \xE0 la lumi\xE8re du jour, sans d\xE9cor changeable, avec rapidit\xE9 de jeu.","Marlowe cr\xE9e le personnage de Faust et repousse les limites de la rh\xE9torique. Shakespeare invente le personnage psychologique complexe. Jonson cr\xE9e une com\xE9die de l'humeur (Each man in his humour) o\xF9 les caract\xE8res sont des types reconnaissables. Trois voix, trois visions.","Le public \xE9tait mixte : apprentis, marchands, noblesse, roi lui-m\xEAme. Une vraie d\xE9mocratie th\xE9\xE2trale. Et pourtant, les femmes ne jouaient pas \u2014 seuls les jeunes hommes glabre jouaient les r\xF4les f\xE9minins. Ce qui nous para\xEEt bizarre \xE9tait la norme du temps."],quiz:[{q:"En quelle p\xE9riode s'\xE9tend le th\xE9\xE2tre \xE9lisab\xE9thain ?",o:["1450\u20131500","1558\u20131603","1650\u20131700","1750\u20131800"],a:1},{q:"Quel \xE9tait le nom du plus c\xE9l\xE8bre th\xE9\xE2tre \xE9lisab\xE9thain ?",o:["The Rose","The Swan","The Globe","The Fortune"],a:2},{q:"Qui \xE9tait un des trois grands auteurs \xE9lisab\xE9thains avec Shakespeare ?",o:["Moli\xE8re","Marlowe","Corneille","Racine"],a:1}]},{id:"h_mo4",title:"Les techniques de casting et audition",cat:"Industrie",icon:"\u{1F3AD}",dur:"12 min",xp:50,content:["Le casting classique : le metteur en sc\xE8ne et l'assistant casting regardent les acteurs jouer une sc\xE8ne du texte (parfois improvis\xE9e, parfois m\xE9moris\xE9e). L'audition dure 2\u20135 minutes. Le metteur en sc\xE8ne observe : la pr\xE9sence, la compr\xE9hension du texte, l'instinct, la chimie avec les autres candidats.","Le tirage au sort : une tendance qui \xE9merge \u2014 notamment au CNSAD pour les entr\xE9es. Choisir les acteurs par tirage au sort plut\xF4t que par 'talent' remet en question les biais du casting. Certains metteurs en sc\xE8ne l'utilisent pour lib\xE9rer le processus cr\xE9atif (pas de favoritisme) \u2014 d'autres y voient une d\xE9mission du metteur en sc\xE8ne.","La self-tape (d\xE9j\xE0 vue) est devenue essentielle pour le cin\xE9ma et la TV. \xC0 l'\xE9poque du Covid, le th\xE9\xE2tre aussi a d\xFB s'adapter : casting par Zoom. Moins spontan\xE9, plus \xE9galitaire (pas besoin de se d\xE9placer \xE0 Paris), mais moins de pr\xE9sence physique.","L'enjeu \xE9thique : combattre les biais (sexisme, racisme, \xE2gisme, lookisme). Aveugle casting (pas de CV ni de photo, seulement la voix et le jeu). Diversit\xE9 intentionnelle. Certains th\xE9\xE2tres s'y engagent ; d'autres restent traditionnels. Le d\xE9bat est encore ouvert."],quiz:[{q:"Combien de temps dure en moyenne une audition th\xE9\xE2trale ?",o:["30 secondes","2\u20135 minutes","15\u201320 minutes","1 heure"],a:1},{q:"Qu'est-ce que l'aveugle casting ?",o:["Fermer les yeux pendant le jeu","Castings sans CV ni photo, bas\xE9s sur la voix et le jeu","Auditionner que des acteurs aveugles","Une technique de Stanislavski"],a:1},{q:"Qu'est-ce qui a acc\xE9l\xE9r\xE9 l'adoption du Zoom casting au th\xE9\xE2tre ?",o:["La mode","La pand\xE9mie de Covid","L'\xE9conomie d'argent","La pr\xE9f\xE9rence des acteurs"],a:1}]}],affiche:[{id:"h_af1",title:"Cr\xE9er son spectacle",cat:"Industrie",icon:"\u{1F3AC}",dur:"15 min",xp:50,content:["De l'id\xE9e au plateau : tout commence par un d\xE9sir \u2014 un texte qui vous hante, une histoire qui vous br\xFBle, une forme qui n'existe pas encore. Puis vient le temps de l'\xE9criture (ou du choix du texte), de la recherche de financement, de la constitution de l'\xE9quipe.","Le dossier artistique est LA pi\xE8ce ma\xEEtresse : note d'intention (votre vision du spectacle \u2014 pourquoi CE texte, pourquoi MAINTENANT), distribution pressentie, budget pr\xE9visionnel, calendrier de production, et votre parcours artistique.","Les r\xE9sidences de cr\xE9ation : des lieux (th\xE9\xE2tres, friches, compagnies) qui accueillent des artistes pendant 2 \xE0 6 semaines pour r\xE9p\xE9ter. Pr\xE9cieuses et tr\xE8s demand\xE9es \u2014 il faut candidater 12 \xE0 18 mois \xE0 l'avance. Les coproducteurs financent une partie en \xE9change de dates de repr\xE9sentation.","La diffusion : trouver des programmateurs qui ach\xE8teront votre spectacle. Le festival d'Avignon Off est un tremplin mais aussi un gouffre financier (10 000 \xE0 30 000\u20AC pour 3 semaines). L'ONDA (Office National de Diffusion Artistique) aide \xE0 la circulation des spectacles."],quiz:[{q:"Quel document est indispensable pour monter un spectacle ?",o:["Le script seul","Le dossier artistique","Un certificat m\xE9dical","L'avis du public"],a:1},{q:"Combien co\xFBte en moyenne une participation au festival d'Avignon Off ?",o:["1 000-3 000\u20AC","5 000-8 000\u20AC","10 000-30 000\u20AC","50 000\u20AC+"],a:2},{q:"Que signifie ONDA ?",o:["Organisation Nationale des Arts","Office National de Diffusion Artistique","Observatoire National du Drame et des Arts","Ordre National des Directeurs Artistiques"],a:1}]},{id:"h_af2",title:"Le th\xE9\xE2tre et le cin\xE9ma",cat:"Techniques",icon:"\u{1F4F9}",dur:"10 min",xp:40,content:["Th\xE9\xE2tre et cin\xE9ma : deux arts qui partagent l'acteur mais s'opposent en tout. Au th\xE9\xE2tre : jeu large, projection vocale, pr\xE9sence physique totale, pas de montage \u2014 une seule prise qui dure toute la soir\xE9e. Au cin\xE9ma : jeu minimaliste, micro-expressions, intimit\xE9 avec la cam\xE9ra, fragments mont\xE9s.","Les plus grands passent de l'un \xE0 l'autre : Isabelle Huppert, Denis Podalyd\xE8s, Emmanuelle Devos, Vincent Macaigne. Chacun adapte son instrument. Le pi\xE8ge : 'jouer comme au th\xE9\xE2tre' devant une cam\xE9ra (sur-jouer) ou 'jouer comme au cin\xE9ma' sur sc\xE8ne (sous-jouer pour le dernier rang).","La self-tape est devenue le mode de casting dominant au cin\xE9ma et en s\xE9rie. C'est un art en soi : cadrage, lumi\xE8re, jeu pour la cam\xE9ra, choix de la prise. Un bon acteur de self-tape n'est pas forc\xE9ment un bon acteur de plateau \u2014 et inversement.","Le passage du th\xE9\xE2tre au cin\xE9ma enrichit l'acteur : le th\xE9\xE2tre donne l'endurance, la voix, la pr\xE9sence ; le cin\xE9ma donne la subtilit\xE9, le naturel, la conscience de la cam\xE9ra. Les meilleurs ma\xEEtrisent les deux."],quiz:[{q:"Quelle est la principale diff\xE9rence de jeu entre th\xE9\xE2tre et cin\xE9ma ?",o:["Le costume","L'amplitude du jeu (large vs minimaliste)","Le salaire","Le texte"],a:1},{q:"Qu'est-ce qu'une self-tape ?",o:["Un enregistrement audio","Un casting film\xE9 par l'acteur lui-m\xEAme","Un cours en ligne","Un selfie de tournage"],a:1}]},{id:"h_af3",title:"L'\xE9criture contemporaine",cat:"Auteurs",icon:"\u2712\uFE0F",dur:"12 min",xp:45,content:["Bernard-Marie Kolt\xE8s (1948\u20131989) : une \xE9criture incandescente, musicale, nocturne. Dans la solitude des champs de coton, Roberto Zucco, Combat de n\xE8gre et de chiens. Kolt\xE8s \xE9crit sur la rencontre impossible, le d\xE9sir, la marginalit\xE9. Ses phrases sont longues, sinueuses, comme un jazz verbal.","Jean-Luc Lagarce (1957\u20131995) : l'auteur le plus jou\xE9 en France apr\xE8s Moli\xE8re. Juste la fin du monde, Derniers remords avant l'oubli, Nous les h\xE9ros. Son \xE9criture est faite de r\xE9p\xE9titions, de parenth\xE8ses, de phrases qui se reprennent et se corrigent \u2014 comme la pens\xE9e r\xE9elle.","Wajdi Mouawad (n\xE9 en 1968) : Incendies, Littoral, For\xEAts, Ciels \u2014 des fresques \xE9piques sur la guerre, l'exil, la m\xE9moire familiale. Un th\xE9\xE2tre qui m\xEAle mythologie, actualit\xE9 politique et \xE9motion brute. Il dirige le Th\xE9\xE2tre de la Colline depuis 2016.","Jo\xEBl Pommerat (n\xE9 en 1963) : il n'\xE9crit pas puis met en sc\xE8ne \u2014 il \xE9crit PAR la mise en sc\xE8ne. Ses spectacles naissent en r\xE9p\xE9tition. \xC7a ira (1) Fin de Louis est une r\xE9\xE9criture de la R\xE9volution fran\xE7aise ; La R\xE9unification des deux Cor\xE9es explore l'amour sous toutes ses formes."],quiz:[{q:"Quel auteur contemporain est le plus jou\xE9 en France apr\xE8s Moli\xE8re ?",o:["Kolt\xE8s","Lagarce","Mouawad","Pommerat"],a:1},{q:"Qu'est-ce qui caract\xE9rise l'\xE9criture de Kolt\xE8s ?",o:["Des phrases courtes et percutantes","Des phrases longues et musicales, comme du jazz","Du vers classique","De la prose minimaliste"],a:1},{q:"Quelle est la particularit\xE9 de la m\xE9thode de Pommerat ?",o:["Il \xE9crit seul pendant 5 ans","Il \xE9crit PAR la mise en sc\xE8ne, en r\xE9p\xE9tition","Il n'utilise que des classiques","Il travaille sans acteurs"],a:1}]},{id:"h_af4",title:"Le th\xE9\xE2tre engag\xE9 \u2014 Boal et le th\xE9\xE2tre de l'opprim\xE9",cat:"Techniques",icon:"\u{1F3AD}",dur:"12 min",xp:50,content:["Augusto Boal (1931\u20132009), dramaturge br\xE9silien, invente le 'Th\xE9\xE2tre de l'Opprim\xE9' dans les ann\xE9es 1960. Son conviction : le th\xE9\xE2tre ne doit pas seulement divertir ou \xE9mouvoir, il doit transformer. Il doit donner une voix aux sans-voix et permettre au spectateur de devenir 'spect-acteur'.","Le jeu du Spect-Acteur : pendant la repr\xE9sentation, \xE0 un moment cl\xE9, le jeu s'arr\xEAte et les spectateurs peuvent monter sur sc\xE8ne pour remplacer un acteur et improviser une solution. Qu'auriez-vous fait \xE0 sa place ? Le th\xE9\xE2tre devient un laboratoire d'action sociale.","Les Jeux dramatiques pour l'opprim\xE9 : des jeux de r\xF4le collectifs qui permettent d'explorer des situations conflictuelles (patron/salari\xE9, homme/femme, classe sup\xE9rieure/classe inf\xE9rieure). Le but n'est pas d'agir mais de PENSER, de comprendre les m\xE9canismes de l'oppression, d'imaginer des r\xE9sistances.","L'h\xE9ritage de Boal : du Br\xE9sil au monde entier, le Th\xE9\xE2tre de l'Opprim\xE9 inspire les mouvements f\xE9ministes, antiracistes, \xE9cologistes. Il inspire aussi les processus de dialogue en entreprise et en politique. Le th\xE9\xE2tre de Boal dit : tu es peut-\xEAtre une victime, mais tu es aussi capable de changer les choses."],quiz:[{q:"Quel est le contexte d'invention du Th\xE9\xE2tre de l'Opprim\xE9 par Boal ?",o:["Les ann\xE9es 1950 aux USA","Les ann\xE9es 1960 au Br\xE9sil","Les ann\xE9es 1970 en Europe","Les ann\xE9es 1980 en Afrique"],a:1},{q:"Qu'est-ce qu'un spect-acteur selon Boal ?",o:["Un acteur qui regarde","Un spectateur qui peut remplacer un acteur et improviser une solution","Un professionnel qui ne joue pas","Un metteur en sc\xE8ne amateur"],a:1},{q:"Quel est le but des jeux dramatiques pour l'opprim\xE9 ?",o:["Divertir","Agir imm\xE9diatement pour changer le monde","Penser et comprendre les m\xE9canismes de l'oppression","\xC9valuer la comp\xE9tence des acteurs"],a:2}]}],etoile:[{id:"h_et1",title:"Le festival d'Avignon",cat:"Industrie",icon:"\u{1F3DB}\uFE0F",dur:"12 min",xp:45,content:["Fond\xE9 en 1947 par Jean Vilar dans la Cour d'honneur du Palais des Papes, le Festival d'Avignon est le plus grand et le plus prestigieux festival de th\xE9\xE2tre au monde. Vilar voulait un 'th\xE9\xE2tre populaire' accessible \xE0 tous.","Le 'In' (programmation officielle, environ 40 spectacles) est dirig\xE9 par un artiste-directeur (Olivier Py, puis Tiago Rodrigues depuis 2023). La Cour d'honneur (2 000 places en plein air) est le saint des saints \u2014 y jouer est une cons\xE9cration.","Le 'Off' (n\xE9 en 1966) est un festival parall\xE8le libre : plus de 1 500 spectacles dans 130 lieux pendant 3 semaines. C'est le plus grand march\xE9 du spectacle vivant \u2014 des carri\xE8res se lancent et se brisent en juillet \xE0 Avignon.","Chaque \xE9t\xE9, la ville enti\xE8re (90 000 habitants) se transforme : les rues sont des sc\xE8nes, les affiches recouvrent les murs, 700 000 entr\xE9es au Off, 100 000 au In. Avignon est le pouls du th\xE9\xE2tre francophone \u2014 et de plus en plus international."],quiz:[{q:"En quelle ann\xE9e le Festival d'Avignon est-il fond\xE9 ?",o:["1937","1947","1957","1967"],a:1},{q:"Combien de spectacles environ sont pr\xE9sent\xE9s dans le Off ?",o:["200","500","1 000","1 500+"],a:3},{q:"Qui est le directeur du Festival d'Avignon depuis 2023 ?",o:["Olivier Py","Tiago Rodrigues","Thomas Ostermeier","Wajdi Mouawad"],a:1}]},{id:"h_et2",title:"L'h\xE9ritage de Stanislavski",cat:"Techniques",icon:"\u{1F3AD}",dur:"12 min",xp:45,content:["Constantin Stanislavski (1863\u20131938) est le p\xE8re de la formation moderne de l'acteur. Son 'Syst\xE8me' est la base de presque toutes les \xE9coles de jeu dans le monde, m\xEAme celles qui s'y opposent.","Les principes cl\xE9s : la 'v\xE9rit\xE9' du jeu (ne pas 'montrer' l'\xE9motion mais cr\xE9er les conditions pour qu'elle \xE9merge), le 'si magique' (si j'\xE9tais dans cette situation, que ferais-je ?), la 'm\xE9moire affective' (utiliser ses souvenirs pour nourrir le jeu).","Lee Strasberg l'adapte aux \xC9tats-Unis sous le nom de 'Method Acting' \xE0 l'Actors Studio. Brando, De Niro, Pacino, Hoffman, Streep \u2014 tous form\xE9s \xE0 la M\xE9thode. Mais Strasberg pousse la m\xE9moire affective plus loin que Stanislavski, ce qui cr\xE9e des controverses (acteurs qui ne sortent plus de leur personnage).","Stella Adler et Sanford Meisner proposent des alternatives \xE0 Strasberg : Adler insiste sur l'imagination (pas besoin de souffrir pour jouer la souffrance), Meisner sur l'\xE9coute et la r\xE9action (le jeu na\xEEt de la relation \xE0 l'autre, pas de l'introspection). Ces trois branches se disputent l'h\xE9ritage de Stanislavski encore aujourd'hui."],quiz:[{q:"Quel est le principe du 'si magique' de Stanislavski ?",o:["Utiliser des tours de magie sur sc\xE8ne","Se demander 'si j'\xE9tais dans cette situation, que ferais-je ?'","Croire que le th\xE9\xE2tre est magique","Hypnotiser le public"],a:1},{q:"Qui a adapt\xE9 Stanislavski aux \xC9tats-Unis sous le nom de Method Acting ?",o:["Stella Adler","Sanford Meisner","Lee Strasberg","Michael Chekhov"],a:2},{q:"Sur quoi Sanford Meisner insiste-t-il ?",o:["La m\xE9moire affective","L'\xE9coute et la r\xE9action \xE0 l'autre","L'improvisation libre","Le travail physique"],a:1}]},{id:"h_et3",title:"Le th\xE9\xE2tre de demain",cat:"Histoire",icon:"\u2B50",dur:"10 min",xp:50,content:["Le th\xE9\xE2tre virtuel et augment\xE9 : des compagnies exp\xE9rimentent avec la r\xE9alit\xE9 virtuelle (le spectateur porte un casque VR et \xE9volue dans un d\xE9cor virtuel), la r\xE9alit\xE9 augment\xE9e (des \xE9l\xE9ments num\xE9riques se superposent \xE0 la sc\xE8ne r\xE9elle), et la motion capture en temps r\xE9el.","L'intelligence artificielle au th\xE9\xE2tre : des spectacles co-\xE9crits par des IA, des acteurs num\xE9riques, des mises en sc\xE8ne g\xE9n\xE9r\xE9es algorithmiquement. La question n'est pas 'l'IA va-t-elle remplacer l'acteur ?' mais 'qu'est-ce que l'IA r\xE9v\xE8le de ce qui est irrempla\xE7able chez l'acteur ?'","Le th\xE9\xE2tre engag\xE9 du XXIe si\xE8cle : \xE9cof\xE9minisme, d\xE9colonialit\xE9, handicap sur sc\xE8ne, neurodiversit\xE9. Le th\xE9\xE2tre refl\xE8te et anticipe les mutations sociales. Des compagnies comme DV8, Gob Squad, Forced Entertainment repoussent les fronti\xE8res.","Ce qui ne changera jamais : un \xEAtre humain vivant devant d'autres \xEAtres humains vivants, dans le m\xEAme espace, au m\xEAme moment. C'est irrempla\xE7able par aucune technologie. Et c'est pour \xE7a que le th\xE9\xE2tre existe depuis 2 500 ans."],quiz:[{q:"Quelle question pose l'utilisation de l'IA au th\xE9\xE2tre ?",o:["Comment remplacer les acteurs","Qu'est-ce qui est irrempla\xE7able chez l'acteur","Comment r\xE9duire les co\xFBts","Comment attirer les jeunes"],a:1},{q:"Depuis combien de temps le th\xE9\xE2tre existe-t-il ?",o:["500 ans","1 000 ans","2 500 ans","5 000 ans"],a:2}]},{id:"h_et4",title:"L'avenir du th\xE9\xE2tre \u2014 num\xE9rique, immersif, post-dramatique",cat:"Histoire",icon:"\u2B50",dur:"12 min",xp:55,content:["Le th\xE9\xE2tre post-dramatique (terme de Hans-Thies Lehmann, 1999) : le drame n'est plus au centre. La psychologie du personnage, la progression lin\xE9aire, la vraisemblance \u2014 tout peut \xEAtre d\xE9construit. La forme prime sur la narration. Des images se juxtaposent sans causalit\xE9 logique. L'\xE9motion na\xEEt du choc des formes.","Le th\xE9\xE2tre immersif : le spectateur n'est plus assis face \xE0 la sc\xE8ne. Il est plong\xE9 dans l'univers du spectacle. Punchdrunk (Anglais) cr\xE9e des mondes \xE0 explorer librement. Vous marchez dans les couloirs d'un h\xF4tel hant\xE9, d\xE9couvrez des sc\xE8nes priv\xE9es, construisez votre propre narration. C'est du th\xE9\xE2tre-jeu vid\xE9o.","La r\xE9alit\xE9 virtuelle et augment\xE9e : des compagnies exp\xE9rimentent le 'th\xE9\xE2tre en VR'. Un spectateur porte un casque VR et incarne un personnage dans un monde virtuel. La fronti\xE8re entre spectateur et acteur s'efface. Mais la question demeure : o\xF9 est la pr\xE9sence humaine qui fonde le th\xE9\xE2tre ?","Ce que l'avenir ne peut pas remplacer : deux \xEAtres humains vivants, ici et maintenant, dans le m\xEAme espace, cr\xE9ant ensemble un moment irrempla\xE7able. Les technologies viendront enrichir cette essence \u2014 jamais la remplacer. Le th\xE9\xE2tre vivra aussi longtemps que les humains voudront se rencontrer."],quiz:[{q:"Que signifie 'post-dramatique' selon Lehmann ?",o:["Apr\xE8s la fin du drame","Le drame n'est plus au centre ; la forme prime","Drama supprim\xE9 compl\xE8tement","Un nouveau genre dramatique"],a:1},{q:"Quel groupe cr\xE9e du th\xE9\xE2tre immersif explorable librement ?",o:["DV8","Gob Squad","Punchdrunk","Forced Entertainment"],a:2},{q:"Qu'est-ce qui restera irrempla\xE7able au th\xE9\xE2tre ?",o:["Les effets sp\xE9ciaux","La r\xE9alit\xE9 virtuelle","La pr\xE9sence humaine vivante dans le m\xEAme espace","Les costumes technologiquement avanc\xE9s"],a:2}]}]},RARITY={C:{name:"Commun",color:"#8b8b8b",bg:"rgba(139,139,139,.08)",border:"rgba(139,139,139,.2)"},R:{name:"Rare",color:"var(--blue)",bg:"rgba(79,195,247,.08)",border:"rgba(79,195,247,.2)"},E:{name:"\xC9pique",color:"var(--purple)",bg:"rgba(171,71,188,.08)",border:"rgba(171,71,188,.25)"},L:{name:"L\xE9gendaire",color:"var(--gold)",bg:"var(--gold-glow)",border:"rgba(224,184,78,.3)"}},BADGES=[{id:"b1",n:"B\xE9b\xE9 Com\xE9dien",ic:"\u{1F37C}",d:"Terminer son 1er exercice",r:"C",c:s=>s.doneEx.length>=1},{id:"b2",n:"Petit Curieux",ic:"\u{1F423}",d:"Terminer sa 1\xE8re le\xE7on culture",r:"C",c:s=>s.doneCu.length>=1},{id:"b3",n:"\xC7a Commence !",ic:"\u{1F3AC}",d:"Gagner 100 XP",r:"C",c:s=>s.xp-(s.initialXp||0)>=100},{id:"b39",n:"Premier Regard",ic:"\u{1F50D}",d:"Terminer sa 1\xE8re analyse de sc\xE8ne",r:"C",c:s=>s.doneSA.length>=1},{id:"b4",n:"L'Acharn\xE9\xB7e",ic:"\u{1F525}",d:"3 jours de suite",r:"C",c:s=>s.streak>=3},{id:"b5",n:"Flamme \xC9ternelle",ic:"\u{1F56F}\uFE0F",d:"7 jours de suite",r:"R",c:s=>s.streak>=7},{id:"b6",n:"Machine de Guerre",ic:"\u2699\uFE0F",d:"14 jours de suite",r:"E",c:s=>s.streak>=14},{id:"b7",n:"Poss\xE9d\xE9\xB7e du Th\xE9\xE2tre",ic:"\u{1F47B}",d:"30 jours de suite",r:"L",c:s=>s.streak>=30},{id:"b8",n:"Touche-\xE0-Tout",ic:"\u{1F3A8}",d:"5 exercices termin\xE9s",r:"C",c:s=>s.doneEx.length>=5},{id:"b9",n:"Bosseur\xB7se",ic:"\u{1F4AA}",d:"10 exercices termin\xE9s",r:"C",c:s=>s.doneEx.length>=10},{id:"b10",n:"Accro aux Planches",ic:"\u{1FAB5}",d:"20 exercices termin\xE9s",r:"R",c:s=>s.doneEx.length>=20},{id:"b11",n:"Rat de R\xE9p\xE9tition",ic:"\u{1F42D}",d:"30 exercices termin\xE9s",r:"E",c:s=>s.doneEx.length>=30},{id:"b37",n:"Titan des Planches",ic:"\u{1F3C6}",d:"50 exercices termin\xE9s",r:"L",c:s=>s.doneEx.length>=50},{id:"b12",n:"Rat de Biblioth\xE8que",ic:"\u{1F4DA}",d:"5 le\xE7ons culture"
