es petits.","Jouez le passage d'un status \xE0 l'autre en une sc\xE8ne."],note:"Le status n'est pas le pouvoir : c'est ce que votre corps annonce avant que vous parliez. Toute la com\xE9die na\xEEt de son renversement.",tip:"Le status est le c\u0153ur du travail de Keith Johnstone."},{id:"so_m1",title:"Monologue \u2014 l'aveu",cat:"Monologue",icon:"\u{1F3AC}",dur:"25 min",xp:100,type:"video",premium:!0,author:"Texte original \u2014 Castigat",text:"\xAB Il faut que je te dise quelque chose. \xC7a fait longtemps que je porte \xE7a, et si je ne le dis pas maintenant, je ne le dirai jamais. Ce n'est pas un secret \u2014 c'est une v\xE9rit\xE9 que j'ai eu peur de regarder en face. \xBB",instructions:["\xC0 qui parlez-vous ? D\xE9cidez avant de commencer.","L'aveu doit co\xFBter quelque chose \u2014 on voit la difficult\xE9.","Trouvez le moment exact o\xF9 le personnage d\xE9cide de parler.","Filmez en plan serr\xE9, regard cam\xE9ra."]},{id:"so_r2",title:"La respiration contr\xF4l\xE9e en jeu",cat:"Respiration",icon:"\u{1F32C}\uFE0F",dur:"15 min",xp:60,type:"ex",steps:["Jouez une sc\xE8ne avec partenaire (ou enregistr\xE9).","Marquez \xE0 l'avance o\xF9 vous respirez \u2014 avant chaque r\xE9plique.","Utilisez votre respiration comme un outil de mise en sc\xE8ne.","Acc\xE9l\xE9rez les respirations en tension, ralentissez en calme."],note:"La respiration d'un acteur donne le tempo \xE0 toute la salle. Le public respire avec vous sans le savoir.",tip:"Mnouchkine dit que la respiration d'un acteur cr\xE9e le rythme du spectacle."},{id:"so_c3",title:"Un seul d\xE9tail, tenu",cat:"Corps",icon:"\u{1F3CB}",dur:"20 min",xp:65,type:"ex",steps:["Choisissez un personnage et un seul d\xE9tail : une main qui ne se pose jamais, une \xE9paule plus haute, un regard qui part \xE0 droite avant chaque r\xE9ponse.","Tenez ce d\xE9tail pendant deux minutes de vie ordinaire : rangez une pi\xE8ce, pr\xE9parez un caf\xE9, en restant ce personnage.","Ajoutez la parole : commentez \xE0 voix haute ce que vous faites, sans l\xE2cher le d\xE9tail.","L\xE2chez-le volontairement au milieu d'une phrase. Notez ce qui s'effondre.","Reprenez-le et tenez-le cinq minutes d'affil\xE9e."],note:"Un personnage n'est pas une collection de tics. C'est un seul d\xE9tail assez pr\xE9cis pour qu'on ne puisse plus vous imaginer autrement \u2014 et assez petit pour tenir toute la pi\xE8ce.",tip:"Les acteurs qu'on n'oublie pas ont rarement dix id\xE9es par r\xF4le. Ils en ont une, et ils la tiennent trois heures."}],interprete:[{id:"in_r1",title:"O\xF9 le son se pose",cat:"Respiration",icon:"\u{1F32C}\uFE0F",dur:"15 min",xp:55,type:"ex",steps:["Posez une main \xE0 plat sur le sternum. Dites un \xAB aaa \xBB long et laissez-le venir. Sentez o\xF9 \xE7a vibre sous la main.","Refaites-le en imaginant que vous appelez quelqu'un \xE0 l'autre bout d'un champ. Le son monte, il se place devant. La main sent moins.","Refaites-le en parlant \xE0 quelqu'un d'endormi juste \xE0 c\xF4t\xE9 de vous. Le son descend, il reste en arri\xE8re. La main sent davantage.","Refaites-le en retenant quelque chose que vous ne voulez pas dire. Le son se serre."],note:"La voix suit la situation avant de suivre le sentiment. Cherchez \xE0 qui vous parlez et \xE0 quelle distance \u2014 le placement viendra seul.",tip:"La voix suit la situation avant de suivre le sentiment. Cherchez \xE0 qui vous parlez et \xE0 quelle distance \u2014 le placement viendra tout seul."},{id:"in_d1",title:"Texte en langues",cat:"Diction",icon:"\u{1F5E3}\uFE0F",dur:"12 min",xp:45,type:"ex",extrait:"Au voleur ! au voleur ! \xE0 l'assassin ! au meurtrier ! Justice, juste ciel ! Je suis perdu, je suis assassin\xE9, on m'a coup\xE9 la gorge, on m'a d\xE9rob\xE9 mon argent.",source:"Moli\xE8re \u2014 L'Avare, IV, 7",steps:["Dites le texte \xE9pingl\xE9 en fran\xE7ais, normalement.","Redites-le avec un accent anglais tr\xE8s marqu\xE9. Notez ce que l'accent fait aux consonnes.","Redites-le avec un accent italien, puis russe. Notez ce que chacun fait au rythme.","Revenez au fran\xE7ais sans accent, imm\xE9diatement apr\xE8s."],note:"Chaque accent d\xE9place les points d'appui dans la bouche. En revenant au fran\xE7ais, on entend soudain sa propre langue comme une mati\xE8re.",tip:"Peter Brook faisait travailler ses acteurs en langues invent\xE9es."},{id:"in_c1",title:"L'animal int\xE9rieur",cat:"Corps",icon:"\u{1F3CB}",dur:"20 min",xp:60,type:"ex",steps:["Choisissez un animal : chat, loup, oiseau, serpent.","Bougez comme lui pendant 5 minutes.","Progressivement, tenez-vous debout en gardant son essence.","Ajoutez un texte \u2014 votre voix est color\xE9e par l'animal.","Votre personnage a un animal int\xE9rieur \u2014 trouvez-le."],note:"De Niro s'est inspir\xE9 d'un crabe pour Taxi Driver. L'animal ne se joue pas : il reste dans le corps quand on l'a rang\xE9.",tip:"De Niro s'est inspir\xE9 d'un crabe pour jouer dans Taxi Driver."},{id:"in_i1",title:"Le non-dit en sc\xE8ne",cat:"Intentions",icon:"\u{1F3AD}",dur:"20 min",xp:60,type:"ex",steps:["Sc\xE8ne : deux personnes \xE0 table, en silence.","Jouez : ils viennent de se disputer.","Ils sont amoureux mais ne l'ont pas dit.","L'un sait que l'autre va partir."],note:"Tchekhov \xE9crit des sc\xE8nes o\xF9 l'on parle du temps qu'il fait pendant qu'une vie s'effondre. Tout est dans ce qui n'est pas dit.",tip:"Tchekhov : l'essentiel est dans ce qui n'est pas dit."},{id:"in_s1",title:"Sc\xE8ne \xE0 sous-texte",cat:"Sc\xE8ne",icon:"\u{1F3AD}",dur:"25 min",xp:75,type:"ex",steps:["Sc\xE8ne banale : deux coll\xE8gues parlent de la m\xE9t\xE9o.","Sous-texte : l'un est amoureux de l'autre.","Jouez les deux r\xF4les (enregistrez le partenaire)."],note:"Les meilleures sc\xE8nes ne parlent jamais de ce dont elles parlent. Le public comprend par le regard et le rythme, pas par les mots.",tip:"Les meilleures sc\xE8nes ne parlent jamais de ce dont elles parlent."},{id:"in_c2",title:"Composition physique",cat:"Corps",icon:"\u{1F3CB}",dur:"20 min",xp:60,type:"ex",steps:["Cr\xE9ez un personnage de 70 ans.","Trouvez : le dos, les mains, le rythme de marche.","Cr\xE9ez un personnage de 8 ans \u2014 le contraste total.","Alternez entre les deux en 10 secondes."],note:"Un corps peut tout jouer, mais pas d'un coup : ce sont trois ou quatre r\xE9glages pr\xE9cis \u2014 le dos, les mains, le rythme, la hauteur du regard.",tip:"Laurence Olivier changeait physiquement pour chaque r\xF4le."},{id:"in_m1",title:"Monologue contemporain",cat:"Monologue",icon:"\u{1F3AC}",dur:"30 min",xp:120,type:"video",premium:!0,author:"Texte contemporain \u2014 Castigat",text:"\xAB Tu sais ce que c'est, toi, la solitude ? C'est pas \xEAtre seul dans une pi\xE8ce. C'est \xEAtre entour\xE9 de gens et sentir que personne ne te voit vraiment. Alors tu joues. Tu joues tellement bien que tu finis par oublier qui tu es sous le masque. \xBB",instructions:["R\xE9\xE9crivez avec vos mots d'abord.","Trouvez votre connexion personnelle.","La v\xE9rit\xE9, pas le jeu.","Filmez en plan serr\xE9 pour les micro-expressions."]},{id:"in_d2",title:"Deux \xE9critures, deux bouches",cat:"Diction",icon:"\u{1F5E3}\uFE0F",dur:"15 min",xp:55,type:"ex",extrait:`Je veux qu'on soit sinc\xE8re, et qu'en homme d'honneur
On ne l\xE2che aucun mot qui ne parte du c\u0153ur.

\u2014 \u2014 \u2014

Parce que vous \xEAtes un grand seigneur, vous vous croyez un grand g\xE9nie ! Noblesse, fortune, un rang, des places : tout cela rend si fier ! Qu'avez-vous fait pour tant de biens ? Vous vous \xEAtes donn\xE9 la peine de na\xEEtre, et rien de plus.`,source:"Moli\xE8re \u2014 Le Misanthrope (vers) \xB7 Beaumarchais \u2014 Le Mariage de Figaro (prose)",steps:["Dites les deux vers de Moli\xE8re : la pens\xE9e tient dans le vers, elle est d\xE9j\xE0 taill\xE9e.","Dites la tirade de Figaro : la pens\xE9e d\xE9borde, se relance, s'emballe. Ne la d\xE9coupez pas en vers.","Refaites Moli\xE8re avec le d\xE9bit de Figaro. \xC9coutez comme \xE7a sonne faux.","Refaites Figaro avec la tenue de Moli\xE8re. \xC9coutez comme \xE7a s'\xE9teint.","Redites chacun \xE0 sa place, l'un apr\xE8s l'autre."],note:"Il n'y a pas une bonne diction : il y en a une par auteur. La v\xF4tre doit se plier \xE0 l'\xE9criture, jamais l'inverse.",tip:"Chaque auteur \xE9crit pour une bouche particuli\xE8re. Servir cette bouche-l\xE0, c'est la moiti\xE9 du travail d'interpr\xE9tation."},{id:"in_im1",title:"L'improvisation de caract\xE8re",cat:"Improvisation",icon:"\u{1F3AD}",dur:"20 min",xp:60,type:"ex",steps:["Tirez un personnage au hasard : boulanger, avocate, clochard.","Improvisez 3 minutes EN TANT QUE ce personnage.","Parlez de votre m\xE9tier, votre vie, votre secret."],note:"L'improvisation ne teste pas votre imagination, mais votre capacit\xE9 \xE0 rester quelqu'un pendant trois minutes sans rien pr\xE9parer.",tip:"Viola Spolin : \xAB L'improvisation, c'est accepter ce qui vient, sans juge int\xE9rieur. \xBB"}],artiste:[{id:"ar_r1",title:"Voix et espace",cat:"Respiration",icon:"\u{1F32C}\uFE0F",dur:"15 min",xp:60,type:"ex",steps:["Parlez face au mur \u2014 sentez le son rebondir.","Tournez-vous vers l'espace ouvert \u2014 projetez.","Dans un coin \u2014 la voix s'amplifie naturellement.","Au centre de la pi\xE8ce \u2014 elle se disperse."],note:"Un acteur sent l'acoustique d'un lieu en trente secondes et r\xE8gle sa voix dessus. C'est une habitude, pas un don.",tip:"Un acteur sent l'acoustique d'un lieu en 30 secondes."},{id:"ar_d1",title:"Le texte musical",cat:"Diction",icon:"\u{1F5E3}\uFE0F",dur:"15 min",xp:55,type:"ex",extrait:`Perc\xE9 jusques au fond du c\u0153ur
D'une atteinte impr\xE9vue aussi bien que mortelle,
Mis\xE9rable vengeur d'une juste querelle,
Et malheureux objet d'une injuste rigueur,
Je demeure immobile, et mon \xE2me abattue
C\xE8de au coup qui me tue.`,source:"Corneille \u2014 Le Cid, stances de Rodrigue",steps:["Dites le texte \xE9pingl\xE9 comme du rap : trouvez le beat, appuyez les temps forts.","Redites-le comme une berceuse : legato, sans aucune ar\xEAte.","Redites-le comme un discours politique : martel\xE9, adress\xE9 \xE0 une foule.","Redites-le une derni\xE8re fois en gardant de chaque version ce qui servait le texte."],note:"Chaque auteur a sa musique \u2014 Shakespeare swingue, Racine chante, Corneille frappe. Trouver la musique, c'est d\xE9j\xE0 interpr\xE9ter.",tip:"Chaque auteur a sa musique. Shakespeare swingue, Racine chante, Kolt\xE8s percute."},{id:"ar_c1",title:"Le geste essentiel",cat:"Corps",icon:"\u{1F3CB}",dur:"20 min",xp:65,type:"ex",steps:["Jouez une sc\xE8ne avec plein de gestes.","Recommencez en enlevant la moiti\xE9 des gestes.","Encore : ne gardez que 3 gestes dans toute la sc\xE8ne."],note:"Grotowski voulait qu'un acteur se d\xE9pouille au lieu d'accumuler. Trois gestes tenus valent mieux que trente gestes comment\xE9s.",tip:"Grotowski : \xAB L'acteur doit se d\xE9pouiller, pas accumuler. \xBB"},{id:"ar_i1",title:"La rupture",cat:"Intentions",icon:"\u{1F3AD}",dur:"20 min",xp:65,type:"ex",steps:["Prenez un texte que vous connaissez. Choisissez ce que votre personnage veut obtenir au d\xE9but \u2014 un seul verbe : convaincre, faire avouer, retenir, humilier.","Jouez le d\xE9but avec cette seule tactique, sans en changer. Tenez-la m\xEAme quand \xE7a ne marche pas.","Rep\xE9rez la ligne exacte o\xF9 le personnage comprend que sa tactique a \xE9chou\xE9. C'est l\xE0 qu'est la rupture \u2014 pas ailleurs.","Sur cette ligne, changez de verbe. Il n'obtiendra pas en convainquant : il essaiera de blesser. Ou l'inverse. Rien d'autre ne change.","Rejouez le passage en entier. Le basculement doit tomber sur ce mot-l\xE0, pas deux r\xE9pliques plus loin.","Refaites-le avec un autre couple de verbes. Notez lequel rend la sc\xE8ne la plus dangereuse."],note:"Une rupture n'est pas un changement d'humeur : c'est le moment o\xF9 le personnage change d'arme parce que la premi\xE8re n'a pas march\xE9.",tip:"Une rupture, ce n'est pas passer d'une \xE9motion \xE0 une autre : c'est le moment o\xF9 le personnage change d'arme parce que la premi\xE8re n'a pas march\xE9. Huppert ne change pas d'humeur, elle change de tactique \u2014 et on ne voit pas la couture."},{id:"ar_s1",title:"La mise en sc\xE8ne instinctive",cat:"Sc\xE8ne",icon:"\u{1F3AD}",dur:"30 min",xp:90,type:"ex",steps:["Choisissez une sc\xE8ne courte.","Lisez-la une seule fois.","Jouez-la imm\xE9diatement \u2014 premier instinct.","Ne corrigez rien. Filmez."],note:"Le premier instinct est souvent juste \u2014 pas toujours bon, mais vivant. On le garde comme mati\xE8re, puis on travaille.",tip:"Peter Brook : \xAB Le premier instinct est souvent le bon. \xBB"},{id:"ar_m1",title:"Monologue \u2014 adresse au public",cat:"Monologue",icon:"\u{1F3AC}",dur:"25 min",xp:110,type:"video",premium:!0,author:"Texte original \u2014 Castigat",text:"\xAB Regardez-moi. Non, vraiment. Posez vos t\xE9l\xE9phones, vos pens\xE9es. Regardez-moi comme si c'\xE9tait la premi\xE8re fois. Parce que c'est la premi\xE8re fois. Chaque soir est la premi\xE8re fois. Et ce soir, j'ai quelque chose \xE0 vous dire. \xBB",instructions:["Ce texte casse le 4e mur.","L'adresse doit \xEAtre sinc\xE8re.","Vrai contact visuel avec la cam\xE9ra.","Trouvez l'urgence."]},{id:"ar_d2",title:"Quand la phrase d\xE9borde le vers",cat:"Diction",icon:"\u{1F5E3}\uFE0F",dur:"15 min",xp:55,type:"ex",extrait:`Serait-ce d\xE9j\xE0 lui ? C'est bien \xE0 l'escalier
D\xE9rob\xE9.`,source:"Hugo \u2014 Hernani, I, 1",steps:["Lisez les deux vers en marquant la fin du premier, comme si la phrase s'y arr\xEAtait. \xC9coutez \xE0 quel point c'est absurde.","Relisez en suivant la phrase et non le vers : \xAB \xE0 l'escalier d\xE9rob\xE9 \xBB d'un seul tenant.","Cherchez le compromis : la phrase passe, mais on entend encore la fin du vers. Une suspension, pas un arr\xEAt.","Le mot rejet\xE9 au vers suivant re\xE7oit tout le poids. Dites-le comme s'il vous \xE9chappait.","Reprenez le tout \xE0 voix de conversation, sans rien perdre du vers."],note:"Le rejet est un outil, pas un accident : le mot qui d\xE9borde sur le vers suivant est toujours le mot important.",tip:"Ces deux vers ont fait scandale en 1830 : Hugo y cassait ouvertement le vers classique. La bataille d'Hernani commence sur cet enjambement."},{id:"ar_im1",title:"L'improvisation th\xE9matique",cat:"Improvisation",icon:"\u{1F3AD}",dur:"20 min",xp:65,type:"ex",steps:["Tirez un th\xE8me au hasard : jalousie, libert\xE9, secret.","Improvisez un monologue de 3 minutes sur ce th\xE8me.","Pas de pr\xE9paration. Premier instinct.","Recommencez avec un nouveau th\xE8me."],note:"On n'improvise pas pour trouver de bonnes id\xE9es, mais pour \xEAtre chang\xE9 par ce qui arrive. Le reste se retravaille apr\xE8s.",tip:"Keith Johnstone : \xAB Ne pr\xE9parez rien. Soyez chang\xE9 par ce qui arrive. \xBB"},{id:"ar_r2",title:"Le souffle du com\xE9dien",cat:"Respiration",icon:"\u{1F32C}\uFE0F",dur:"15 min",xp:55,type:"ex",extrait:"Parce que vous \xEAtes un grand seigneur, vous vous croyez un grand g\xE9nie ! Noblesse, fortune, un rang, des places : tout cela rend si fier ! Qu'avez-vous fait pour tant de biens ? Vous vous \xEAtes donn\xE9 la peine de na\xEEtre, et rien de plus.",source:"Beaumarchais \u2014 Le Mariage de Figaro, V, 3",steps:["Dites la tirade \xE9pingl\xE9e d'une traite, sur le moins de respirations possible. Notez o\xF9 vous avez craqu\xE9.","Relisez en pla\xE7ant vos respirations avant les craquages, aux endroits qui servent le sens.","Relisez en supprimant une respiration sur deux \u2014 vous devez tenir des groupes plus longs.","Derni\xE8re lecture, \xE0 votre rythme : la ponctuation du souffle doit \xEAtre devenue invisible."],note:"Le souffle est la ponctuation invisible du com\xE9dien. Mal plac\xE9, il d\xE9coupe le sens ; bien plac\xE9, personne ne l'entend.",tip:"Les acteurs du Globe respiraient entre les vers \u2014 le texte shakespearien est \xE9crit pour \xE7a."}],metteur:[{id:"me_r1",title:"Diriger la voix des autres",cat:"Respiration",icon:"\u{1F32C}\uFE0F",dur:"20 min",xp:70,type:"ex",extrait:`Perc\xE9 jusques au fond du c\u0153ur
D'une atteinte impr\xE9vue aussi bien que mortelle,
Mis\xE9rable vengeur d'une juste querelle,
Et malheureux objet d'une injuste rigueur,
Je demeure immobile, et mon \xE2me abattue
C\xE8de au coup qui me tue.`,source:"Corneille \u2014 Le Cid, stances de Rodrigue",steps:["Enregistrez un texte dit de mani\xE8re neutre.","R\xE9\xE9coutez et identifiez : o\xF9 manque le souffle ?","O\xF9 la projection faiblit ? O\xF9 le rythme s'essouffle ?","R\xE9enregistrez en corrigeant chaque point."],note:"Un metteur en sc\xE8ne est d'abord une oreille. Se diriger soi-m\xEAme \xE0 l'enregistrement est le seul entra\xEEnement disponible quand on travaille seul.",tip:"Le metteur en sc\xE8ne est d'abord un oreille."},{id:"me_s1",title:"Analyse de mise en sc\xE8ne",cat:"Sc\xE8ne",icon:"\u{1F3AC}",dur:"30 min",xp:90,type:"ex",steps:["Choisissez une sc\xE8ne courte (2 pages).","Analysez en metteur en sc\xE8ne : que raconte-t-elle ?","Dessinez un plan : o\xF9 sont les acteurs ?","D\xE9cidez du rythme : acc\xE9l\xE9rer, suspendre.","Filmez votre proposition."],note:"Analyser une sc\xE8ne en metteur en sc\xE8ne change d\xE9finitivement la fa\xE7on de la jouer : on cesse de d\xE9fendre son personnage pour servir l'histoire.",tip:"Comprendre la mise en sc\xE8ne fait un meilleur acteur."},{id:"me_c1",title:"La direction d'acteur",cat:"Sc\xE8ne",icon:"\u{1F3AC}",dur:"25 min",xp:80,type:"ex",steps:["Enregistrez-vous jouant une sc\xE8ne \u2014 version neutre.","Donnez-vous une indication : 'plus de col\xE8re retenue'.","Rejouez. Puis : 'comme si tu parlais \xE0 un enfant'.","Rejouez. Puis : 'la derni\xE8re fois que tu dis ces mots'."],note:"Une bonne direction d'acteur tient en une phrase. Si l'indication demande un paragraphe, c'est qu'elle n'est pas encore trouv\xE9e.",tip:"Une bonne direction se r\xE9sume souvent en une phrase."},{id:"me_i1",title:"O\xF9 le public regarde",cat:"Intentions",icon:"\u{1F3AD}",dur:"20 min",xp:70,type:"ex",steps:["Prenez une sc\xE8ne courte \xE0 deux. Jouez les deux r\xF4les, ou enregistrez le partenaire.","Jouez-la en d\xE9cidant que le public regarde celui qui parle. C'est le r\xE9flexe : rien \xE0 faire.","Rejouez en d\xE9cidant qu'il regarde celui qui \xE9coute \u2014 c'est donc celui qui se tait qui bouge, respire, r\xE9agit.","Rejouez en ne laissant \xE0 celui qui \xE9coute qu'un seul geste dans toute la sc\xE8ne. Placez-le au meilleur endroit.","Filmez les trois versions et regardez-les sans le son : dans laquelle comprend-on l'histoire ?"],note:"Mettre en sc\xE8ne, c'est choisir o\xF9 va le regard du public \xE0 chaque instant. Le texte, lui, se d\xE9brouille tout seul.",tip:"Vitez disait qu'une mise en sc\xE8ne est une suite de d\xE9cisions sur l'attention du spectateur \u2014 pas sur la d\xE9coration."},{id:"me_m1",title:"Monologue \u2014 le metteur en sc\xE8ne parle",cat:"Monologue",icon:"\u{1F3AC}",dur:"30 min",xp:130,type:"video",premium:!0,author:"Texte original \u2014 Castigat",text:"\xAB Le th\xE9\xE2tre n'est pas un divertissement. C'est une n\xE9cessit\xE9. Quand les lumi\xE8res s'\xE9teignent dans la salle et que le silence se fait, quelque chose de sacr\xE9 commence. Nous ne jouons pas \u2014 nous invoquons. Chaque soir, nous recr\xE9ons le monde. \xBB",instructions:["Parlez comme quelqu'un qui a consacr\xE9 sa vie au th\xE9\xE2tre.","La conviction doit \xEAtre absolue.","Trouvez VOTRE rapport au th\xE9\xE2tre dans ces mots.","Filmez debout, en mouvement si vous le souhaitez."]},{id:"me_d1",title:"L'oreille du metteur en sc\xE8ne",cat:"Diction",icon:"\u{1F5E3}\uFE0F",dur:"15 min",xp:60,type:"ex",refrain:"Je ne savais pas que tu \xE9tais l\xE0.",extrait:`Je le vis, je rougis, je p\xE2lis \xE0 sa vue ;
Un trouble s'\xE9leva dans mon \xE2me \xE9perdue ;
Mes yeux ne voyaient plus, je ne pouvais parler ;
Je sentis tout mon corps et transir et br\xFBler.`,source:"Racine \u2014 Ph\xE8dre, I, 3",steps:["Enregistrez-vous disant le texte \xE9pingl\xE9, sans pr\xE9paration. Ne r\xE9\xE9coutez pas encore.","Premi\xE8re \xE9coute : ne surveillez que les fins de phrases. Tombent-elles, ou se perdent-elles ?","Deuxi\xE8me \xE9coute : ne surveillez que les fins de mots. Notez les trois endroits les plus flous.","Troisi\xE8me \xE9coute : ne surveillez que le d\xE9bit. O\xF9 acc\xE9l\xE9rez-vous parce que le passage vous g\xEAne ?","R\xE9enregistrez en ne corrigeant que les trois endroits not\xE9s. Ne retouchez rien d'autre."],note:"Vouloir tout entendre d'un coup, c'est n'entendre rien. Un param\xE8tre par \xE9coute, trois corrections maximum.",tip:"Un metteur en sc\xE8ne n'\xE9coute jamais tout \xE0 la fois : il choisit un param\xE8tre par filage et laisse le reste passer."},{id:"me_c1b",title:"Le corps du metteur en sc\xE8ne",cat:"Corps",icon:"\u{1F3CB}",dur:"20 min",xp:65,type:"ex",steps:["Jouez une sc\xE8ne debout, ancr\xE9.","Rejouez assis, immobile.","Rejouez en marchant sans cesse.","Rejouez allong\xE9 au sol.","Chaque posture raconte une histoire diff\xE9rente. Laquelle sert le mieux votre sc\xE8ne ?"],note:"Le placement du corps est la premi\xE8re d\xE9cision de mise en sc\xE8ne \u2014 avant le d\xE9cor, avant la lumi\xE8re, avant le ton.",tip:"Le placement physique est la premi\xE8re d\xE9cision de mise en sc\xE8ne."},{id:"me_im1",title:"L'improvisation contrainte",cat:"Improvisation",icon:"\u{1F3AD}",dur:"20 min",xp:70,type:"ex",steps:["Improvisez une sc\xE8ne de rupture amoureuse.","Contrainte : vous ne pouvez utiliser que des questions.","Recommencez : uniquement des phrases de 5 mots max.","Recommencez : sans jamais dire 'je'."],note:"La contrainte ne bride pas : elle emp\xEAche de reprendre ses automatismes. C'est pour \xE7a que l'OuLiPo s'en est fait une m\xE9thode.",tip:"L'OuLiPo au th\xE9\xE2tre : la contrainte comme moteur de cr\xE9ation."},{id:"me_r2",title:"Respiration et tempo",cat:"Respiration",icon:"\u{1F32C}\uFE0F",dur:"15 min",xp:65,type:"ex",steps:["Jouez une sc\xE8ne en tempo tr\xE8s lent \u2014 respiration ample.","Rejouez en tempo rapide \u2014 respiration saccad\xE9e.","Alternez : d\xE9but lent (respiration profonde), milieu rapide (souffle court).","Notez comme la respiration cr\xE9e le tempo involontairement."],note:"La respiration visible du com\xE9dien est le m\xE9tronome du spectacle. Changez-la, et le tempo change sans qu'on ait touch\xE9 au texte.",tip:"La respiration visible du com\xE9dien EST le m\xE9tronome du spectacle."}],monstre:[{id:"mo_k1",title:"Pr\xE9paration au casting",cat:"Pro",icon:"\u{1F3AC}",dur:"45 min",xp:150,type:"ex",steps:["Respirez, ancrez-vous, relisez le texte une fois sans le jouer.","Analysez : qui parle, \xE0 qui, pour obtenir quoi ? Une phrase par question.","Pr\xE9parez deux propositions radicalement diff\xE9rentes \u2014 deux verbes d'action oppos\xE9s.","Filmez la premi\xE8re sans montage, en une prise. Puis la seconde.","Regardez les cinq premi\xE8res secondes de chaque prise, uniquement. C'est tout ce qu'un directeur de casting verra."],note:"Les directeurs de casting cherchent une personne, pas une performance. Deux propositions franches valent mieux qu'une prise \xAB correcte \xBB.",tip:"Les directeurs de casting cherchent l'authenticit\xE9."},{id:"mo_k2",title:"La self-tape pro",cat:"Pro",icon:"\u{1F4F9}",dur:"30 min",xp:100,type:"ex",steps:["Cadrage : plan poitrine, fond neutre.","Slate : nom, agent, r\xF4le. Court et confiant.","Premi\xE8re prise instinctive.","Deuxi\xE8me prise plus risqu\xE9e.","Envoyez la meilleure. Une seule."],note:"Trois cents self-tapes par r\xF4le. La v\xF4tre est jug\xE9e sur les trois premi\xE8res secondes et sur une seule chose : est-ce qu'on vous croit ?",tip:"300 self-tapes par r\xF4le. La v\xF4tre doit accrocher en 3 secondes."},{id:"mo_i1",title:"L'improvisation qui bascule",cat:"Improvisation",icon:"\u{1F3AD}",dur:"25 min",xp:80,type:"ex",steps:["Situation : vous venez annoncer une mauvaise nouvelle \xE0 quelqu'un. Jouez les deux r\xF4les, ou enregistrez l'autre.","Improvisez trois minutes sans jamais dire explicitement la nouvelle. Vous tournez autour.","Rejouez : cette fois la nouvelle sort dans les vingt premi\xE8res secondes. Tout le reste est la suite.","Comparez : laquelle des deux tient trois minutes sans s'affaisser ?","Refaites celle qui tenait le moins, en lui ajoutant ce qui manquait \u2014 un obstacle, un enjeu, ou une raison de rester dans la pi\xE8ce."],note:"Donnez toujours au personnage quelque chose \xE0 obtenir avant de pouvoir partir. C'est ce qui tient la sc\xE8ne debout.",tip:"Une improvisation ne meurt jamais faute d'id\xE9es : elle meurt quand plus personne n'a de raison de rester l\xE0."},{id:"mo_s1",title:"La sc\xE8ne d'audition",cat:"Sc\xE8ne",icon:"\u{1F3AC}",dur:"35 min",xp:120,type:"ex",steps:["Choisissez une sc\xE8ne de film ou de s\xE9rie que vous ne connaissez pas par c\u0153ur.","Pr\xE9parez-la comme pour une audition r\xE9elle : \xE0 qui parlez-vous, qu'obtenez-vous, que risquez-vous ?","Filmez en conditions de self-tape : plan poitrine, fond neutre, une seule prise.","R\xE9\xE9coutez sans l'image : est-ce qu'on entend tout, et est-ce qu'on croit ?","Reregardez sans le son : est-ce qu'on comprend la situation ? Refaites une prise en corrigeant le point le plus faible des deux."],note:"L'audition est un exercice \xE0 part enti\xE8re : on n'y montre pas ce qu'on sait faire, on y montre une personne dans une situation.",tip:"L'audition est un art en soi \u2014 il se travaille."},{id:"mo_m1",title:"Monologue de concours",cat:"Monologue",icon:"\u{1F3AC}",dur:"40 min",xp:200,type:"video",premium:!0,author:"Texte original \u2014 Castigat",text:"\xAB J'ai march\xE9 longtemps pour arriver ici. Des ann\xE9es de doutes, de refus. Chaque 'non' m'a appris quelque chose. Aujourd'hui je suis devant vous non pas parce que je suis pr\xEAt, mais parce que je ne le serai jamais \u2014 et c'est \xE7a, le courage. \xBB",instructions:["R\xE9\xE9crivez avec VOTRE parcours.","Les mots doivent \xEAtre les v\xF4tres.","V\xE9rit\xE9 absolue : pas de jeu, juste vous.","Filmez en conditions de concours."]},{id:"mo_d1",title:"La diction sous pression",cat:"Diction",icon:"\u{1F5E3}\uFE0F",dur:"15 min",xp:70,type:"ex",extrait:"Au voleur ! au voleur ! \xE0 l'assassin ! au meurtrier ! Justice, juste ciel ! Je suis perdu, je suis assassin\xE9, on m'a coup\xE9 la gorge, on m'a d\xE9rob\xE9 mon argent.",source:"Moli\xE8re \u2014 L'Avare, IV, 7",steps:["Dites le texte \xE9pingl\xE9 debout, immobile. C'est votre r\xE9f\xE9rence.","Redites-le en marchant vite dans la pi\xE8ce, sans ralentir le d\xE9bit.","Redites-le en montant et descendant d'une marche, ou en gesticulant largement.","Redites-le face \xE0 un mur, puis retournez-vous brusquement au milieu d'une phrase.","Revenez immobile et redites-le : l'articulation doit \xEAtre plus nette qu'au premier passage."],note:"Chez Mnouchkine ou Lecoq, on articule en plein effort. Une diction qui ne tient que debout et immobile ne tient pas.",tip:"Les acteurs de th\xE9\xE2tre physique (Mnouchkine, Lecoq) articulent en plein effort."},{id:"mo_r1",title:"Le souffle marathon",cat:"Respiration",icon:"\u{1F32C}\uFE0F",dur:"15 min",xp:65,type:"ex",steps:["Inspirez et comptez \xE0 voix haute le plus loin possible.","Visez 30, puis 40, puis 50.","M\xEAme exercice avec un texte : une phrase = une expiration.","Allongez progressivement les phrases."],note:"Sur sc\xE8ne, le souffle est la libert\xE9 du com\xE9dien : c'est lui qui d\xE9cide si vous pouvez tenir une r\xE9plique enti\xE8re ou non.",tip:"Certains acteurs tiennent un alexandrin entier sur une seule expiration."},{id:"mo_c1",title:"Le combat sc\xE9nique",cat:"Corps",icon:"\u{1F3CB}",dur:"25 min",xp:80,type:"ex",steps:["Deux personnages face \xE0 face \u2014 vous les jouez tous les deux, tr\xE8s lentement d'abord.","Gifle sc\xE9nique : la main passe \xE0 dix centim\xE8tres, le son vient de votre autre main sur la cuisse.","Pouss\xE9e : c'est le receveur qui fait tout le travail, jamais celui qui pousse.","Chute : on roule sur le flanc, jamais sur le dos, jamais sur les mains.","Refaites la s\xE9quence enti\xE8re \xE0 vitesse r\xE9elle, seulement quand les quatre gestes sont propres au ralenti."],note:"Au th\xE9\xE2tre, c'est toujours celui qui re\xE7oit qui fabrique la violence, jamais celui qui donne. C'est la r\xE8gle qui \xE9vite les accidents.",tip:"Au th\xE9\xE2tre, c'est toujours celui qui re\xE7oit qui fait la violence, pas celui qui donne."},{id:"mo_im1",title:"L'improvisation de jeu",cat:"Improvisation",icon:"\u{1F3AD}",dur:"20 min",xp:75,type:"ex",steps:["Tirez deux mots au hasard : 'rage' et 'nostalgie'.","Improvisez un monologue de 2 minutes sur ces deux \xE9tats.","Alternez entre eux : rage \u2192 nostalgie \u2192 rage."],note:"Alterner deux \xE9tats contraires sans pr\xE9paration, c'est l'\xE9preuve qui s\xE9pare l'improvisateur du com\xE9dien qui r\xE9cite vite.",tip:"Un monstre peut improviser n'importe quoi \u2014 c'est ce qui d\xE9finit le vrai com\xE9dien."}],affiche:[{id:"af_s1",title:"Travail de mise en sc\xE8ne complet",cat:"Sc\xE8ne",icon:"\u{1F3AC}",dur:"45 min",xp:160,type:"ex",steps:["Sc\xE8ne compl\xE8te de 3-4 pages.","Analyse dramaturgique \xE9crite.","Plan de sc\xE8ne d\xE9taill\xE9.","Travail des transitions et du rythme.","Filmez avec votre proposition de mise en sc\xE8ne."],note:"Une mise en sc\xE8ne compl\xE8te, c'est quatre d\xE9cisions tenues jusqu'au bout : ce que raconte la sc\xE8ne, o\xF9 sont les corps, quel est le rythme, et ce qu'on coupe.",tip:"La mise en sc\xE8ne est un art de composition."},{id:"af_i1",title:"Passer d'un personnage \xE0 l'autre",cat:"Improvisation",icon:"\u{1F3AD}",dur:"30 min",xp:110,type:"ex",steps:["Choisissez trois personnages tr\xE8s diff\xE9rents. Pour chacun : un \xE2ge, un poids, un rythme. Notez-les en une ligne.","Jouez trente secondes du premier, puis arr\xEAtez-vous net.","Passez au deuxi\xE8me sans transition \u2014 le changement doit se voir en une seconde, sur un seul appui.","Encha\xEEnez les trois, puis les trois dans l'ordre inverse, sans jamais repasser par votre corps neutre.","Filmez la s\xE9rie. Si vous ne distinguez pas les trois \xE0 l'image, le changement est dans votre t\xEAte et pas dans votre corps."],note:"Un changement se voit sur un appui, une hauteur de regard, une vitesse. Une voix diff\xE9rente ne suffit jamais.",tip:"Dans un solo, le public ne suit pas les personnages : il suit les changements. Ce sont eux qui doivent \xEAtre nets."},{id:"af_k1",title:"La bande d\xE9mo",cat:"Pro",icon:"\u{1F4F9}",dur:"40 min",xp:140,type:"ex",steps:["S\xE9lectionnez 3 sc\xE8nes montrant votre range.","Une comique, une dramatique, une contemporaine.","Filmez chacune en conditions pro.","Montez un best-of de 3 minutes."],note:"Une bande d\xE9mo n'est pas un best-of : c'est une d\xE9monstration d'\xE9tendue. Trois registres, trois minutes, aucune sc\xE8ne de trop.",tip:"Une bande d\xE9mo doit montrer votre versatilit\xE9 en 3 minutes."},{id:"af_m1",title:"Monologue \u2014 cr\xE9ation originale",cat:"Monologue",icon:"\u{1F3AC}",dur:"35 min",xp:180,type:"video",premium:!0,author:"Vous \u2014 Votre cr\xE9ation",text:"\xC9crivez votre propre monologue de 2 minutes. Sujet libre. C'est VOTRE voix, VOTRE histoire. Pas un exercice \u2014 une cr\xE9ation.",instructions:["\xC9crivez d'abord. Puis apprenez.","Ce texte doit vous ressembler.","Filmez avec soin : c'est votre signature artistique.","Retour de metteur en sc\xE8ne sous 48h."]},{id:"af_d1",title:"Deux souffles d'\xE9criture",cat:"Diction",icon:"\u{1F5E3}\uFE0F",dur:"20 min",xp:80,type:"ex",extrait:`Parce que vous \xEAtes un grand seigneur, vous vous croyez un grand g\xE9nie ! Noblesse, fortune, un rang, des places : tout cela rend si fier ! Qu'avez-vous fait pour tant de biens ? Vous vous \xEAtes donn\xE9 la peine de na\xEEtre, et rien de plus.

\u2014 \u2014 \u2014

Au voleur ! au voleur ! \xE0 l'assassin ! au meurtrier ! Justice, juste ciel ! Je suis perdu, je suis assassin\xE9, on m'a coup\xE9 la gorge, on m'a d\xE9rob\xE9 mon argent.`,source:"Beaumarchais \u2014 Le Mariage de Figaro \xB7 Moli\xE8re \u2014 L'Avare",steps:["Dites la tirade de Figaro : phrases qui s'emballent, relances, \xE9num\xE9ration. Le souffle est long.","Dites la tirade d'Harpagon : phrases courtes, hach\xE9es, r\xE9p\xE9t\xE9es. Le souffle est bref et sec.","Refaites Figaro hach\xE9 comme Harpagon. \xC9coutez ce que la pens\xE9e y perd.","Refaites Harpagon li\xE9 comme Figaro. \xC9coutez comme la panique dispara\xEEt.","Redites chacun \xE0 sa place, l'un apr\xE8s l'autre, sans commentaire."],note:"Votre diction doit servir l'\xE9criture, pas la d\xE9montrer. Le souffle de l'auteur est \xE9crit dans la ponctuation \u2014 il suffit de le suivre.",tip:"Chez Moli\xE8re, la panique s'\xE9crit dans la longueur des phrases avant de s'\xE9crire dans les mots."},{id:"af_c1",title:"La pr\xE9sence sc\xE9nique totale",cat:"Corps",icon:"\u{1F3CB}",dur:"25 min",xp:90,type:"ex",steps:["Montez sur votre 'sc\xE8ne' (un espace d\xE9fini).","Restez immobile 2 minutes. Juste \xEAtre l\xE0.","Occupez l'espace en marchant \u2014 sans raison.","Arr\xEAtez-vous. Le public doit sentir que vous occupez TOUT l'espace m\xEAme immobile."],note:"La pr\xE9sence n'est pas ce que vous faites, c'est ce que vous ne faites pas. Deux minutes d'immobilit\xE9 tenue en apprennent plus que dix de mouvement.",tip:"Louis Jouvet : \xAB Le talent, c'est la pr\xE9sence. Et la pr\xE9sence, \xE7a ne s'explique pas. \xBB"},{id:"af_r1",title:"Un silence, bien plac\xE9",cat:"Respiration",icon:"\u{1F32C}\uFE0F",dur:"15 min",xp:70,type:"ex",extrait:`Je le vis, je rougis, je p\xE2lis \xE0 sa vue ;
Un trouble s'\xE9leva dans mon \xE2me \xE9perdue ;
Mes yeux ne voyaient plus, je ne pouvais parler ;
Je sentis tout mon corps et transir et br\xFBler.`,source:"Racine \u2014 Ph\xE8dre, I, 3",steps:["Dites le texte \xE9pingl\xE9 sans aucun silence, d'un trait.","Redites-le en pla\xE7ant un seul silence, \xE0 l'endroit qui vous para\xEEt le plus dangereux. Tenez-le jusqu'\xE0 \xEAtre mal \xE0 l'aise.","Redites-le en pla\xE7ant ce silence au mauvais endroit, expr\xE8s. \xC9coutez la diff\xE9rence.","Revenez au bon endroit et respirez pendant le silence, amplement : le public respire avec vous.","Dernier passage avec deux silences maximum, pas un de plus."],note:"Un silence de trop redevient du vide. Un seul, bien plac\xE9 et tenu trop longtemps, vaut cinq silences polis.",tip:"Pinter \xE9crivait ses silences dans le texte, au m\xEAme titre que les r\xE9pliques : \xAB pause \xBB et \xAB silence \xBB n'y sont pas la m\xEAme chose."},{id:"af_i2",title:"L'improvisation longue",cat:"Improvisation",icon:"\u{1F3AD}",dur:"30 min",xp:100,type:"ex",steps:["Choisissez un lieu : h\xF4pital, \xE9cole, a\xE9roport.","Improvisez 10 minutes sans jamais vous arr\xEAter.","Faites vivre 3 personnages minimum.","Cr\xE9ez un conflit, une r\xE9solution, une surprise."],note:"L'improvisation longue est un exercice d'endurance : ce n'est plus l'id\xE9e qui manque au bout de dix minutes, c'est la structure.",tip:"Les Theatresports de Keith Johnstone ont popularis\xE9 l'impro longue."},{id:"af_s2",title:"La mise en sc\xE8ne du doute",cat:"Sc\xE8ne",icon:"\u{1F3AC}",dur:"30 min",xp:120,type:"ex",steps:["Choisissez une sc\xE8ne ambig\xFCe : deux personnages qui ne se disent pas la v\xE9rit\xE9.","Mise en sc\xE8ne option 1 : ils s'aiment secr\xE8tement.","Mise en sc\xE8ne option 2 : ils se ha\xEFssent en feignant l'amiti\xE9.","M\xEAme texte, deux mises en sc\xE8ne oppos\xE9es.","Trouvez comment le placement, le rythme et les regards racontent l'histoire."],note:"La mise en sc\xE8ne r\xE9v\xE8le le non-dit : m\xEAme texte, deux placements, deux histoires. C'est l\xE0 qu'elle devient un art \xE0 part enti\xE8re.",tip:"La mise en sc\xE8ne r\xE9v\xE8le le non-dit \u2014 c'est son art fondamental."}],etoile:[{id:"et_s1",title:"Le spectacle solo",cat:"Sc\xE8ne",icon:"\u{1F3AC}",dur:"60 min",xp:250,type:"ex",steps:["Concevez un spectacle solo de 15 minutes.","\xC9criture, mise en sc\xE8ne, jeu \u2014 tout est de vous.","3 s\xE9quences minimum, transitions travaill\xE9es.","Un fil rouge \xE9motionnel du d\xE9but \xE0 la fin.","Filmez comme une captation de spectacle."],note:"Un solo ne pardonne rien : il n'y a personne pour rattraper un temps mort. C'est pour \xE7a qu'il fait progresser plus vite que tout le reste.",tip:"Le solo est l'Everest de l'acteur."},{id:"et_i1",title:"Masterclass \u2014 transmettre",cat:"Pro",icon:"\u{1F451}",dur:"30 min",xp:120,type:"ex",steps:["Filmez une mini-masterclass de 5 minutes.","Enseignez UN exercice que vous ma\xEEtrisez.","Soyez clair, inspirant, g\xE9n\xE9reux."],note:"On ne sait vraiment un exercice que le jour o\xF9 on arrive \xE0 le faire faire \xE0 quelqu'un d'autre.",tip:"Les plus grands sont aussi les plus g\xE9n\xE9reux."},{id:"et_k1",title:"Cr\xE9er sa compagnie",cat:"Pro",icon:"\u2B50",dur:"45 min",xp:180,type:"ex",steps:["R\xE9digez une note d'intention pour un spectacle.","Constituez une \xE9quipe imaginaire.","Budget pr\xE9visionnel simplifi\xE9.","Plan de diffusion : o\xF9 jouer ?"],note:"Cr\xE9er sa compagnie, c'est cesser d'attendre qu'on vous choisisse. C'est le geste le plus difficile et le plus lib\xE9rateur du m\xE9tier.",tip:"Cr\xE9er sa compagnie est le geste le plus audacieux."},{id:"et_m1",title:"Le dernier monologue",cat:"Monologue",icon:"\u{1F3AC}",dur:"40 min",xp:300,type:"video",premium:!0,author:"Texte final \u2014 Castigat",text:"\xAB Si c'\xE9tait la derni\xE8re fois que je monte sur sc\xE8ne, qu'est-ce que je dirais ? Pas des mots appris, pas des phrases jolies. La v\xE9rit\xE9. Ma v\xE9rit\xE9. Celle que je n'ai jamais os\xE9 dire parce que je me cachais derri\xE8re des personnages. Ce soir, pas de masque. Juste moi. \xBB",instructions:["Ce texte EST vous. Pas un personnage.","R\xE9\xE9crivez-le int\xE9gralement avec vos mots.","Filmez une seule prise \u2014 pas de seconde chance.","C'est votre testament artistique dans cette app."]},{id:"et_d1",title:"La musicalit\xE9 du texte",cat:"Diction",icon:"\u{1F5E3}\uFE0F",dur:"20 min",xp:90,type:"ex",extrait:"Parce que vous \xEAtes un grand seigneur, vous vous croyez un grand g\xE9nie ! Noblesse, fortune, un rang, des places : tout cela rend si fier ! Qu'avez-vous fait pour tant de biens ? Vous vous \xEAtes donn\xE9 la peine de na\xEEtre, et rien de plus.",source:"Beaumarchais \u2014 Le Mariage de Figaro, V, 3",steps:["Lisez le texte \xE9pingl\xE9 \xE0 voix haute sans chercher \xE0 comprendre \u2014 uniquement les sons, le rythme, les appuis.","Relisez-le en ne cherchant que le sens, sans vous occuper de la musique.","La premi\xE8re lecture \xE9tait plus musicale, la seconde plus claire. C'est normal, et c'est le probl\xE8me.","Troisi\xE8me lecture : gardez les appuis rythmiques de la premi\xE8re et la clart\xE9 de la seconde.","Enregistrez cette troisi\xE8me version et r\xE9\xE9coutez-la \xE0 froid le lendemain."],note:"Artaud r\xEAvait d'un th\xE9\xE2tre o\xF9 le son aurait autant de sens que les mots. L'\xE9quilibre entre les deux est le dernier travail de l'acteur.",tip:"Artaud r\xEAvait d'un th\xE9\xE2tre o\xF9 le son aurait autant de sens que les mots."},{id:"et_c1",title:"Le corps m\xE9moire",cat:"Corps",icon:"\u{1F3CB}",dur:"25 min",xp:85,type:"ex",steps:["Souvenez-vous d'un moment intense de votre vie.","Laissez votre corps retrouver la posture de ce moment.","Les mains, la respiration, la tension \u2014 tout revient.","Utilisez cette m\xE9moire corporelle pour un personnage."],note:"Le corps se souvient de tout, et plus fid\xE8lement que la t\xEAte. C'est un mat\xE9riau : on l'utilise, on ne s'y noie pas.",tip:"Stanislavski appelait \xE7a la 'm\xE9moire affective' \u2014 le corps comme archive \xE9motionnelle."},{id:"et_im1",title:"De l'improvisation \xE0 la partition",cat:"Improvisation",icon:"\u{1F3AD}",dur:"30 min",xp:120,type:"ex",steps:["Improvisez cinq minutes sur un mot : fronti\xE8re, enfance, masque. Filmez.","Regardez la vid\xE9o et notez les trois moments qui tiennent \u2014 ceux-l\xE0 seulement.","Rejouez ces trois moments dans l'ordre, en les reliant. Vous n'improvisez plus : vous montez.","Refaites cette version une deuxi\xE8me fois, aussi proche que possible de la premi\xE8re.","Comparez les deux prises : ce qui a surv\xE9cu \xE0 la r\xE9p\xE9tition est \xE9crit, le reste \xE9tait de l'\xE9nergie."],note:"Improviser est facile ; refaire une improvisation est le m\xE9tier. C'est ce passage-l\xE0 qui s\xE9pare un bon moment d'une sc\xE8ne.",tip:"C'est la m\xE9thode de l'\xE9criture de plateau : on improvise beaucoup, on ne garde presque rien, et ce qui reste devient la partition."},{id:"et_r1",title:"Diriger sa propre respiration",cat:"Respiration",icon:"\u{1F32C}\uFE0F",dur:"15 min",xp:75,type:"ex",extrait:`Je le vis, je rougis, je p\xE2lis \xE0 sa vue ;
Un trouble s'\xE9leva dans mon \xE2me \xE9perdue ;
Mes yeux ne voyaient plus, je ne pouvais parler ;
Je sentis tout mon corps et transir et br\xFBler.`,source:"Racine \u2014 Ph\xE8dre, I, 3",steps:["Reprenez un texte que vous ma\xEEtrisez.","Cartographiez chaque respiration : o\xF9, combien de temps, quelle profondeur.","Jouez en suivant votre partition respiratoire."],note:"Une partition de souffle d\xE9cid\xE9e \xE0 l'avance, c'est une mise en sc\xE8ne invisible que vous vous donnez \xE0 vous-m\xEAme.",tip:"La respiration consciente est ce qui s\xE9pare l'amateur du professionnel."},{id:"et_k2",title:"L'h\xE9ritage artistique",cat:"Pro",icon:"\u{1F4F9}",dur:"30 min",xp:150,type:"ex",steps:["Identifiez 3 ma\xEEtres qui vous ont influenc\xE9 : acteurs, metteurs, artistes.","Pour chacun, analysez : leur approche, leur signature, ce qu'ils vous ont enseign\xE9.","Cr\xE9ez une 'lettre ouverte' vid\xE9o \xE0 l'un d'eux \u2014 gratitude, apprentissages.","Filmez avec sinc\xE9rit\xE9 \u2014 c'est votre transmission."],note:"On se d\xE9finit autant par ce qu'on transmet que par ce qu'on a re\xE7u. C'est le dernier exercice, et ce n'est pas un hasard.",tip:"Laurence Olivier, Anne Consigny, Lecoq \u2014 tous parlent de ceux qui les ont form\xE9s."}]},CU={figurant:[{id:"h_f2",title:"Shakespeare, le g\xE9nie",cat:"Auteurs",icon:"\u2712\uFE0F",dur:"10 min",xp:25,content:["William Shakespeare (1564\u20131616), n\xE9 \xE0 Stratford-upon-Avon, a \xE9crit 37 pi\xE8ces et 154 sonnets en 25 ans de carri\xE8re.","Ses trag\xE9dies explorent les ab\xEEmes de l'\xE2me : Hamlet (le doute), Macbeth (l'ambition), Othello (la jalousie), Le Roi Lear (la folie), Rom\xE9o et Juliette (l'amour impossible).","Le Globe Theatre, construit en 1599, accueillait 3 000 spectateurs. Le parterre debout payait un penny, les loges \xE9taient pour les nobles. Pas de d\xE9cor \u2014 tout est dans le texte.","Shakespeare a invent\xE9 plus de 1 700 mots anglais (eyeball, lonely, generous...) et des expressions encore utilis\xE9es (break the ice, wild goose chase). Il \xE9crivait pour tous : peuple et rois, rire et larmes dans la m\xEAme pi\xE8ce."],quiz:[{q:"En quelle ann\xE9e est construit le Globe Theatre ?",o:["1576","1599","1613","1642"],a:1},{q:"Quelle trag\xE9die explore le th\xE8me de la jalousie ?",o:["Hamlet","Macbeth","Othello","Le Roi Lear"],a:2},{q:"Combien de sonnets Shakespeare a-t-il \xE9crits ?",o:["100","126","154","200"],a:2}]},{id:"h_f3",title:"La sc\xE8ne : vocabulaire de base",cat:"Glossaire",icon:"\u{1F4D6}",dur:"6 min",xp:15,content:["C\xF4t\xE9 cour (droite du spectateur) et c\xF4t\xE9 jardin (gauche). L'astuce : C et J sont dans l'ordre alphab\xE9tique de gauche \xE0 droite \u2014 Jardin \xE0 gauche, Cour \xE0 droite. L'origine vient du Palais des Tuileries.","Le lointain (fond de sc\xE8ne) et la face (devant, c\xF4t\xE9 public). L'avant-sc\xE8ne est l'espace entre le rideau et l'orchestre. Le manteau d'Arlequin est le cadre de sc\xE8ne.","Les coulisses : espaces lat\xE9raux cach\xE9s o\xF9 les acteurs attendent. Les cintres : espace au-dessus de la sc\xE8ne pour les d\xE9cors suspendus. Le gril : structure m\xE9tallique tout en haut.","Le plateau : la sc\xE8ne elle-m\xEAme. La fosse : espace sous la sc\xE8ne ou devant pour l'orchestre. Les pendrillons : rideaux lat\xE9raux qui masquent les coulisses."],quiz:[{q:"C\xF4t\xE9 cour, c'est quel c\xF4t\xE9 pour le spectateur ?",o:["Gauche","Droite","Le fond","\xC7a d\xE9pend du th\xE9\xE2tre"],a:1},{q:"Comment s'appelle le cadre de sc\xE8ne ?",o:["L'avant-sc\xE8ne","Le manteau d'Arlequin","Le lointain","Les pendrillons"],a:1}]},{id:"h_f4",title:"Les \xE9motions de base",cat:"Techniques",icon:"\u2B50",dur:"7 min",xp:20,content:["Paul Ekman, psychologue am\xE9ricain, a document\xE9 que certaines expressions faciales de base \u2014 joie, tristesse, col\xE8re, peur, surprise, d\xE9go\xFBt \u2014 sont reconnues dans presque toutes les cultures. C'est un fait \xE9tabli par la recherche.","Au th\xE9\xE2tre, l'\xE9motion est le carburant du jeu. Mais on ne la 'mime' pas \u2014 on cr\xE9e les conditions pour qu'elle \xE9merge. Stanislavski appelle \xE7a la 'reviviscence'.","Il n'existe pas de geste 'correct' pour chaque \xE9motion : deux mises en sc\xE8ne peuvent jouer la m\xEAme col\xE8re de deux fa\xE7ons oppos\xE9es, et les deux peuvent \xEAtre justes. Ce qui compte, c'est la pr\xE9cision du choix \u2014 pas sa conformit\xE9 \xE0 une r\xE8gle. L'art ne se code pas comme une science.","Le com\xE9dien ne ressent pas forc\xE9ment l'\xE9motion \u2014 il la joue avec pr\xE9cision. C'est la diff\xE9rence entre '\xEAtre \xE9mu' et '\xE9mouvoir le public'. Les deux approches (ressentir vs montrer) divisent les \xE9coles depuis 250 ans."],quiz:[{q:"Selon Ekman, qu'est-ce qui est reconnu dans presque toutes les cultures ?",o:["Les gestes de la main","Certaines expressions faciales de base","La posture debout","Le ton de la voix"],a:1},{q:"Que dit l'\xE9cole de la 'reviviscence' (Stanislavski) ?",o:["Il faut mimer l'\xE9motion de l'ext\xE9rieur","On cr\xE9e les conditions pour que l'\xE9motion \xE9merge","L'\xE9motion n'a pas sa place au th\xE9\xE2tre","Seule la voix compte, pas le ressenti"],a:1}]}],apprenti:[{id:"h_a1",title:"Moli\xE8re, le patron",cat:"Auteurs",icon:"\u2712\uFE0F",dur:"10 min",xp:25,content:["Jean-Baptiste Poquelin (1622\u20131673), dit Moli\xE8re, quitte une carri\xE8re de tapissier royal pour le th\xE9\xE2tre. Il fonde l'Illustre Th\xE9\xE2tre \xE0 21 ans, fait faillite, et part 13 ans en tourn\xE9e en province.","De retour \xE0 Paris, il conquiert Louis XIV. Le Misanthrope, Tartuffe (censur\xE9 5 ans par les d\xE9vots), L'Avare, Les Femmes savantes, Le Bourgeois gentilhomme \u2014 il d\xE9nonce l'hypocrisie, la vanit\xE9 et la b\xEAtise avec un g\xE9nie comique in\xE9gal\xE9.","Moli\xE8re est auteur, metteur en sc\xE8ne ET acteur principal de ses pi\xE8ces. Il meurt le 17 f\xE9vrier 1673 apr\xE8s la 4e repr\xE9sentation du Malade imaginaire, quelques heures apr\xE8s s'\xEAtre effondr\xE9 en sc\xE8ne \u2014 la l\xE9gende veut qu'il soit mort sur sc\xE8ne, mais c'est faux.","La Com\xE9die-Fran\xE7aise, fond\xE9e en 1680 par fusion de sa troupe, s'appelle encore 'la Maison de Moli\xE8re'. On parle de 'la langue de Moli\xE8re' pour d\xE9signer le fran\xE7ais."],quiz:[{q:"Quel \xE9tait le vrai nom de Moli\xE8re ?",o:["Pierre Corneille","Jean-Baptiste Poquelin","Jean Racine","Denis Diderot"],a:1},{q:"Combien d'ann\xE9es Tartuffe a-t-il \xE9t\xE9 censur\xE9 ?",o:["2 ans","5 ans","10 ans","Il n'a jamais \xE9t\xE9 censur\xE9"],a:1},{q:"En quelle ann\xE9e meurt Moli\xE8re ?",o:["1670","1673","1680","1699"],a:1}]},{id:"h_a2",title:"Le quatri\xE8me mur",cat:"Techniques",icon:"\u{1F3AD}",dur:"6 min",xp:15,content:["Imaginez la sc\xE8ne comme une bo\xEEte ouverte sur le public : trois murs existent (fond + deux c\xF4t\xE9s), le quatri\xE8me est invisible \u2014 c'est le 'mur' entre les acteurs et les spectateurs.","Diderot th\xE9orise ce concept dans son Discours sur la po\xE9sie dramatique (1758) : les acteurs doivent jouer comme si le public n'existait pas, pour cr\xE9er l'illusion du r\xE9el.","Brecht fait exactement l'inverse : ses acteurs cassent le 4e mur, s'adressent au public, montrent qu'ils jouent. L'objectif ? Emp\xEAcher l'identification \xE9motionnelle et \xE9veiller l'esprit critique du spectateur.","Aujourd'hui, beaucoup de metteurs en sc\xE8ne jouent avec ce mur : tant\xF4t ferm\xE9 (r\xE9alisme), tant\xF4t ouvert (adresse directe au public). Le th\xE9\xE2tre contemporain m\xE9lange souvent les deux."],quiz:[{q:"Qui th\xE9orise le concept du 4e mur ?",o:["Moli\xE8re","Brecht","Diderot","Stanislavski"],a:2},{q:"Que fait Brecht avec le 4e mur ?",o:["Il le renforce","Il le casse","Il l'ignore","Il le d\xE9core"],a:1}]},{id:"h_a3",title:"La voix au th\xE9\xE2tre",cat:"Techniques",icon:"\u{1F5E3}\uFE0F",dur:"8 min",xp:20,content:["La voix du com\xE9dien doit porter jusqu'au dernier rang sans micro. C'est un instrument qui se travaille quotidiennement, comme un musicien travaille ses gammes.","La projection vocale part du diaphragme, pas de la gorge. Le diaphragme est un muscle en forme de coupole sous les poumons \u2014 c'est lui qui pousse l'air. Forcer avec la gorge fatigue les cordes vocales et r\xE9duit le volume.","Le timbre est l'empreinte unique de chaque voix : grave ou aigu, chaud ou m\xE9tallique, clair ou voil\xE9. Un bon acteur module son timbre selon le personnage. Louis Jouvet avait un timbre reconnaissable entre mille.","Le 'masque' est la zone de r\xE9sonance du visage (pommettes, sinus, front). Quand la voix r\xE9sonne dans le masque, elle porte naturellement. Exercice : humez 'mmmmm' en sentant vibrer vos pommettes."],quiz:[{q:"D'o\xF9 part la projection vocale ?",o:["La gorge","Le diaphragme","La poitrine","Le ventre"],a:1},{q:"Qu'est-ce que le 'masque' en technique vocale ?",o:["Un accessoire de sc\xE8ne","La zone de r\xE9sonance du visage","Un exercice de respiration","Le maquillage de l'acteur"],a:1}]},{id:"h_a4",title:"Racine, la perfection",cat:"Auteurs",icon:"\u2712\uFE0F",dur:"10 min",xp:25,content:["Jean Racine (1639\u20131699), orphelin \xE9lev\xE9 par les jans\xE9nistes de Port-Royal, est le ma\xEEtre absolu de la trag\xE9die classique fran\xE7aise. Son \xE9ducation religieuse stricte nourrit ses th\xE8mes : la passion coupable, le destin, la fatalit\xE9.","Ph\xE8dre (l'amour interdit), Andromaque (le chantage amoureux), Britannicus (le tyran naissant), B\xE9r\xE9nice (le renoncement) \u2014 ses pi\xE8ces sont des huis clos psychologiques en alexandrins d'une musicalit\xE9 parfaite.","Racine dit tout avec retenue. Pas de combat sur sc\xE8ne, pas de sang \u2014 la violence est dans les mots. Quand Ph\xE8dre dit 'je br\xFBle', elle d\xE9crit un incendie int\xE9rieur plus puissant que n'importe quel effet sp\xE9cial.","Sa rivalit\xE9 avec Corneille (l'h\xE9ro\xEFsme vs la passion, la volont\xE9 vs la fatalit\xE9) a d\xE9fini le th\xE9\xE2tre du XVIIe si\xE8cle. Corneille montre des h\xE9ros qui choisissent ; Racine montre des \xEAtres qui subissent."],quiz:[{q:"Quel est le th\xE8me central de l'\u0153uvre de Racine ?",o:["L'h\xE9ro\xEFsme","La passion et la fatalit\xE9","Le comique","La politique"],a:1},{q:"Quelle pi\xE8ce de Racine traite du renoncement amoureux ?",o:["Ph\xE8dre","Andromaque","B\xE9r\xE9nice","Britannicus"],a:2},{q:"Quelle est la grande diff\xE9rence entre Corneille et Racine ?",o:["Vers vs prose","Com\xE9die vs trag\xE9die","H\xE9ros qui choisissent vs \xEAtres qui subissent","Th\xE9\xE2tre grec vs th\xE9\xE2tre romain"],a:2}]}],dimanche:[{id:"h_d1",title:"Le th\xE9\xE2tre romain",cat:"Histoire",icon:"\u{1F3DB}\uFE0F",dur:"8 min",xp:20,content:["Rome emprunte le th\xE9\xE2tre aux Grecs d\xE8s le IIIe si\xE8cle av. J.-C. mais y ajoute le go\xFBt du spectaculaire et du divertissement de masse.","Plaute (254\u2013184 av. J.-C.) et T\xE9rence (190\u2013159 av. J.-C.) sont les ma\xEEtres de la com\xE9die latine. Plaute est populaire et farcesque, T\xE9rence est raffin\xE9 et psychologique. Ils inspirent directement Moli\xE8re et Shakespeare.","Les th\xE9\xE2tres romains en pierre (contrairement aux gradins en bois grecs) accueillent jusqu'\xE0 50 000 spectateurs. Le velum (toile tendue) prot\xE8ge du soleil. L'architecture est un chef-d'\u0153uvre d'acoustique.","Le mime et la pantomime deviennent des arts \xE0 part enti\xE8re. S\xE9n\xE8que \xE9crit des trag\xE9dies violentes destin\xE9es \xE0 la lecture plut\xF4t qu'\xE0 la repr\xE9sentation \u2014 mais elles influenceront le th\xE9\xE2tre \xE9lisab\xE9thain."],quiz:[{q:"Quel auteur comique romain a directement influenc\xE9 Moli\xE8re ?",o:["S\xE9n\xE8que","Plaute","Cic\xE9ron","Virgile"],a:1},{q:"\xC0 quoi servait le velum dans les th\xE9\xE2tres romains ?",o:["Masquer la sc\xE8ne","Prot\xE9ger du soleil","Amplifier le son","D\xE9corer"],a:1}]},{id:"h_d2",title:"La Commedia dell'arte",cat:"Histoire",icon:"\u{1F3AD}",dur:"10 min",xp:25,content:["N\xE9e en Italie au XVIe si\xE8cle, la Commedia dell'arte est le th\xE9\xE2tre d'improvisation par excellence. 'Dell'arte' signifie 'de m\xE9tier' \u2014 ce sont des professionnels, pas des amateurs.","Les personnages sont des arch\xE9types masqu\xE9s : Arlequin (le valet agile et affam\xE9), Colombine (la servante maligne), Pantalone (le vieux riche avare), le Docteur (le p\xE9dant ridicule), le Capitaine (le faux brave).","Les acteurs improvisent \xE0 partir de canevas sommaires (scenarii) avec des lazzi \u2014 gags codifi\xE9s et transmis de g\xE9n\xE9ration en g\xE9n\xE9ration. Le corps est roi : acrobaties, mime, pantomime.","La Commedia a profond\xE9ment influenc\xE9 Moli\xE8re (qui partageait la salle du Petit-Bourbon avec les Com\xE9diens-Italiens), le th\xE9\xE2tre de marionnettes, le cin\xE9ma muet (Chaplin, Keaton) et jusqu'aux s\xE9ries comiques actuelles."],quiz:[{q:"Que signifie 'dell'arte' ?",o:["De l'art","De m\xE9tier","De la rue","D'improvisation"],a:1},{q:"Quel personnage de la Commedia est un vieux riche avare ?",o:["Arlequin","Le Docteur","Pantalone","Le Capitaine"],a:2},{q:"Qu'est-ce qu'un 'lazzo' ?",o:["Un masque","Un gag codifi\xE9","Un d\xE9cor","Un costume"],a:1}]},{id:"h_d3",title:"Le th\xE9\xE2tre m\xE9di\xE9val",cat:"Histoire",icon:"\u{1F3DB}\uFE0F",dur:"8 min",xp:20,content:["Au Moyen \xC2ge, le th\xE9\xE2tre rena\xEEt dans l'\xE9glise : les tropes (dialogues chant\xE9s en latin) illustrent les \xE9pisodes bibliques lors des offices, puis sortent sur le parvis.","Les 'myst\xE8res' sont des spectacles monumentaux racontant la Bible en plusieurs journ\xE9es (le Myst\xE8re de la Passion d'Arnoul Gr\xE9ban dure 4 jours). Des centaines de figurants, des machines spectaculaires.","La farce \u2014 courte, comique, populaire \u2014 na\xEEt dans les rues et les foires. La Farce de Ma\xEEtre Pathelin (v. 1465) est un chef-d'\u0153uvre d'humour et de ruse, toujours jou\xE9 aujourd'hui.","Les Confr\xE8res de la Passion obtiennent le monopole du th\xE9\xE2tre \xE0 Paris en 1402 \xE0 l'H\xF4pital de la Trinit\xE9. La moralit\xE9 (pi\xE8ce all\xE9gorique) et la sottie (satire politique jou\xE9e par des 'sots' en costume de fou) compl\xE8tent le r\xE9pertoire."],quiz:[{q:"Combien de jours durait le Myst\xE8re de la Passion de Gr\xE9ban ?",o:["1 jour","2 jours","4 jours","7 jours"],a:2},{q:"Qu'est-ce qu'une sottie ?",o:["Une trag\xE9die","Une satire politique jou\xE9e par des fous","Un myst\xE8re religieux","Une farce"],a:1}]},{id:"h_d4",title:"L'improvisation",cat:"Techniques",icon:"\u{1F3AD}",dur:"8 min",xp:20,content:["L'improvisation est la base de tout jeu vivant. M\xEAme un texte appris par c\u0153ur se joue 'comme si c'\xE9tait la premi\xE8re fois' \u2014 c'est l'illusion de la premi\xE8re fois, concept fondamental du th\xE9\xE2tre.","R\xE8gle d'or : ne jamais bloquer la proposition du partenaire. Accepter et rebondir \u2014 c'est le 'Oui, et\u2026'. Dire 'non' ferme la sc\xE8ne ; dire 'oui, et\u2026' l'ouvre \xE0 l'infini.","Keith Johnstone (Impro, 1979) et Viola Spolin (Improvisation for the Theater, 1963) sont les pionniers de l'impro moderne. Johnstone insiste sur le statut, Spolin sur le jeu sensoriel.","L'impro d\xE9veloppe l'\xE9coute, la r\xE9activit\xE9, la confiance en soi et la g\xE9n\xE9rosit\xE9 \u2014 des qualit\xE9s essentielles pour tout com\xE9dien, m\xEAme dans le th\xE9\xE2tre de texte. C'est aussi un spectacle \xE0 part enti\xE8re (match d'impro, format long)."],quiz:[{q:"Quelle est la r\xE8gle d'or de l'improvisation ?",o:["Dire non pour surprendre","Oui, et\u2026","Toujours \xEAtre dr\xF4le","Parler le plus vite possible"],a:1},{q:"Qui a \xE9crit 'Impro' en 1979 ?",o:["Viola Spolin","Keith Johnstone","Jacques Lecoq","Augusto Boal"],a:1}]}],amateur:[{id:"h_am1",title:"M\xE9thode Stanislavski",cat:"Techniques",icon:"\u{1F9E0}",dur:"12 min",xp:35,content:["Constantin Stanislavski (1863\u20131938), cofondateur du Th\xE9\xE2tre d'Art de Moscou, cr\xE9e le premier 'syst\xE8me' complet de formation de l'acteur. Avant lui, le jeu reposait sur le talent naturel et l'imitation.","Ses outils : la m\xE9moire affective (puiser dans ses propres souvenirs pour nourrir l'\xE9motion du personnage), le 'si magique' (que ferais-je SI j'\xE9tais dans cette situation ?), les circonstances donn\xE9es, le super-objectif du personnage.","Son syst\xE8me \xE9volue au fil de sa vie : de la reviviscence (revivre l'\xE9motion) vers les actions physiques (le corps g\xE9n\xE8re l'\xE9motion). Cette \xE9volution est souvent m\xE9connue \u2014 l'Actors Studio de Strasberg ne retient que la premi\xE8re phase.","L'Actors Studio (fond\xE9 en 1947 \xE0 New York) applique sa m\xE9thode : Brando, Pacino, De Niro, Meryl Streep. Mais Stella Adler et Sanford Meisner proposent des variantes importantes \u2014 le d\xE9bat sur 'la bonne m\xE9thode' dure encore aujourd'hui."],quiz:[{q:"Quel est le concept central de la premi\xE8re p\xE9riode de Stanislavski ?",o:["La distanciation","La m\xE9moire affective","Le mime","L'improvisation pure"],a:1},{q:"Vers quoi \xE9volue Stanislavski dans sa deuxi\xE8me p\xE9riode ?",o:["Le th\xE9\xE2tre de l'absurde","Les actions physiques","Le th\xE9\xE2tre politique","L'abandon du texte"],a:1},{q:"Qui fonde l'Actors Studio en 1947 ?",o:["Stanislavski lui-m\xEAme","Lee Strasberg","Stella Adler","Elia Kazan et Cheryl Crawford"],a:3}]},{id:"h_am2",title:"Tchekhov, po\xE8te du quotidien",cat:"Auteurs",icon:"\u2712\uFE0F",dur:"10 min",xp:30,content:["Anton Tchekhov (1860\u20131904), m\xE9decin et dramaturge russe, r\xE9volutionne le th\xE9\xE2tre en montrant la vie telle qu'elle est \u2014 sans h\xE9ros, sans p\xE9rip\xE9ties spectaculaires, juste des \xEAtres humains qui attendent, esp\xE8rent, et se manquent.","Ses quatre grandes pi\xE8ces : La Mouette (l'art vs la vie), Oncle Vania (le temps perdu), Les Trois S\u0153urs (le r\xEAve inaccessible), La Cerisaie (la fin d'un monde). Chacune est un chef-d'\u0153uvre de subtilit\xE9.","L'essentiel chez Tchekhov est dans le non-dit, le silence, le regard, ce qui se passe entre les r\xE9pliques. Ses personnages parlent de la pluie, mais on entend leur c\u0153ur se briser. C'est le triomphe du sous-texte.","Sa collaboration avec Stanislavski au Th\xE9\xE2tre d'Art de Moscou (\xE0 partir de 1898) change l'histoire du th\xE9\xE2tre mondial \u2014 m\xEAme si les deux hommes n'\xE9taient pas toujours d'accord sur l'interpr\xE9tation."],quiz:[{q:"Quel est le m\xE9tier de Tchekhov en dehors du th\xE9\xE2tre ?",o:["Avocat","M\xE9decin","Professeur","Militaire"],a:1},{q:"Quelle pi\xE8ce de Tchekhov traite de la fin d'un monde aristocratique ?",o:["La Mouette","Oncle Vania","Les Trois S\u0153urs","La Cerisaie"],a:3},{q:"Avec quel metteur en sc\xE8ne Tchekhov collabore-t-il ?",o:["Meyerhold","Stanislavski","Brecht","Grotowski"],a:1}]},{id:"h_am3",title:"Le travail \xE0 la table",cat:"Techniques",icon:"\u{1F4D6}",dur:"10 min",xp:30,content:["Avant de se lever pour jouer, on s'assoit. Le travail \xE0 la table est la premi\xE8re \xE9tape des r\xE9p\xE9titions \u2014 parfois la plus longue et la plus importante.","On analyse le texte en profondeur : qui parle ? \xE0 qui ? pourquoi ? dans quel contexte historique et \xE9motionnel ? avec quelle intention cach\xE9e ? quel est le non-dit ?","Les questions fondamentales pour chaque sc\xE8ne : quel est l'objectif du personnage (ce qu'il veut) ? quel est son obstacle (ce qui l'emp\xEAche) ? quelle est la relation avec l'autre (amour, pouvoir, manipulation) ? comment la sc\xE8ne le transforme ?","Le travail \xE0 la table peut durer des semaines chez certains metteurs en sc\xE8ne (Patrice Ch\xE9reau y passait un mois). Plus il est profond, plus le jeu sera riche \u2014 parce que l'acteur sait exactement POURQUOI il dit chaque mot."],quiz:[{q:"Quelle est la premi\xE8re question \xE0 se poser au travail \xE0 la table ?",o:["Comment je me d\xE9place ?","Quel est l'objectif de mon personnage ?","Quelle voix je prends ?","O\xF9 est mon costume ?"],a:1},{q:"Quel metteur en sc\xE8ne \xE9tait connu pour un tr\xE8s long travail \xE0 la table ?",o:["Bob Wilson","Patrice Ch\xE9reau","Peter Brook","Ariane Mnouchkine"],a:1}]},{id:"h_am4",title:"Marivaux, la surprise de l'amour",cat:"Auteurs",icon:"\u2712\uFE0F",dur:"8 min",xp:25,content:["Pierre de Marivaux (1688\u20131763) explore comme personne les m\xE9andres du sentiment amoureux. Ses personnages ne tombent pas amoureux \u2014 ils le d\xE9couvrent malgr\xE9 eux, et cette d\xE9couverte EST la pi\xE8ce.","Le Jeu de l'amour et du hasard (deux couples \xE9changent leurs r\xF4les), Les Fausses Confidences (un valet orchestre une d\xE9claration impossible), La Double Inconstance (on manipule deux amoureux pour les s\xE9parer).","Le 'marivaudage' : ce langage subtil o\xF9 l'on dit le contraire de ce qu'on ressent, o\xF9 un 'je ne vous aime pas' veut dire 'je meurs d'amour'. C'est un badinage sophistiqu\xE9 qui cache des \xE9motions br\xFBlantes.","Contrairement \xE0 Moli\xE8re qui observe les types sociaux, Marivaux observe le c\u0153ur en temps r\xE9el. Ses personnages se surprennent eux-m\xEAmes \u2014 et c'est cette surprise qui enchante le public depuis 300 ans."],quiz:[{q:"Qu'est-ce que le marivaudage ?",o:["Crier ses sentiments","Dire le contraire de ce qu'on ressent","Un style de combat sc\xE9nique","Une forme d'improvisation"],a:1},{q:"Dans quelle pi\xE8ce deux couples \xE9changent-ils leurs r\xF4les ?",o:["Les Fausses Confidences","La Double Inconstance","Le Jeu de l'amour et du hasard","L'\xCEle des esclaves"],a:2}]}],pensionnaire:[{id:"h_pe1",title:"Th\xE9\xE2tre de l'absurde",cat:"Histoire",icon:"\u{1F32C}\uFE0F",dur:"10 min",xp:30,content:["Apr\xE8s 1945, le traumatisme de la guerre remet en question le sens m\xEAme de l'existence. Le th\xE9\xE2tre de l'absurde met cette crise en sc\xE8ne : le langage se d\xE9r\xE8gle, l'action tourne en rond, les personnages sont perdus.","Samuel Beckett, En attendant Godot (1953) : deux clochards attendent quelqu'un qui ne viendra jamais. Tout est dit. Le vide, l'attente, l'espoir absurde \u2014 et pourtant, c'est dr\xF4le et profond\xE9ment humain.","Eug\xE8ne Ionesco, La Cantatrice chauve (1950) : un couple anglais \xE9change des banalit\xE9s jusqu'\xE0 ce que le langage explose litt\xE9ralement. Les Chaises (1952) : deux vieux pr\xE9parent un discours pour un public de chaises vides.","Le terme 'th\xE9\xE2tre de l'absurde' est invent\xE9 par le critique Martin Esslin en 1961. Ionesco et Beckett refusent l'\xE9tiquette. Avec Adamov, Genet, Arrabal, Pinter \u2014 ce mouvement est l'un des plus jou\xE9s au monde aujourd'hui."],quiz:[{q:"En quelle ann\xE9e est cr\xE9\xE9 En attendant Godot ?",o:["1945","1950","1953","1961"],a:2},{q:"Qui invente le terme 'th\xE9\xE2tre de l'absurde' ?",o:["Ionesco","Beckett","Martin Esslin","Jean-Paul Sartre"],a:2},{q:"Dans Les Chaises de Ionesco, \xE0 qui s'adressent les deux vieux ?",o:["Au public","\xC0 des fant\xF4mes","\xC0 des chaises vides","\xC0 Dieu"],a:2}]},{id:"h_pe2",title:"Le th\xE9\xE2tre physique",cat:"Techniques",icon:"\u{1F3C3}",dur:"10 min",xp:30,content:["Le th\xE9\xE2tre physique place le corps au centre de l'expression \u2014 les mots deviennent secondaires, voire disparaissent. Le corps raconte, exprime, transforme.","Jacques Lecoq (1921\u20131999) fonde son \xE9cole \xE0 Paris en 1956. Sa p\xE9dagogie repose sur le mouvement, l'observation du vivant, et le masque neutre \u2014 un masque sans expression qui force le corps \xE0 tout communiquer.","Le masque neutre est un outil p\xE9dagogique extraordinaire : quand le visage est neutre, le corps doit prendre le relais. L'\xE9l\xE8ve d\xE9couvre que son dos, ses mains, sa d\xE9marche racontent autant que son visage.","L'h\xE9ritage de Lecoq est immense : la compagnie Complicit\xE9 (Simon McBurney), DV8, le Th\xE9\xE2tre du Mouvement, et des centaines d'artistes dans le monde. Le Cirque du Soleil puise aussi dans sa p\xE9dagogie."],quiz:[{q:"En quelle ann\xE9e Lecoq fonde-t-il son \xE9cole \xE0 Paris ?",o:["1947","1956","1963","1972"],a:1},{q:"\xC0 quoi sert le masque neutre ?",o:["\xC0 effrayer le public","\xC0 forcer le corps \xE0 tout exprimer","\xC0 cacher l'identit\xE9 de l'acteur","\xC0 prot\xE9ger le visage"],a:1},{q:"Quelle compagnie britannique est directement issue de l'enseignement de Lecoq ?",o:["Royal Shakespeare","Complicit\xE9","DV8","Punchdrunk"],a:1}]},{id:"h_pe3",title:"La mise en sc\xE8ne moderne",cat:"Techniques",icon:"\u{1F3AC}",dur:"10 min",xp:30,content:["Le metteur en sc\xE8ne est un m\xE9tier r\xE9cent. Avant le XIXe si\xE8cle, les acteurs principaux organisaient eux-m\xEAmes les repr\xE9sentations \u2014 on appelait \xE7a le 'r\xE9gisseur'.","Andr\xE9 Antoine (1858\u20131943) r\xE9volutionne le th\xE9\xE2tre en 1887 avec le Th\xE9\xE2tre-Libre : il orchestre tous les \xE9l\xE9ments (jeu, d\xE9cor, lumi\xE8re, son) pour cr\xE9er une vision coh\xE9rente. C'est la naissance de la mise en sc\xE8ne moderne.","La mise en sc\xE8ne pense l'espace, le temps, la lumi\xE8re, le son, les corps et le texte comme un tout organique. Deux mises en sc\xE8ne du m\xEAme Hamlet peuvent \xEAtre radicalement oppos\xE9es \u2014 et toutes deux l\xE9gitimes.","Au XXe si\xE8cle, les grands metteurs en sc\xE8ne deviennent des auteurs \xE0 part enti\xE8re : Stanislavski, Meyerhold, Brecht, Brook, Strehler, Mnouchkine, Ch\xE9reau, Wilson \u2014 chacun avec sa vision du monde et du th\xE9\xE2tre."],quiz:[{q:"Qui est consid\xE9r\xE9 comme le premier metteur en sc\xE8ne moderne en France ?",o:["Moli\xE8re","Andr\xE9 Antoine","Jacques Copeau","Louis Jouvet"],a:1},{q:"En quelle ann\xE9e Antoine cr\xE9e-t-il le Th\xE9\xE2tre-Libre ?",o:["1850","1870","1887","1900"],a:2},{q:"Avant la mise en sc\xE8ne moderne, qui organisait les repr\xE9sentations ?",o:["Le roi","Les acteurs principaux","Le public","Les auteurs"],a:1}]},{id:"h_pe4",title:"Hugo et le th\xE9\xE2tre romantique",cat:"Auteurs",icon:"\u2712\uFE0F",dur:"10 min",xp:30,content:["Victor Hugo (1802\u20131885) publie la Pr\xE9face de Cromwell en 1827 : un manifeste explosif contre les r\xE8gles du classicisme. Il veut m\xEAler le sublime et le grotesque, les rois et le peuple, la po\xE9sie et la violence.","Hernani (25 f\xE9vrier 1830) provoque une bataille m\xE9morable dans la salle : les jeunes romantiques (men\xE9s par Th\xE9ophile Gautier en gilet rouge) applaudissent, les classiques sifflent. 45 soir\xE9es de chahut. Le th\xE9\xE2tre fran\xE7ais bascule.","Ruy Blas (1838) est son chef-d'\u0153uvre dramatique : un valet amoureux d'une reine, qui harangue les ministres corrompus. Lucr\xE8ce Borgia, Le Roi s'amuse, Marie Tudor compl\xE8tent un th\xE9\xE2tre ambitieux et spectaculaire.","Paradoxe : Hugo lib\xE8re le th\xE9\xE2tre de 200 ans de r\xE8gles classiques... tout en \xE9crivant en alexandrins magnifiques. Son vers est libre dans le classique \u2014 il casse la c\xE9sure, enjambe, rejette, et fait de l'alexandrin un instrument de libert\xE9."],quiz:[{q:"En quelle ann\xE9e a lieu la bataille d'Hernani ?",o:["1827","1830","1838","1848"],a:1},{q:"Quel personnage de Hugo est un valet amoureux d'une reine ?",o:["Hernani","Ruy Blas","Triboulet","Lucr\xE8ce"],a:1},{q:"Quelle couleur portait Th\xE9ophile Gautier \xE0 la premi\xE8re d'Hernani ?",o:["Un chapeau noir","Un gilet rouge","Une cape bleue","Une \xE9charpe blanche"],a:1}]}],societaire:[{id:"h_so1",title:"Le classicisme fran\xE7ais",cat:"Histoire",icon:"\u{1F3DB}\uFE0F",dur:"12 min",xp:35,content:["Le classicisme th\xE9\xE2tral fran\xE7ais (1630\u20131680) impose la r\xE8gle des trois unit\xE9s : temps (24h maximum), lieu (un seul d\xE9cor), action (une seule intrigue principale). Ces r\xE8gles viennent d'une interpr\xE9tation (discutable) de la Po\xE9tique d'Aristote.","Corneille incarne l'h\xE9ro\xEFsme : Le Cid (1637) pose le dilemme honneur vs amour. Racine incarne la passion fatale : Ph\xE8dre (1677) montre une femme d\xE9vor\xE9e par un amour interdit. Moli\xE8re incarne le comique de caract\xE8re : Tartuffe, L'Avare.","L'alexandrin \u2014 12 syllabes avec c\xE9sure \xE0 la 6e \u2014 est le vers roi du th\xE9\xE2tre classique. Sa musicalit\xE9 impose un rythme qui structure la pens\xE9e et l'\xE9motion. Bien dit, il n'est jamais monotone \u2014 c'est une architecture sonore.","La Com\xE9die-Fran\xE7aise, fond\xE9e en 1680 par Louis XIV (fusion de la troupe de Moli\xE8re et de celle de l'H\xF4tel de Bourgogne), est le plus ancien th\xE9\xE2tre permanent au monde encore en activit\xE9. Les acteurs titulaires s'appellent 'soci\xE9taires'."],quiz:[{q:"De quelle \u0153uvre antique s'inspirent les trois unit\xE9s ?",o:["L'Iliade d'Hom\xE8re","La Po\xE9tique d'Aristote","Les Dialogues de Platon","L'\xC9n\xE9ide de Virgile"],a:1},{q:"En quelle ann\xE9e est fond\xE9e la Com\xE9die-Fran\xE7aise ?",o:["1660","1673","1680","1700"],a:2},{q:"Comment s'appellent les acteurs titulaires de la Com\xE9die-Fran\xE7aise ?",o:["Pensionnaires","Soci\xE9taires","Com\xE9diens du Roi","Interpr\xE8tes"],a:1}]},{id:"h_so2",title:"Corneille vs Racine",cat:"Histoire",icon:"\u2712\uFE0F",dur:"10 min",xp:30,content:["Pierre Corneille (1606\u20131684) et Jean Racine (1639\u20131699) incarnent deux visions oppos\xE9es de la trag\xE9die. Leur rivalit\xE9 est le grand feuilleton litt\xE9raire du XVIIe si\xE8cle.","Corneille croit au libre arbitre : ses h\xE9ros (Rodrigue, Auguste, Polyeucte) choisissent, luttent, triomphent par la volont\xE9. Le sublime corn\xE9lien, c'est la victoire de la grandeur d'\xE2me sur les passions.","Racine croit \xE0 la fatalit\xE9 : ses personnages (Ph\xE8dre, Hermione, N\xE9ron) sont prisonniers de passions qui les d\xE9passent. Le sublime racinien, c'est la beaut\xE9 du d\xE9sastre \u2014 la perfection formelle qui dit l'impuissance humaine.","La querelle \xE9clate en 1670 quand les deux \xE9crivent chacun une B\xE9r\xE9nice. Celle de Racine triomphe, celle de Corneille (Tite et B\xE9r\xE9nice) \xE9choue. C'est le passage de t\xE9moin \u2014 et la cons\xE9cration de Racine comme le nouveau ma\xEEtre."],quiz:[{q:"Quelle est la vision de l'homme chez Corneille ?",o:["L'homme est victime du destin","L'homme peut choisir et triompher par sa volont\xE9","L'homme est fondamentalement comique","L'homme est absurde"],a:1},{q:"En quelle ann\xE9e Corneille et Racine \xE9crivent-ils chacun une B\xE9r\xE9nice ?",o:["1660","1667","1670","1677"],a:2},{q:"Qui remporte la 'bataille des B\xE9r\xE9nice' ?",o:["Corneille","Racine","Match nul","Moli\xE8re"],a:1}]},{id:"h_so3",title:"La lumi\xE8re au th\xE9\xE2tre",cat:"Techniques",icon:"\u{1F4A1}",dur:"10 min",xp:30,content:["Avant l'\xE9lectricit\xE9 : bougies (le lustre de la Com\xE9die-Fran\xE7aise en comptait 320), rampe \xE0 huile au bord de la sc\xE8ne, torches. Au Globe de Shakespeare, on jouait de jour \u2014 le texte devait cr\xE9er la nuit.","L'arriv\xE9e de l'\xE9clairage au gaz (1822) puis de l'\xE9lectricit\xE9 (1880) r\xE9volutionne le th\xE9\xE2tre : on peut enfin cr\xE9er l'obscurit\xE9, isoler un acteur dans un faisceau, sculpter l'espace avec la lumi\xE8re.","Les bases de l'\xE9clairage sc\xE9nique : la face aplatit, le lat\xE9ral sculpte, la douche isole et \xE9crase, le contre-jour cr\xE9e le myst\xE8re et la silhouette. La combinaison de ces angles cr\xE9e une infinit\xE9 d'ambiances.","Le cr\xE9ateur lumi\xE8re est un artiste \xE0 part enti\xE8re depuis les ann\xE9es 1960. Des noms comme Dominique Brugui\xE8re, Patrice Trottier, ou Robert Wilson (qui est autant \xE9clairagiste que metteur en sc\xE8ne) ont \xE9lev\xE9 la lumi\xE8re au rang d'\xE9criture sc\xE9nique."],quiz:[{q:"Combien de bougies comptait le lustre de la Com\xE9die-Fran\xE7aise ?",o:["120","220","320","520"],a:2},{q:"En quelle ann\xE9e l'\xE9clairage au gaz arrive-t-il au th\xE9\xE2tre ?",o:["1780","1822","1850","1880"],a:1},{q:"Quel type d'\xE9clairage cr\xE9e un effet de myst\xE8re et de silhouette ?",o:["La face","Le lat\xE9ral","La douche","Le contre-jour"],a:3}]},{id:"h_so4",title:"Le texte classique : mode d'emploi",cat:"Techniques",icon:"\u{1F4D6}",dur:"12 min",xp:35,content:["L'alexandrin a 12 syllabes avec une c\xE9sure (pause respiratoire et rythmique) apr\xE8s la 6e syllabe. 'Je suis ma\xEEtre / de moi comme / de l'univers' (Corneille). Ce n'est pas un carcan \u2014 c'est un trampoline.","Les rimes organisent la musique du texte : suivies (AABB), crois\xE9es (ABAB), embrass\xE9es (ABBA). Les rimes masculines (termin\xE9es par une syllabe accentu\xE9e) et f\xE9minines (termin\xE9es par un 'e' muet) alternent obligatoirement.","Dire le vers sans le chanter : respecter le rythme naturel de l'alexandrin sans tomber dans la m\xE9lodie artificielle. Il faut parler EN vers, pas r\xE9citer DES vers. L'alexandrin est un souffle, pas une chanson.","Le rejet (quand un mot 'd\xE9borde' sur le vers suivant) cr\xE9e un effet de surprise et de tension. Hugo en fait un usage r\xE9volutionnaire : 'Lui ? / Oui.' L'enjambement, le contre-rejet \u2014 ces outils sont les armes expressives du vers classique."],quiz:[{q:"Quelle est la r\xE8gle d'alternance obligatoire dans le vers classique ?",o:["Rimes riches et pauvres","Alexandrins et octosyllabes","Rimes masculines et f\xE9minines","Vers longs et courts"],a:2},{q:"Qu'est-ce qu'un 'rejet' en versification ?",o:["Un vers supprim\xE9","Un mot qui d\xE9borde sur le vers suivant","Une rime rat\xE9e","Un silence dans le vers"],a:1},{q:"Quel sch\xE9ma de rimes correspond \xE0 ABBA ?",o:["Rimes suivies","Rimes crois\xE9es","Rimes embrass\xE9es","Rimes libres"],a:2}]}],interprete:[{id:"h_in1",title:"Brecht & la distanciation",cat:"Techniques",icon:"\u{1F3AD}",dur:"15 min",xp:45,content:["Bertolt Brecht (1898\u20131956) s'oppose frontalement \xE0 Stanislavski : l\xE0 o\xF9 le Russe veut l'identification \xE9motionnelle, l'Allemand veut \xE9veiller l'esprit critique. Le spectateur ne doit pas 'ressentir' \u2014 il doit 'r\xE9fl\xE9chir'.","Le Verfremdungseffekt (effet de distanciation ou d'\xE9trang\xE9ification) : l'acteur montre qu'il joue, des pancartes r\xE9sument l'action, des chansons interrompent la narration, l'\xE9clairage est visible. Tout rappelle au public qu'il est au th\xE9\xE2tre.","Ses pi\xE8ces sont des paraboles politiques : M\xE8re Courage (la guerre comme commerce), L'Op\xE9ra de quat'sous (la criminalit\xE9 comme m\xE9taphore du capitalisme), La R\xE9sistible Ascension d'Arturo Ui (Hitler en gangster de Chicago), Le Cercle de craie caucasien.","Paradoxe : les pi\xE8ces de Brecht, cens\xE9es emp\xEAcher l'\xE9motion, sont parmi les plus \xE9mouvantes du r\xE9pertoire. M\xE8re Courage qui tire sa carriole en chantant est l'une des images les plus d\xE9chirantes du th\xE9\xE2tre mondial."],quiz:[{q:"Quel est l'objectif du Verfremdungseffekt chez Brecht ?",o:["Faire pleurer le public","\xC9veiller l'esprit critique du spectateur","Divertir sans r\xE9fl\xE9chir","Cr\xE9er une transe collective"],a:1},{q:"Quelle pi\xE8ce de Brecht est une parabole sur Hitler ?",o:["M\xE8re Courage","L'Op\xE9ra de quat'sous","La R\xE9sistible Ascension d'Arturo Ui","Le Cercle de craie caucasien"],a:2},{q:"Quel est le paradoxe de Brecht ?",o:["Il \xE9crit mal mais met bien en sc\xE8ne","Ses pi\xE8ces anti-\xE9motionnelles sont tr\xE8s \xE9mouvantes","Il d\xE9teste le th\xE9\xE2tre","Il refuse de monter ses propres pi\xE8ces"],a:1}]},{id:"h_in2",title:"Artaud & la cruaut\xE9",cat:"Techniques",icon:"\u{1F525}",dur:"12 min",xp:40,content:["Antonin Artaud (1896\u20131948) r\xEAve d'un th\xE9\xE2tre qui agit sur les sens comme une peste, un incendie, un choc physique. Son manifeste Le Th\xE9\xE2tre et son Double (1938) est l'un des textes les plus influents de l'histoire du th\xE9\xE2tre.","'Cruaut\xE9' ne signifie pas violence gratuite mais rigueur absolue, n\xE9cessit\xE9, mise \xE0 nu. C'est la cruaut\xE9 de l'existence elle-m\xEAme. Artaud veut un th\xE9\xE2tre aussi in\xE9vitable qu'une op\xE9ration chirurgicale.","Pour Artaud, le texte litt\xE9raire est un obstacle \u2014 le vrai th\xE9\xE2tre est fait de cris, de souffles, de gestes, de lumi\xE8res, de sons. Il r\xEAve d'un 'langage physique' qui atteindrait directement le syst\xE8me nerveux du spectateur.","Son influence est immense malgr\xE9 (ou \xE0 cause de) le fait qu'il n'a presque rien r\xE9alis\xE9 concr\xE8tement : le Living Theatre, Grotowski, Peter Brook, Jan Fabre, Romeo Castellucci \u2014 tous se r\xE9clament de lui. Son th\xE9\xE2tre est plus un horizon qu'une m\xE9thode."],quiz:[{q:"Quel est le titre du manifeste d'Artaud publi\xE9 en 1938 ?",o:["Le Th\xE9\xE2tre Cruel","Le Th\xE9\xE2tre et son Double","Vers un th\xE9\xE2tre pauvre","L'Espace Vide"],a:1},{q:"Que signifie 'cruaut\xE9' chez Artaud ?",o:["Violence physique sur sc\xE8ne","Rigueur absolue et n\xE9cessit\xE9","Sadisme envers le public","Destruction du d\xE9cor"],a:1},{q:"Pourquoi l'influence d'Artaud est-elle paradoxale ?",o:["Il a tout r\xE9alis\xE9 mais personne ne s'en souvient","Il n'a presque rien r\xE9alis\xE9 mais son influence est immense","Il a refus\xE9 d'\xEAtre publi\xE9","Il ne parlait que de cin\xE9ma"],a:1}]},{id:"h_in3",title:"Peter Brook et l'espace vide",cat:"Techniques",icon:"\u{1F3AD}",dur:"12 min",xp:45,content:["Peter Brook (1925\u20132022), metteur en sc\xE8ne britannique, pose une question simple mais r\xE9volutionnaire : 'Je peux prendre n'importe quel espace vide et l'appeler une sc\xE8ne. Un homme traverse cet espace pendant que quelqu'un d'autre l'observe, et c'est tout ce dont j'ai besoin pour qu'un acte de th\xE9\xE2tre commence.'","Pour Brook, le th\xE9\xE2tre n'a besoin que de trois \xE9l\xE9ments : un acteur, un spectateur, et l'espace entre eux. Tout le reste \u2014 d\xE9cor, costumes, lumi\xE8re, musique \u2014 est optionnel. C'est une philosophie de la d\xE9pouille radicale qui lib\xE8re \xE0 la fois le cr\xE9ateur et le spectateur.","Son livre L'Espace vide (1968) distingue quatre formes : le th\xE9\xE2tre mortel (fig\xE9, sans vie), le sacr\xE9 (rituel), le brut (populaire), et l'imm\xE9diat (vivant). Cette classification r\xE9volutionne la pens\xE9e th\xE9\xE2trale et influence des g\xE9n\xE9rations de m
