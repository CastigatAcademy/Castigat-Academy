cat:"confiance",q:"Te sens-tu l\xE9gitime quand tu travailles un texte ?",opts:[{id:"a",text:"Oui, totalement",val:3},{id:"b",text:"De plus en plus",val:2},{id:"c",text:"\xC7a d\xE9pend des jours",val:1},{id:"d",text:"Rarement",val:0}]},{id:"dq4",cat:"confiance",q:"Quand tu te compares \xE0 d'autres com\xE9dien\xB7nes, tu te dis\u2026",opts:[{id:"a",text:"On a chacun notre truc",val:3},{id:"b",text:"Je progresse \xE0 mon rythme",val:2},{id:"c",text:"Ils sont meilleurs que moi",val:1},{id:"d",text:"Je ne suis pas \xE0 la hauteur",val:0}]},{id:"dq5",cat:"confiance",q:"As-tu os\xE9 jouer devant quelqu'un r\xE9cemment ?",opts:[{id:"a",text:"Oui, et c'\xE9tait bien",val:3},{id:"b",text:"Oui, mais j'\xE9tais nerveux\xB7se",val:2},{id:"c",text:"Non, pas encore le courage",val:1},{id:"d",text:"Jouer devant quelqu'un ? Jamais",val:0}]},{id:"dq6",cat:"trac",q:"Quel est ton niveau de trac en ce moment ?",opts:[{id:"a",text:"Zen total",val:3},{id:"b",text:"Un petit trac motivant",val:2},{id:"c",text:"Assez stress\xE9\xB7e",val:1},{id:"d",text:"Paralys\xE9\xB7e rien que d'y penser",val:0}]},{id:"dq7",cat:"trac",q:"Qu'est-ce qui te fait le plus peur sur sc\xE8ne ?",opts:[{id:"a",text:"Rien de particulier",val:3},{id:"b",text:"Le regard des autres",val:1},{id:"c",text:"Oublier mon texte",val:1},{id:"d",text:"\xCAtre ridicule",val:0}]},{id:"dq8",cat:"trac",q:"Quand tu penses \xE0 ta prochaine performance, tu ressens\u2026",opts:[{id:"a",text:"De l'excitation",val:3},{id:"b",text:"Un m\xE9lange excitation/stress",val:2},{id:"c",text:"Surtout de l'appr\xE9hension",val:1},{id:"d",text:"De l'angoisse",val:0}]},{id:"dq9",cat:"trac",q:"Le trac, pour toi, c'est\u2026",opts:[{id:"a",text:"Un moteur qui me booste",val:3},{id:"b",text:"Normal, \xE7a fait partie du jeu",val:2},{id:"c",text:"Un frein que j'apprends \xE0 g\xE9rer",val:1},{id:"d",text:"Un mur que je n'arrive pas \xE0 franchir",val:0}]},{id:"dq10",cat:"trac",q:"Avant un exercice, tu te sens g\xE9n\xE9ralement\u2026",opts:[{id:"a",text:"Impatient\xB7e de commencer",val:3},{id:"b",text:"Concentr\xE9\xB7e",val:2},{id:"c",text:"Un peu tendu\xB7e",val:1},{id:"d",text:"J'ai envie de procrastiner",val:0}]},{id:"dq11",cat:"blocage",q:"Qu'est-ce qui te bloque le plus en ce moment ?",opts:[{id:"a",text:"Rien, tout roule",val:3},{id:"b",text:"Le corps \u2014 je suis raide",val:1},{id:"c",text:"La voix \u2014 je manque de puissance",val:1},{id:"d",text:"Les \xE9motions \u2014 j'ai du mal \xE0 l\xE2cher prise",val:0}]},{id:"dq12",cat:"blocage",q:"Arrives-tu \xE0 exprimer des \xE9motions fortes en jouant ?",opts:[{id:"a",text:"Oui, facilement",val:3},{id:"b",text:"\xC7a vient de mieux en mieux",val:2},{id:"c",text:"Seulement certaines",val:1},{id:"d",text:"Tr\xE8s difficilement",val:0}]},{id:"dq13",cat:"blocage",q:"Ton plus grand d\xE9fi technique en ce moment ?",opts:[{id:"a",text:"J'ai pas de d\xE9fi particulier",val:3},{id:"b",text:"La projection de voix",val:1},{id:"c",text:"La m\xE9morisation",val:1},{id:"d",text:"\xCAtre naturel\xB7le",val:0}]},{id:"dq14",cat:"blocage",q:"Quand tu travailles un monologue, le plus dur c'est\u2026",opts:[{id:"a",text:"Rien, j'adore \xE7a",val:3},{id:"b",text:"Trouver la bonne intention",val:1},{id:"c",text:"Ne pas sur-jouer",val:1},{id:"d",text:"Retenir le texte",val:0}]},{id:"dq15",cat:"blocage",q:"Si tu devais improviser une sc\xE8ne maintenant\u2026",opts:[{id:"a",text:"Facile, je me lance",val:3},{id:"b",text:"\xC7a irait avec un th\xE8me donn\xE9",val:2},{id:"c",text:"J'aurais besoin de temps",val:1},{id:"d",text:"Impensable",val:0}]},{id:"dq16",cat:"motivation",q:"Quel est ton niveau d'\xE9nergie pour t'entra\xEEner aujourd'hui ?",opts:[{id:"a",text:"\xC0 fond",val:3},{id:"b",text:"Correct",val:2},{id:"c",text:"Pas terrible",val:1},{id:"d",text:"\xC9puis\xE9\xB7e",val:0}]},{id:"dq17",cat:"motivation",q:"Qu'est-ce qui te motive le plus dans le th\xE9\xE2tre ?",opts:[{id:"a",text:"Le plaisir de jouer",val:3},{id:"b",text:"Progresser et me d\xE9passer",val:2},{id:"c",text:"Vaincre ma timidit\xE9",val:1},{id:"d",text:"Je sais pas trop en ce moment",val:0}]},{id:"dq18",cat:"motivation",q:"Aujourd'hui, tu as envie de\u2026",opts:[{id:"a",text:"Me donner \xE0 fond",val:3},{id:"b",text:"Un entra\xEEnement tranquille",val:2},{id:"c",text:"Juste un petit exercice",val:1},{id:"d",text:"Pas grand-chose honn\xEAtement",val:0}]},{id:"dq19",cat:"motivation",q:"Depuis que tu t'entra\xEEnes, tu sens que\u2026",opts:[{id:"a",text:"Je progresse vraiment",val:3},{id:"b",text:"\xC7a avance doucement",val:2},{id:"c",text:"C'est dur de voir les progr\xE8s",val:1},{id:"d",text:"Je stagne",val:0}]},{id:"dq20",cat:"motivation",q:"Qu'est-ce qui te donnerait le plus de boost ?",opts:[{id:"a",text:"R\xE9ussir un exercice difficile",val:3},{id:"b",text:"Des encouragements",val:2},{id:"c",text:"Voir mes progr\xE8s concr\xE8tement",val:1},{id:"d",text:"Moins de pression",val:0}]},{id:"dq21",cat:"corps",q:"Comment te sens-tu dans ton corps aujourd'hui ?",opts:[{id:"a",text:"D\xE9tendu\xB7e et disponible",val:3},{id:"b",text:"Correct, un peu raide",val:2},{id:"c",text:"Tendu\xB7e",val:1},{id:"d",text:"Compl\xE8tement crisp\xE9\xB7e",val:0}]},{id:"dq22",cat:"corps",q:"Ta voix ce matin, elle est\u2026",opts:[{id:"a",text:"Claire et pos\xE9e",val:3},{id:"b",text:"Normale",val:2},{id:"c",text:"Un peu voil\xE9e",val:1},{id:"d",text:"Fatigu\xE9e, j'ai du mal \xE0 projeter",val:0}]},{id:"dq23",cat:"corps",q:"Quand tu parles fort, tu sens\u2026",opts:[{id:"a",text:"Que ma voix porte naturellement",val:3},{id:"b",text:"Que \xE7a va mais je force un peu",val:2},{id:"c",text:"Que je me fatigue vite",val:1},{id:"d",text:"Que \xE7a bloque dans la gorge",val:0}]},{id:"dq24",cat:"corps",q:"Ton rapport au regard du public\u2026",opts:[{id:"a",text:"J'adore sentir le public",val:3},{id:"b",text:"\xC7a va, je g\xE8re",val:2},{id:"c",text:"\xC7a me d\xE9stabilise encore",val:1},{id:"d",text:"Je fuis les regards",val:0}]},{id:"dq25",cat:"corps",q:"Quand tu occupes un espace de jeu, tu te sens\u2026",opts:[{id:"a",text:"Libre, je bouge naturellement",val:3},{id:"b",text:"\xC0 l'aise si j'ai r\xE9p\xE9t\xE9",val:2},{id:"c",text:"Un peu coinc\xE9\xB7e",val:1},{id:"d",text:"Perdu\xB7e, je sais pas o\xF9 me mettre",val:0}]},{id:"dq26",cat:"pratique",q:"Combien de temps as-tu pour t'entra\xEEner aujourd'hui ?",opts:[{id:"a",text:"Autant que je veux",val:3},{id:"b",text:"15-20 minutes",val:2},{id:"c",text:"5-10 minutes max",val:1},{id:"d",text:"Presque rien",val:0}]},{id:"dq27",cat:"pratique",q:"\xC0 quel moment de la journ\xE9e pr\xE9f\xE8res-tu travailler ?",opts:[{id:"a",text:"Le matin, l'esprit frais",val:2},{id:"b",text:"L'apr\xE8s-midi",val:2},{id:"c",text:"Le soir, au calme",val:2},{id:"d",text:"Quand j'ai 5 min, n'importe quand",val:1}]},{id:"dq28",cat:"pratique",q:"As-tu travaill\xE9 un texte en dehors de l'app cette semaine ?",opts:[{id:"a",text:"Oui, plusieurs fois",val:3},{id:"b",text:"Une fois",val:2},{id:"c",text:"Non, pas encore",val:1},{id:"d",text:"Je ne travaille qu'ici",val:0}]},{id:"dq29",cat:"pratique",q:"Tu pr\xE9f\xE8res travailler\u2026",opts:[{id:"a",text:"Seul\xB7e, tranquille",val:2},{id:"b",text:"Avec quelqu'un pour me donner la r\xE9plique",val:2},{id:"c",text:"En groupe",val:2},{id:"d",text:"J'ai du mal \xE0 me lancer dans tous les cas",val:0}]},{id:"dq30",cat:"pratique",q:"Quel pilier aimerais-tu travailler aujourd'hui ?",opts:[{id:"a",text:"Respiration",val:2},{id:"b",text:"Diction",val:2},{id:"c",text:"Corps",val:2},{id:"d",text:"Intentions",val:2}]},{id:"dq31",cat:"emotions",q:"L'\xE9motion la plus facile \xE0 jouer pour toi ?",opts:[{id:"a",text:"La joie",val:2},{id:"b",text:"La col\xE8re",val:2},{id:"c",text:"La tristesse",val:2},{id:"d",text:"Aucune, j'ai du mal avec toutes",val:0}]},{id:"dq32",cat:"emotions",q:"Quand tu joues, tu arrives \xE0\u2026",opts:[{id:"a",text:"Ressentir vraiment l'\xE9motion",val:3},{id:"b",text:"La simuler de mani\xE8re cr\xE9dible",val:2},{id:"c",text:"Parfois, mais c'est instable",val:1},{id:"d",text:"Rarement l\xE2cher prise",val:0}]},{id:"dq33",cat:"emotions",q:"Apr\xE8s un bon exercice, tu ressens\u2026",opts:[{id:"a",text:"De la fiert\xE9",val:3},{id:"b",text:"Du soulagement",val:2},{id:"c",text:"De la fatigue mais positive",val:2},{id:"d",text:"Pas grand-chose",val:0}]},{id:"dq34",cat:"emotions",q:"Le silence sur sc\xE8ne, pour toi c'est\u2026",opts:[{id:"a",text:"Un outil puissant",val:3},{id:"b",text:"N\xE9cessaire mais stressant",val:2},{id:"c",text:"G\xEAnant, je veux le combler",val:1},{id:"d",text:"Terrifiant",val:0}]},{id:"dq35",cat:"emotions",q:"En ce moment, le th\xE9\xE2tre c'est surtout\u2026",opts:[{id:"a",text:"Un plaisir",val:3},{id:"b",text:"Un challenge stimulant",val:2},{id:"c",text:"Un travail sur moi-m\xEAme",val:1},{id:"d",text:"Une source de doute",val:0}]}],SCENE_ANALYSES=[{id:"sa1",tier:"debutant",title:"Harpagon et sa cassette",source:"Moli\xE8re \u2014 L'Avare, Acte IV, sc\xE8ne 7",context:"Harpagon, un vieil avare parisien, a cach\xE9 une cassette remplie d'or dans son jardin. Quand il d\xE9couvre qu'elle a disparu, il sombre dans une panique totale. C'est un monologue \u2014 il est seul sur sc\xE8ne, face au public.",extract:"Au voleur ! au voleur ! \xE0 l'assassin ! au meurtrier ! Justice, juste Ciel ! je suis perdu, je suis assassin\xE9, on m'a coup\xE9 la gorge, on m'a d\xE9rob\xE9 mon argent. Qui peut-ce \xEAtre ? Qu'est-il devenu ? O\xF9 est-il ? O\xF9 se cache-t-il ? Que ferai-je pour le trouver ? O\xF9 courir ? O\xF9 ne pas courir ? N'est-il point l\xE0 ? N'est-il point ici ?",questions:[{type:"qcm",q:"Quelle \xE9motion principale Harpagon exprime-t-il ?",o:["La joie","La panique et le d\xE9sespoir","La col\xE8re froide","L'indiff\xE9rence"],a:1,expl:"Harpagon est en proie \xE0 une panique totale. L'accumulation de questions et d'exclamations traduit un personnage qui perd compl\xE8tement le contr\xF4le. Son argent EST sa vie \u2014 le perdre \xE9quivaut pour lui \xE0 mourir, d'o\xF9 les termes 'assassin\xE9', 'coup\xE9 la gorge'."},{type:"qcm",q:"Quel proc\xE9d\xE9 stylistique domine dans cette tirade ?",o:["La m\xE9taphore fil\xE9e","L'accumulation de questions rh\xE9toriques","L'ironie","Le champ lexical de la nature"],a:1,expl:"Moli\xE8re utilise une accumulation de questions rh\xE9toriques (\xAB O\xF9 est-il ? O\xF9 se cache-t-il ? \xBB) qui traduit l'affolement total du personnage. Ce proc\xE9d\xE9 cr\xE9e aussi un effet comique par l'exc\xE8s."},{type:"libre",q:"\xC0 votre avis, pourquoi Moli\xE8re fait-il dire \xE0 Harpagon 'on m'a coup\xE9 la gorge' alors qu'il s'agit d'un vol d'argent ? Quel effet cela produit-il ?",ref:"Harpagon identifie son argent \xE0 sa propre personne. Perdre sa cassette, c'est litt\xE9ralement perdre la vie pour lui. Cet exc\xE8s est \xE0 la fois r\xE9v\xE9lateur de sa folie avare et comique pour le spectateur, qui voit le d\xE9calage entre la r\xE9alit\xE9 (un vol) et la r\xE9action (un meurtre). C'est le ressort m\xEAme de la com\xE9die de caract\xE8re : l'obsession pousse le personnage au ridicule."},{type:"qcm",q:"Si vous deviez jouer cette sc\xE8ne, quel serait le principal d\xE9fi physique ?",o:["Rester immobile","G\xE9rer l'essoufflement et l'agitation croissante","Chuchoter tout le texte","Tourner le dos au public"],a:1,expl:"Le d\xE9fi majeur est de traduire physiquement la panique croissante : course sur sc\xE8ne, regards dans toutes les directions, essoufflement progressif. Le corps doit \xEAtre aussi agit\xE9 que les mots. Mais attention \xE0 ne pas tomber dans la caricature \u2014 c'est un vrai d\xE9sespoir pour Harpagon."}]},{id:"sa2",tier:"debutant",title:"La sc\xE8ne du balcon",source:"Shakespeare (trad.) \u2014 Rom\xE9o et Juliette, Acte II, sc\xE8ne 2",context:"Rom\xE9o, un jeune Montaigu, s'est gliss\xE9 dans le jardin des Capulet apr\xE8s un bal. Il aper\xE7oit Juliette \xE0 sa fen\xEAtre et, cach\xE9 dans l'ombre, lui d\xE9clare son amour sans qu'elle le sache. C'est la sc\xE8ne d'amour la plus c\xE9l\xE8bre du th\xE9\xE2tre occidental.",extract:"Mais doucement ! quelle lumi\xE8re jaillit par cette fen\xEAtre ? Voil\xE0 l'Orient, et Juliette est le soleil ! L\xE8ve-toi, bel astre, et tue la lune jalouse, qui est d\xE9j\xE0 malade et p\xE2le de douleur parce que toi, sa servante, tu es bien plus belle qu'elle.",questions:[{type:"qcm",q:"\xC0 qui Rom\xE9o s'adresse-t-il dans cette r\xE9plique ?",o:["\xC0 Juliette directement","\xC0 lui-m\xEAme (monologue)","\xC0 son ami Mercutio","Au public"],a:1,expl:"Rom\xE9o se parle \xE0 lui-m\xEAme en observant Juliette \xE0 sa fen\xEAtre. C'est un apart\xE9 : Juliette ne l'entend pas encore. Cela cr\xE9e une intimit\xE9 avec le public qui d\xE9couvre les sentiments de Rom\xE9o avant que Juliette ne les connaisse."},{type:"qcm",q:"Juliette est compar\xE9e \xE0 quel \xE9l\xE9ment ?",o:["La lune","Le soleil","Une \xE9toile filante","Une fleur"],a:1,expl:"Rom\xE9o compare Juliette au soleil \u2014 un astre si lumineux qu'il \xE9clipse la lune. Cette m\xE9taphore cosmique \xE9l\xE8ve l'amour au rang de force de la nature, un th\xE8me central chez Shakespeare."},{type:"libre",q:"Comment un com\xE9dien pourrait-il utiliser sa voix et son corps pour montrer que Rom\xE9o est \xE9merveill\xE9 dans cette sc\xE8ne ?",ref:"Le com\xE9dien peut jouer sur le ralentissement du d\xE9bit \xE0 'Mais doucement !' (moment de surprise), puis une mont\xE9e progressive d'intensit\xE9 et de chaleur dans la voix. Physiquement, un mouvement vers l'avant, comme attir\xE9 malgr\xE9 lui. Le regard reste fix\xE9 vers le haut (la fen\xEAtre). Les mains peuvent s'ouvrir inconsciemment, geste d'offrande et de vuln\xE9rabilit\xE9. L'essentiel est de montrer que Rom\xE9o est submerg\xE9 par ce qu'il voit."}]},{id:"sa3",tier:"debutant",title:"Le Bourgeois gentilhomme",source:"Moli\xE8re \u2014 Le Bourgeois gentilhomme, Acte II, sc\xE8ne 4",context:"Monsieur Jourdain, un riche bourgeois, veut apprendre les mani\xE8res de la noblesse. Il prend des le\xE7ons de philosophie et d\xE9couvre, stup\xE9fait, qu'il parle en prose depuis toujours. C'est un dialogue entre Jourdain et son Ma\xEEtre de philosophie.",extract:"Par ma foi ! il y a plus de quarante ans que je dis de la prose sans que j'en susse rien, et je vous suis le plus oblig\xE9 du monde de m'avoir appris cela.",questions:[{type:"qcm",q:"Pourquoi cette r\xE9plique est-elle comique ?",o:["Monsieur Jourdain fait une blague volontaire","Il d\xE9couvre une \xE9vidence comme si c'\xE9tait extraordinaire","Il insulte son professeur","Il parle en vers"],a:1,expl:"Le comique vient du d\xE9calage entre l'\xE9vidence (tout le monde parle en prose) et l'\xE9merveillement de Monsieur Jourdain. C'est le principe du personnage comique de Moli\xE8re : quelqu'un qui ne voit pas ce que tout le monde voit, ici un bourgeois qui veut s'\xE9lever socialement sans en avoir les codes."},{type:"libre",q:"Monsieur Jourdain veut devenir un homme cultiv\xE9. En quoi cette r\xE9plique montre-t-elle l'\xE9chec de cette ambition ?",ref:"Paradoxalement, en s'\xE9merveillant d'apprendre qu'il parle en prose, Jourdain montre l'\xE9tendue de son ignorance. Un vrai homme cultiv\xE9 saurait ce qu'est la prose. Sa gratitude excessive ('le plus oblig\xE9 du monde') r\xE9v\xE8le qu'il confond accumulation de connaissances superficielles et vraie culture. Moli\xE8re montre que l'\xE9ducation ne s'ach\xE8te pas \u2014 elle se construit sur une conscience critique que Jourdain n'a pas."}]},{id:"sa4",tier:"intermediaire",title:"La strat\xE9gie de Iago",source:"Shakespeare (trad.) \u2014 Othello, Acte III, sc\xE8ne 3",context:"Iago, officier jaloux, manipule le g\xE9n\xE9ral Othello pour le rendre fou de jalousie envers sa femme Desd\xE9mone. Dans cette sc\xE8ne, Iago feint de mettre en garde Othello tout en empoisonnant son esprit. C'est un dialogue entre les deux hommes.",extract:"\xD4, prenez garde, monseigneur, \xE0 la jalousie ! C'est le monstre aux yeux verts qui produit l'aliment dont il se nourrit. Il vit heureux, le cocu qui, certain de son sort, n'aime plus celle qui le trompe ; mais que de minutes damn\xE9es compte celui qui adore et qui doute, qui soup\xE7onne et qui aime \xE9perdument !",questions:[{type:"qcm",q:"Quelle est la v\xE9ritable intention de Iago quand il met en garde Othello contre la jalousie ?",o:["Il veut sinc\xE8rement prot\xE9ger Othello","Il plante la graine de la jalousie en pr\xE9tendant la combattre","Il ne sait pas ce qu'il fait","Il essaie de s'excuser"],a:1,expl:"C'est la quintessence de la manipulation : en pr\xE9tendant avertir Othello contre la jalousie, Iago l'y pousse. Le sous-texte est l'inverse du texte. Iago fait na\xEEtre l'id\xE9e m\xEAme qu'il pr\xE9tend combattre. C'est ce qu'on appelle 'semer le doute' \u2014 et c'est une le\xE7on majeure pour tout com\xE9dien sur la diff\xE9rence entre ce qu'un personnage DIT et ce qu'il FAIT."},{type:"qcm",q:"Quel rapport de force est en jeu dans cette sc\xE8ne ?",o:["Iago est soumis \xE0 Othello","Othello domine compl\xE8tement","Iago contr\xF4le la sc\xE8ne malgr\xE9 son statut inf\xE9rieur","Ils sont \xE9gaux"],a:2,expl:"Malgr\xE9 sa position sociale inf\xE9rieure (il est l'enseigne d'Othello), Iago est le vrai ma\xEEtre de cette sc\xE8ne. Il contr\xF4le l'information, le rythme de la r\xE9v\xE9lation, et les \xE9motions d'Othello. C'est un exemple parfait de rapport de force invers\xE9 : le pouvoir n'est pas o\xF9 l'on croit."},{type:"libre",q:"Comment joueriez-vous le sous-texte de Iago ? O\xF9 mettriez-vous des pauses, des regards, des changements de ton ?",ref:"Le pi\xE8ge serait de jouer Iago comme un m\xE9chant \xE9vident. Le sous-texte fonctionne mieux si Iago semble sinc\xE8rement pr\xE9occup\xE9. Des pauses avant 'jalousie' et 'monstre aux yeux verts' \u2014 comme s'il h\xE9sitait \xE0 en parler. Un regard vers Othello pour jauger l'effet de chaque mot. Un ton de confidence entre amis, presque tendre. C'est en jouant la bienveillance que la manipulation devient terrifiante. Les meilleurs Iago au th\xE9\xE2tre sont ceux qui font oublier au public lui-m\xEAme qu'ils mentent."},{type:"argument",q:"Certains metteurs en sc\xE8ne jouent Iago comme un homme bless\xE9 et humili\xE9 plut\xF4t que comme un pur manipulateur. \xCAtes-vous d'accord avec cette lecture ?",positions:[{pour:"Iago se sent trahi par Othello qui lui a pr\xE9f\xE9r\xE9 Cassio pour le poste de lieutenant. Sa manipulation na\xEEt d'une blessure d'orgueil l\xE9gitime. Le jouer comme un homme souffrant ajoute de la complexit\xE9 et \xE9vite le clich\xE9 du 'm\xE9chant pour le plaisir de l'\xEAtre'."},{contre:"Le texte montre un Iago qui prend plaisir \xE0 manipuler, qui calcule froidement chaque \xE9tape. Trop humaniser sa motivation risque d'affaiblir la puissance dramatique de la pi\xE8ce et de minimiser la responsabilit\xE9 du personnage dans la trag\xE9die."},{synthese:"Les deux lectures peuvent coexister : Iago peut \xEAtre \xE0 la fois bless\xE9 ET jouir de sa manipulation. C'est cette ambigu\xEFt\xE9 qui fait la richesse du r\xF4le \u2014 et qui laisse chaque com\xE9dien apporter sa propre v\xE9rit\xE9 au personnage."}]}]},{id:"sa5",tier:"intermediaire",title:"Ph\xE8dre avoue son amour",source:"Racine \u2014 Ph\xE8dre, Acte II, sc\xE8ne 5",context:"Ph\xE8dre, reine d'Ath\xE8nes, est consum\xE9e par un amour interdit pour Hippolyte, le fils de son mari Th\xE9s\xE9e. Le croyant mort, elle avoue sa passion \xE0 Hippolyte en feignant de parler de Th\xE9s\xE9e jeune. C'est un dialogue entre Ph\xE8dre et Hippolyte.",extract:"Oui, Prince, je languis, je br\xFBle pour Th\xE9s\xE9e. Je l'aime, non point tel que l'ont vu les enfers, volage adorateur de mille objets divers, qui va du dieu des morts d\xE9shonorer la couche ; mais fid\xE8le, mais fier, et m\xEAme un peu farouche, charmant, jeune, tra\xEEnant tous les c\u0153urs apr\xE8s soi, tel qu'on d\xE9peint nos dieux, ou tel que je vous voi.",questions:[{type:"qcm",q:"Qui Ph\xE8dre d\xE9crit-elle r\xE9ellement quand elle dit aimer 'Th\xE9s\xE9e' ?",o:["Son mari Th\xE9s\xE9e tel qu'il est","Son mari Th\xE9s\xE9e quand il \xE9tait jeune","Son beau-fils Hippolyte","Un dieu de l'Olympe"],a:2,expl:"C'est le tour de force de cette tirade : Ph\xE8dre pr\xE9tend parler de Th\xE9s\xE9e mais le portrait qu'elle trace ('fid\xE8le, fier, un peu farouche, charmant, jeune') est celui d'Hippolyte, son beau-fils. Le dernier h\xE9mistiche ('tel que je vous voi') l\xE8ve le voile \u2014 elle parle de l'homme en face d'elle. Le sous-texte d\xE9vore le texte."},{type:"qcm",q:"Quel est le registre de cette tirade ?",o:["Comique","Lyrique et passionnel","\xC9pique","Satirique"],a:1,expl:"Le registre est lyrique et passionnel : 'je languis, je br\xFBle' exprime un amour d\xE9vorant. Racine utilise l'alexandrin pour donner une musicalit\xE9 quasi incant\xE9toire \xE0 cet aveu interdit. Le rythme et les sonorit\xE9s portent l'\xE9motion autant que le sens."},{type:"libre",q:"Ph\xE8dre utilise le nom de Th\xE9s\xE9e comme un masque pour parler d'Hippolyte. \xC0 quel moment, selon vous, Hippolyte comprend-il la v\xE9rit\xE9 ? Comment montrer ce basculement en mise en sc\xE8ne ?",ref:"Le basculement se joue sur 'tel que je vous voi' \u2014 le passage du 'il' (Th\xE9s\xE9e absent) au 'vous' (Hippolyte pr\xE9sent). En mise en sc\xE8ne, on peut marquer un temps de suspension juste avant ces mots. Hippolyte peut reculer, son corps se raidir. Ph\xE8dre peut avancer d'un pas, incapable de retenir la v\xE9rit\xE9 plus longtemps. Le silence qui suit ces mots est aussi important que les mots eux-m\xEAmes. Certaines mises en sc\xE8ne font durer ce silence tr\xE8s longtemps pour laisser l'horreur s'installer."},{type:"argument",q:"Ph\xE8dre est-elle coupable ou victime dans cette sc\xE8ne ?",positions:[{pour:"Ph\xE8dre est victime \u2014 elle subit une passion envoy\xE9e par les dieux (V\xE9nus). Elle lutte contre cet amour interdit, elle souffre, elle a m\xEAme voulu mourir. Son aveu est un \xE9chec de sa volont\xE9, pas un choix libre."},{contre:"Ph\xE8dre fait le choix de parler. Personne ne l'oblige \xE0 avouer. En utilisant le stratag\xE8me du portrait de Th\xE9s\xE9e, elle montre une forme de calcul qui nuance l'image de victime passive."},{synthese:"Racine construit pr\xE9cis\xE9ment cette ambigu\xEFt\xE9 : Ph\xE8dre est \xE0 la fois victime de la fatalit\xE9 et agent de sa propre chute. C'est cette tension qui rend le r\xF4le si fascinant \xE0 jouer \u2014 la com\xE9dienne doit habiter les deux dimensions simultan\xE9ment."}]}]},{id:"sa6",tier:"intermediaire",title:"Le quiproquo ma\xEEtre-valet",source:"Marivaux \u2014 Le Jeu de l'amour et du hasard, Acte I, sc\xE8ne 6",context:"Silvia et Dorante, promis en mariage, ont chacun \xE9chang\xE9 de r\xF4le avec leur serviteur pour observer l'autre incognito. Sans le savoir, ils tombent amoureux l'un de l'autre sous leurs d\xE9guisements. C'est un dialogue entre les deux, chacun croyant parler \xE0 un domestique.",extract:"SILVIA (d\xE9guis\xE9e en servante) : C'est que j'ai devin\xE9 que tu pouvais bien n'\xEAtre pas ce que tu parais. DORANTE (d\xE9guis\xE9 en valet) : Et moi, j'aurais bien voulu que la ma\xEEtresse te ressembl\xE2t. SILVIA : Que voulez-vous dire par l\xE0 ? DORANTE : Que j'aurais eu le plaisir de la servir autant qu'il m'en co\xFBte de te voir.",questions:[{type:"qcm",q:"Qu'est-ce qui rend cette sc\xE8ne dramaturgiquement riche ?",o:["Les personnages se disent la v\xE9rit\xE9 sans le savoir","Les personnages mentent compl\xE8tement","Il n'y a aucun sous-texte","C'est une sc\xE8ne d'exposition classique"],a:0,expl:"Le g\xE9nie de Marivaux est que les deux personnages, chacun d\xE9guis\xE9, disent exactement la v\xE9rit\xE9 de leurs sentiments tout en croyant mentir. Le double d\xE9guisement cr\xE9e un jeu de miroirs : chacun est attir\xE9 par l'autre 'malgr\xE9' la condition sociale suppos\xE9e. Le public, qui sait tout, savoure ce quiproquo."},{type:"libre",q:"Comment le com\xE9dien jouant Dorante peut-il montrer qu'il est troubl\xE9 de tomber amoureux d'une 'simple servante' ? Quels signes physiques trahiraient son conflit int\xE9rieur ?",ref:"Dorante peut h\xE9siter dans ses gestes \u2014 tendre la main puis la retirer. Son regard peut alterner entre l'attirance (yeux riv\xE9s sur Silvia) et la g\xEAne sociale (d\xE9tourner le regard). Il peut corriger sa posture, se reprendre quand il se montre trop tendre. Le conflit entre le c\u0153ur et le code social passe par des micro-gestes : un sourire qu'on r\xE9prime, un pas en avant suivi d'un recul. La voix peut osciller entre la chaleur et la retenue formelle."}]},{id:"sa7",tier:"avance",title:"Lucky et le discours absurde",source:"Beckett \u2014 En attendant Godot, Acte I",context:"Lucky est un esclave tenu en laisse par Pozzo. Quand on lui ordonne de 'penser', il se lance dans un monologue-fleuve incoh\xE9rent qui m\xEAle philosophie, th\xE9ologie et absurdit\xE9. Vladimir et Estragon, qui attendent Godot, assistent \xE0 la sc\xE8ne.",extract:"\xC9tant donn\xE9 l'existence telle qu'elle jaillit des r\xE9cents travaux publics de Poin\xE7on et Wattmann d'un Dieu personnel quaquaquaqua \xE0 barbe blanche quaqua hors du temps de l'\xE9tendue qui du haut de sa divine apathie sa divine athambie sa divine aphasie nous aime bien",questions:[{type:"qcm",q:"Pourquoi le discours de Lucky semble-t-il incoh\xE9rent ?",o:["L'acteur a oubli\xE9 son texte","Beckett illustre la d\xE9sint\xE9gration du langage et de la pens\xE9e","C'est une erreur d'impression","Lucky parle une langue \xE9trang\xE8re"],a:1,expl:"Le discours de Lucky est une d\xE9construction volontaire du langage. Derri\xE8re le chaos apparent, on trouve des fragments de pens\xE9e philosophique et th\xE9ologique qui se dissolvent. Beckett montre un \xEAtre dont la pens\xE9e se d\xE9compose \u2014 m\xE9taphore de la condition humaine dans le th\xE9\xE2tre de l'absurde. Le sens \xE9merge pr\xE9cis\xE9ment de l'absence de sens."},{type:"libre",q:"Comment un com\xE9dien peut-il donner du sens \xE0 un texte qui semble n'en avoir aucun ? Quelles techniques utiliseriez-vous pour rendre ce monologue jouable ?",ref:"Le com\xE9dien peut s'appuyer sur le rythme (acc\xE9l\xE9rations et ralentissements), les respirations (o\xF9 Lucky reprend son souffle dit quelque chose sur sa d\xE9tresse), les fragments reconnaissables ('Dieu', 'nous aime') trait\xE9s comme des \xEElots de clart\xE9 dans le chaos. Physiquement, la tension du corps qui essaie d\xE9sesp\xE9r\xE9ment de communiquer est essentielle. Certains com\xE9diens choisissent de jouer la lucidit\xE9 derri\xE8re la folie apparente \u2014 Lucky SAIT ce qu'il veut dire mais ne PEUT plus le dire. D'autres jouent l'urgence absolue : c'est peut-\xEAtre sa derni\xE8re chance de parler."},{type:"argument",q:"Le th\xE9\xE2tre de l'absurde est-il pessimiste ou, paradoxalement, porteur d'espoir ?",positions:[{pour:"En montrant l'absurdit\xE9 de l'existence, Beckett lib\xE8re le spectateur du besoin de trouver un sens impos\xE9. C'est un acte de lucidit\xE9 qui peut \xEAtre lib\xE9rateur. Et le simple fait que Vladimir et Estragon CONTINUENT d'attendre est un acte de r\xE9sistance."},{contre:"L'univers de Beckett est un univers de d\xE9gradation : le corps se d\xE9compose, le langage se d\xE9sint\xE8gre, Dieu est silencieux. Il n'y a pas d'issue, pas de progression, pas de r\xE9demption. Le spectateur sort vid\xE9, pas lib\xE9r\xE9."},{synthese:"Beckett lui-m\xEAme refusait d'expliquer ses pi\xE8ces. L'absurde n'est ni optimiste ni pessimiste : il constate. C'est au spectateur (et au com\xE9dien) de d\xE9cider ce qu'il en fait. Cette libert\xE9 d'interpr\xE9tation EST peut-\xEAtre l'espoir que contient l'absurde."}]}]},{id:"sa8",tier:"avance",title:"Le monologue de M\xE9d\xE9e",source:"Corneille \u2014 M\xE9d\xE9e, Acte I, sc\xE8ne 5",context:"M\xE9d\xE9e, magicienne trahie par Jason qui l'abandonne pour une princesse, fait le bilan de sa situation. Exil\xE9e, seule, elle cherche en elle-m\xEAme la force de se venger. C'est un monologue fondateur du th\xE9\xE2tre tragique fran\xE7ais.",extract:"Souverains protecteurs des lois de l'hym\xE9n\xE9e, Dieux, garants de la foi que Jason m'a donn\xE9e, Vous qu'il prit \xE0 t\xE9moin d'une immortelle ardeur Quand par un faux serment il vainquit ma pudeur, Voyez de quel m\xE9pris vous traite son parjure, Et m'aidez \xE0 venger cette commune injure.",questions:[{type:"qcm",q:"\xC0 qui M\xE9d\xE9e s'adresse-t-elle et dans quel but ?",o:["Au public pour le divertir","Aux dieux pour les prendre \xE0 t\xE9moin et demander vengeance","\xC0 Jason pour lui pardonner","\xC0 sa servante pour se plaindre"],a:1,expl:"M\xE9d\xE9e invoque les dieux comme t\xE9moins et complices de sa vengeance. Elle retourne leur autorit\xE9 contre Jason : puisqu'il a jur\xE9 devant eux et trahi, les dieux sont eux aussi offens\xE9s. C'est une rh\xE9torique redoutable \u2014 elle transforme sa cause personnelle en cause divine."},{type:"libre",q:"M\xE9d\xE9e passe du statut de victime \xE0 celui de justici\xE8re divine en quelques vers. Quelles indications de jeu donneriez-vous \xE0 une com\xE9dienne pour marquer cette transformation ?",ref:"Le d\xE9but peut \xEAtre jou\xE9 dans la douleur et la supplication \u2014 une femme trahie qui implore. Mais \xE0 partir de 'Voyez de quel m\xE9pris', le ton change : la douleur se transforme en col\xE8re froide, puis en d\xE9termination absolue. La transformation passe par la verticalit\xE9 du corps (elle se redresse), le regard qui se durcit, la voix qui gagne en assurance. Sur 'venger cette commune injure', M\xE9d\xE9e n'est plus une victime \u2014 elle est une force. La com\xE9dienne doit montrer le moment exact o\xF9 la souffrance se cristallise en r\xE9solution."},{type:"argument",q:"M\xE9d\xE9e est-elle un personnage f\xE9ministe avant l'heure ou un monstre tragique ?",positions:[{pour:"M\xE9d\xE9e refuse d'accepter la trahison passivement. Dans un monde o\xF9 les femmes n'ont aucun recours l\xE9gal, elle reprend le pouvoir par la seule voie qui lui reste. Sa r\xE9bellion contre l'injustice de Jason peut se lire comme un acte de r\xE9sistance proto-f\xE9ministe."},{contre:"M\xE9d\xE9e tuera ses propres enfants. Quelle que soit la l\xE9gitimit\xE9 de sa col\xE8re, ses actes la placent au-del\xE0 de toute sympathie. Le personnage incarne la d\xE9mesure tragique, l'hybris, pas un mod\xE8le d'\xE9mancipation."},{synthese:"M\xE9d\xE9e est les deux : sa r\xE9volte est l\xE9gitime ET ses moyens sont monstrueux. C'est cette tension irr\xE9solue qui en fait un des plus grands r\xF4les du r\xE9pertoire. Chaque \xE9poque relit M\xE9d\xE9e \xE0 travers ses propres questionnements sur la justice, le pouvoir et le genre."}]}]},{id:"sa9",tier:"avance",title:"La le\xE7on de s\xE9duction",source:"Laclos / Hampton \u2014 Les Liaisons dangereuses (adapt. th\xE9\xE2trale)",context:"La Marquise de Merteuil et le Vicomte de Valmont, anciens amants devenus complices, se lancent des d\xE9fis de s\xE9duction par jeu et par cruaut\xE9. Dans cette sc\xE8ne, Merteuil enseigne \xE0 Valmont l'art de la manipulation sentimentale.",extract:"VALMONT : L'amour est un combat. Les armes ne sont pas les m\xEAmes mais on peut y mourir tout autant. MERTEUIL : On ne meurt pas d'amour, Valmont. On meurt de ne pas savoir quand il faut cesser d'aimer.",questions:[{type:"qcm",q:"Quel est le rapport de force entre Valmont et Merteuil dans cet \xE9change ?",o:["Valmont domine","Merteuil domine","Ils sont \xE9gaux","Il n'y a pas de rapport de force"],a:1,expl:"Merteuil corrige Valmont, renverse sa m\xE9taphore et montre une lucidit\xE9 sup\xE9rieure. En une r\xE9plique, elle affirme son intelligence strat\xE9gique face au romantisme de Valmont. C'est un duel verbal qu'elle remporte. Le rapport de force est intellectuel, pas social."},{type:"libre",q:"Proposez une direction de jeu pour chaque personnage. Quel sous-texte donneriez-vous \xE0 chacun ?",ref:`Valmont : sous-texte possible = il teste Merteuil, il veut voir si elle est encore vuln\xE9rable \xE0 l'amour. Sa r\xE9plique sur le combat est \xE0 moiti\xE9 sinc\xE8re \u2014 il commence peut-\xEAtre \xE0 sentir quelque chose pour Tourvel. Direction : charme teint\xE9 d'incertitude.
Merteuil : sous-texte = elle per\xE7oit la faille de Valmont et la referme imm\xE9diatement. Sa r\xE9plique est un avertissement autant qu'une d\xE9monstration de sup\xE9riorit\xE9. Direction : contr\xF4le absolu, sourire qui ne monte pas jusqu'aux yeux. Entre eux, le silence apr\xE8s sa r\xE9plique est un champ de bataille.`},{type:"argument",q:"Le th\xE9\xE2tre contemporain devrait-il continuer \xE0 monter les classiques ou se concentrer sur la cr\xE9ation contemporaine ?",positions:[{pour:"Les classiques parlent de th\xE8mes universels (pouvoir, amour, mort) qui r\xE9sonnent toujours. Ils forment le socle culturel commun et permettent des relectures infinies \xE0 travers les \xE9poques."},{contre:"Trop de classiques \xE9touffe la cr\xE9ation vivante. Le th\xE9\xE2tre doit refl\xE9ter le monde d'aujourd'hui, avec ses langues, ses corps, ses questionnements propres. Les classiques peuvent devenir des monuments fig\xE9s si on ne renouvelle pas le r\xE9pertoire."},{synthese:"L'opposition est fausse : un classique bien mont\xE9 EST du th\xE9\xE2tre contemporain. La mise en sc\xE8ne, le jeu, l'adresse au public d'aujourd'hui transforment le texte. Et le th\xE9\xE2tre a besoin des deux : la m\xE9moire des classiques et l'audace de la cr\xE9ation."}]}]},{id:"sa10",tier:"debutant",title:"Cyrano et la tirade du nez",source:"Rostand \u2014 Cyrano de Bergerac, Acte I, sc\xE8ne 4",context:"Cyrano de Bergerac, po\xE8te et bretteur au nez immense, est provoqu\xE9 par le Vicomte de Valvert qui se moque de son nez. Au lieu de se vexer, Cyrano improvise une tirade brillante d\xE9clinant toutes les fa\xE7ons dont on aurait pu insulter son nez avec plus d'esprit.",extract:"CYRANO : Ah non ! C'est un peu court, jeune homme ! On pouvait dire... Oh ! Dieu !... bien des choses en somme... En variant le ton, \u2014 par exemple, tenez : Agressif : \xAB Moi, monsieur, si j'avais un tel nez, il faudrait sur-le-champ que je me l'amputasse ! \xBB",questions:[{type:"qcm",q:"Quel est l'objectif de Cyrano avec cette tirade ?",o:["Se moquer de son propre nez","Montrer sa sup\xE9riorit\xE9 intellectuelle","Humilier le vicomte","Faire rire le public"],a:1,expl:"Cyrano retourne l'insulte en d\xE9monstration de virtuosit\xE9. En \xE9num\xE9rant lui-m\xEAme les moqueries possibles, il montre que l'attaque du vicomte \xE9tait pauvre et que lui-m\xEAme est plus intelligent, plus cr\xE9atif et plus courageux. C'est un acte de domination intellectuelle, pas d'auto-d\xE9rision."},{type:"libre",q:"Comment joueriez-vous cette tirade ? Quel rythme, quelle \xE9nergie ?",ref:"Le rythme est l'arme principale ici : commencer lentement (le m\xE9pris), puis acc\xE9l\xE9rer (la virtuosit\xE9), varier les tons (agressif, amical, descriptif...). L'\xE9nergie monte crescendo. Cyrano s'amuse et le public le sent. Il faut du panache \u2014 le mot n'est pas choisi au hasard. Le d\xE9fi : ne pas jouer 'dr\xF4le' mais jouer 'brillant'. Le rire vient de l'intelligence, pas du comique."}]},{id:"sa11",tier:"debutant",title:"Antigone face \xE0 Cr\xE9on",source:"Anouilh \u2014 Antigone",context:"Antigone a brav\xE9 l'interdit du roi Cr\xE9on en enterrant son fr\xE8re Polynice. Cr\xE9on tente de la raisonner et de la sauver, mais Antigone refuse tout compromis. C'est l'affrontement entre la loi humaine (Cr\xE9on) et la loi morale (Antigone).",extract:"ANTIGONE : Je ne veux pas comprendre. C'est bon pour vous. Moi je suis l\xE0 pour autre chose que pour comprendre. Je suis l\xE0 pour vous dire non et pour mourir. CR\xC9ON : C'est facile de dire non.",questions:[{type:"qcm",q:"Que repr\xE9sente le conflit entre Antigone et Cr\xE9on ?",o:["Un conflit familial","L'id\xE9alisme contre le pragmatisme","La jeunesse contre la vieillesse","La d\xE9sob\xE9issance civile"],a:1,expl:"Antigone incarne l'id\xE9al absolu : elle refuse tout compromis, m\xEAme au prix de sa vie. Cr\xE9on incarne le pragmatisme du pouvoir : il comprend que gouverner demande des concessions. Le conflit est philosophique avant d'\xEAtre dramatique."},{type:"libre",q:"Antigone dit 'je suis l\xE0 pour dire non'. Quel est le sous-texte ? Que ne dit-elle pas ?",ref:"Sous-texte possible : 'je pr\xE9f\xE8re mourir pure que vivre compromise'. Elle ne parle pas de son fr\xE8re ici \u2014 elle parle d'elle-m\xEAme, de son besoin d'absolu. Le 'non' n'est pas politique, il est existentiel. C'est son identit\xE9. Direction : une calme certitude, pas de la r\xE9bellion criarde."}]},{id:"sa12",tier:"debutant",title:"L'aveu de l'Avare",source:"Moli\xE8re \u2014 L'Avare, Acte IV, sc\xE8ne 7",context:"Suite de la sc\xE8ne d'Harpagon. Apr\xE8s sa panique du vol, un quiproquo s'installe avec Val\xE8re, qui croit parler d'\xC9lise (la fille d'Harpagon qu'il aime) alors qu'Harpagon parle de sa cassette vol\xE9e. Chacun croit que l'autre parle de la m\xEAme chose.",extract:"HARPAGON : Au voleur ! au voleur ! \xE0 l'assassin ! au meurtrier ! Justice, juste Ciel ! je suis perdu, je suis assassin\xE9, on m'a coup\xE9 la gorge, on m'a d\xE9rob\xE9 mon argent.",questions:[{type:"qcm",q:"Pourquoi ce monologue est-il \xE0 la fois comique et tragique ?",o:["Parce qu'Harpagon exag\xE8re","Parce qu'il compare la perte d'argent \xE0 la mort","Parce qu'il est seul en sc\xE8ne","Parce que le public conna\xEEt le voleur"],a:1,expl:"Harpagon vit la perte de son argent comme un meurtre \u2014 'on m'a coup\xE9 la gorge'. L'exc\xE8s est comique mais la souffrance est r\xE9elle pour lui. Moli\xE8re montre que l'avarice est une maladie qui d\xE9forme la r\xE9alit\xE9. Le rire na\xEEt du d\xE9calage entre ce qui est perdu (de l'argent) et ce qui est ressenti (la mort)."},{type:"libre",q:"Comment doseriez-vous le comique et le path\xE9tique dans cette sc\xE8ne ?",ref:"Le pi\xE8ge serait de jouer 'clown'. Harpagon est sinc\xE8rement d\xE9sesp\xE9r\xE9 \u2014 c'est de cette sinc\xE9rit\xE9 que na\xEEt le comique. Il faut jouer la douleur VRAIE d'un homme qui perd ce qu'il aime le plus au monde. Le public rit PARCE QUE c'est path\xE9tique. Si l'acteur joue dr\xF4le, il tue le comique."}]},{id:"sa13",tier:"intermediaire",title:"Le monologue d'Hamlet",source:"Shakespeare (trad.) \u2014 Hamlet, Acte III, sc\xE8ne 1",context:"Le prince Hamlet, rong\xE9 par le doute, h\xE9site entre agir pour venger son p\xE8re assassin\xE9 par son oncle Claudius, ou renoncer face \xE0 l'absurdit\xE9 de l'existence. C'est le plus c\xE9l\xE8bre monologue du th\xE9\xE2tre : '\xCAtre ou ne pas \xEAtre'.",extract:"HAMLET : \xCAtre ou ne pas \xEAtre, telle est la question. Est-il plus noble pour l'\xE2me de souffrir les traits de la fortune outrageuse, ou de prendre les armes contre une mer de tourments et d'y mettre fin par la r\xE9volte ?",questions:[{type:"qcm",q:"De quoi parle r\xE9ellement Hamlet dans ce monologue ?",o:["De philosophie","Du suicide","De la vengeance","De son p\xE8re"],a:1,expl:"Hamlet envisage le suicide comme solution \xE0 sa souffrance. '\xCAtre ou ne pas \xEAtre' = vivre ou mourir. Les 'traits de la fortune' sont ses malheurs. 'Prendre les armes' est paradoxal car les armes sont tourn\xE9es contre soi. C'est un monologue int\xE9rieur sur le courage qu'il faut pour vivre face \xE0 l'injustice."},{type:"libre",q:"Analysez le rythme de ce passage. O\xF9 sont les h\xE9sitations, les certitudes ?",ref:"'\xCAtre ou ne pas \xEAtre' \u2014 suspension, h\xE9sitation. 'Telle est la question' \u2014 certitude temporaire, il pose le cadre. Puis il explore deux options, chacune commen\xE7ant par un infinitif (souffrir / prendre les armes). Le rythme acc\xE9l\xE8re avec 'une mer de tourments'. L'acteur doit sentir la pens\xE9e se former en temps r\xE9el \u2014 pas r\xE9citer un texte connu."}]},{id:"sa14",tier:"intermediaire",title:"Tartuffe d\xE9masqu\xE9",source:"Moli\xE8re \u2014 Tartuffe, Acte IV, sc\xE8ne 5",context:"Tartuffe, un faux d\xE9vot qui s'est install\xE9 chez Orgon en feignant la pi\xE9t\xE9, tente de s\xE9duire Elmire, la femme d'Orgon. Ce dernier, cach\xE9 sous la table, assiste enfin \xE0 l'hypocrisie de celui qu'il admirait aveugl\xE9ment.",extract:"ORGON (sortant de dessous la table) : Voil\xE0, je vous l'avoue, un abominable homme ! ELMIRE : Quoi ? vous sortez si t\xF4t ? Vous vous moquez des gens. Rentrez sous le tapis, il n'est pas encore temps.",questions:[{type:"qcm",q:"Quel proc\xE9d\xE9 dramatique Moli\xE8re utilise-t-il dans cette sc\xE8ne ?",o:["Le quiproquo","Le th\xE9\xE2tre dans le th\xE9\xE2tre","La mise en abyme","L'apart\xE9"],a:1,expl:"Elmire joue une sc\xE8ne devant Orgon cach\xE9 : c'est du th\xE9\xE2tre dans le th\xE9\xE2tre. Elle EST com\xE9dienne dans la sc\xE8ne. Orgon est spectateur. Le vrai public regarde un spectateur qui regarde une actrice. Le proc\xE9d\xE9 est m\xE9ta-th\xE9\xE2tral et pose la question : Elmire joue-t-elle, ou dit-elle aussi une part de v\xE9rit\xE9 ?"},{type:"libre",q:"Comment Elmire navigue-t-elle entre le jeu (pour pi\xE9ger Tartuffe) et ses propres \xE9motions ?",ref:"Elmire doit s\xE9duire Tartuffe tout en contr\xF4lant la situation \u2014 mais jusqu'o\xF9 ? Sa remarque \xE0 Orgon ('Vous sortez si t\xF4t') montre de l'agacement : elle a d\xFB aller plus loin qu'elle ne le souhaitait. Direction : un personnage qui joue un r\xF4le mais dont le masque craque par moments. Le d\xE9go\xFBt physique transpara\xEEt sous la s\xE9duction."}]},{id:"sa15",tier:"intermediaire",title:"Ruy Blas et la reine",source:"Hugo \u2014 Ruy Blas, Acte III, sc\xE8ne 4",context:"Ruy Blas, un simple laquais, a \xE9t\xE9 d\xE9guis\xE9 en grand d'Espagne par Don Salluste pour s\xE9duire la reine. Mais Ruy Blas est sinc\xE8rement tomb\xE9 amoureux d'elle. Dans cette sc\xE8ne, il ose enfin lui d\xE9clarer sa passion.",extract:"RUY BLAS : Bon app\xE9tit, messieurs ! \xD4 ministres int\xE8gres ! Conseillers vertueux ! Voil\xE0 votre fa\xE7on de servir, serviteurs qui pillez la maison !",questions:[{type:"qcm",q:"Quelle est la force rh\xE9torique de cette tirade ?",o:["L'accumulation","L'ironie","L'hyperbole","Les trois \xE0 la fois"],a:3,expl:"Hugo combine ironie ('ministres int\xE8gres', 'conseillers vertueux' \u2014 ils sont le contraire), accumulation (les exemples se multiplient), et hyperbole (la grandeur du discours). C'est un texte politique autant que th\xE9\xE2tral, o\xF9 un valet ose dire la v\xE9rit\xE9 aux puissants. Le texte a la puissance d'un discours de tribune."},{type:"libre",q:"Comment un acteur peut-il porter cette tirade sans tomber dans la d\xE9clamation creuse ?",ref:"Le pi\xE8ge du texte hugolien : la grandiloquence. Solution : ancrer chaque mot dans une col\xE8re personnelle, pas dans le 'beau vers'. Ruy Blas parle parce qu'il souffre, pas parce qu'il a un beau texte. L'ironie doit \xEAtre mordante (il les regarde dans les yeux), pas th\xE9\xE2trale. La projection vocale sert la rage, pas l'alexandrin."}]},{id:"sa16",tier:"avance",title:"Fin de partie",source:"Beckett \u2014 Fin de partie",context:"Hamm, aveugle et paralys\xE9 dans son fauteuil, et Clov, son serviteur qui ne peut pas s'asseoir, sont enferm\xE9s dans un refuge apr\xE8s une catastrophe. Leurs \xE9changes absurdes et cruels explorent la fin du monde et la d\xE9pendance mutuelle.",extract:"HAMM : Fini, c'est fini, \xE7a va finir, \xE7a va peut-\xEAtre finir. Les grains s'ajoutent aux grains, un \xE0 un, et un jour, soudain, c'est un tas, un petit tas, l'impossible tas.",questions:[{type:"qcm",q:"Que repr\xE9sentent les 'grains' dans cette m\xE9taphore ?",o:["Le sable d'un sablier","Les moments de souffrance accumul\xE9s","Les grains de bl\xE9","Les souvenirs"],a:1,expl:"Beckett utilise le paradoxe du sorite (\xE0 quel moment des grains deviennent un tas ?). Les grains sont les instants qui passent, la souffrance quotidienne, l'attente. Le 'tas impossible' est la fin qui ne vient jamais tout en \xE9tant toujours imminente. C'est une m\xE9taphore existentielle de l'absurde : on attend la fin sans savoir si elle existe."},{type:"libre",q:"Comment jouer la r\xE9p\xE9tition chez Beckett sans ennuyer le spectateur ?",ref:"Chaque r\xE9p\xE9tition doit \xEAtre l\xE9g\xE8rement diff\xE9rente \u2014 en intensit\xE9, en rythme, en direction. 'Fini' (constat), 'c'est fini' (insistance), '\xE7a va finir' (espoir ?), '\xE7a va peut-\xEAtre finir' (doute). L'acteur beckettien joue les micro-variations. Le texte est musical : la partition exige une pr\xE9cision de m\xE9tronome. Le rythme EST le sens."},{type:"argument",q:"Le th\xE9\xE2tre de l'absurde a-t-il encore quelque chose \xE0 nous dire aujourd'hui ?",positions:[{pour:"L'absurde n'a jamais \xE9t\xE9 aussi pertinent : crise climatique, pand\xE9mies, algorithmes qui d\xE9cident de nos vies \u2014 le sentiment que le monde n'a pas de sens est universel. Beckett et Ionesco parlent directement \xE0 notre \xE9poque."},{contre:"L'absurde \xE9tait une r\xE9ponse \xE0 l'apr\xE8s-guerre. Notre \xE9poque a besoin de r\xE9cits engag\xE9s, politiques, qui proposent des solutions. Le nihilisme beckettien peut paralyser au lieu de mobiliser."},{synthese:"L'absurde n'est pas nihiliste \u2014 il est lucide. Reconna\xEEtre l'absurdit\xE9 du monde est le premier pas vers l'action. Beckett fait rire du tragique \u2014 et le rire est d\xE9j\xE0 une r\xE9sistance."}]}]},{id:"sa17",tier:"avance",title:"Le monologue de C\xE9lim\xE8ne",source:"Moli\xE8re \u2014 Le Misanthrope, Acte II, sc\xE8ne 4",context:"C\xE9lim\xE8ne, jeune veuve spirituelle et coquette, est au centre du salon. Elle dresse des portraits satiriques des habitu\xE9s de la cour, avec un esprit mordant qui fascine Alceste (le misanthrope amoureux d'elle) autant qu'il le r\xE9volte.",extract:"C\xC9LIM\xC8NE : Son m\xE9rite jamais n'est \xE9clair\xE9. Dans l'ombre il a toujours quelque chose d'obscur, et ne s'accommode qu'\xE0 demi du grand jour.",questions:[{type:"qcm",q:"Quel est le talent social de C\xE9lim\xE8ne dans cette sc\xE8ne ?",o:["La flatterie","Le portrait satirique","La diplomatie","L'hypocrisie"],a:1,expl:"C\xE9lim\xE8ne excelle dans l'art du portrait : elle dessine les d\xE9fauts de chacun avec esprit et pr\xE9cision. C'est une femme brillante dans un monde d'hommes, et sa seule arme est l'intelligence verbale. Le portrait satirique est son pouvoir \u2014 et sa faiblesse, car ces mots reviendront contre elle."},{type:"libre",q:"C\xE9lim\xE8ne est-elle cruelle ou simplement lucide ? D\xE9fendez votre interpr\xE9tation.",ref:"Les deux lectures coexistent. Cruelle : elle d\xE9truit les r\xE9putations pour le plaisir du salon. Lucide : elle voit les gens tels qu'ils sont et refuse l'hypocrisie g\xE9n\xE9rale. Direction possible : une femme qui rit pour ne pas pleurer, pi\xE9g\xE9e dans un monde qu'elle m\xE9prise mais dont elle d\xE9pend. Sa cruaut\xE9 est une forme de libert\xE9 dans une soci\xE9t\xE9 qui ne lui en offre aucune."}]},{id:"sa18",tier:"avance",title:"Kolt\xE8s \u2014 Dans la solitude des champs de coton",source:"Kolt\xE8s \u2014 Dans la solitude des champs de coton",context:"Deux inconnus se rencontrent dans un lieu ind\xE9termin\xE9, \xE0 une heure o\xF9 personne ne devrait \xEAtre dehors. L'un propose un 'deal', l'autre r\xE9siste. L'\xE9change est un affrontement verbal sur le d\xE9sir, le commerce et la violence. On ne sait jamais exactement ce qui se n\xE9gocie.",extract:"LE DEALER : Si vous marchez dehors, \xE0 cette heure et en ce lieu, c'est que vous d\xE9sirez quelque chose que vous n'avez pas, et cette chose, moi, je peux vous la fournir.",questions:[{type:"qcm",q:"Quel est le vrai sujet de cette pi\xE8ce ?",o:["Le trafic de drogue","Le d\xE9sir et le manque","La violence urbaine","Le commerce"],a:1,expl:"Kolt\xE8s ne parle jamais de drogue. Le 'deal' est m\xE9taphorique : deux \xEAtres se rencontrent dans la nuit, chacun a besoin de l'autre sans savoir pourquoi. C'est une pi\xE8ce sur le d\xE9sir, le manque, et l'impossibilit\xE9 de la rencontre. Le dialogue est un combat verbal o\xF9 chacun essaie de nommer le besoin de l'autre."},{type:"libre",q:"Comment la langue de Kolt\xE8s diff\xE8re-t-elle de la langue classique ? Quelles cons\xE9quences pour le jeu ?",ref:"Kolt\xE8s \xE9crit des phrases longues, sinueuses, qui s'enroulent sur elles-m\xEAmes. Pas de vers, pas de c\xE9sure \u2014 un flux continu comme un jazz. L'acteur ne peut pas 'poser' son texte comme du Racine. Il doit trouver le rythme int\xE9rieur de la pens\xE9e qui se construit en parlant. Le souffle est crucial : les phrases de Kolt\xE8s demandent une endurance respiratoire et une musicalit\xE9 qui vient du corps, pas de la m\xE9trique."}]},{id:"sa19",tier:"pro",title:"L'affrontement du dealer et du client",source:"Kolt\xE8s \u2014 Dans la solitude des champs de coton, ouverture",context:"Deux inconnus se rencontrent dans un lieu ind\xE9termin\xE9, la nuit. L'un est 'le Dealer' qui vend quelque chose, l'autre est 'le Client' qui d\xE9sire quelque chose. Leur dialogue est un duel verbal o\xF9 chacun teste l'autre, t\xE2tonne, se retient. On ne sait jamais pr\xE9cis\xE9ment ce qui se n\xE9gocie : un produit, un secret, une confiance ? La pi\xE8ce ouvre sur cet affrontement ambigu.",extract:"LE DEALER : Si vous marchez dehors, \xE0 cette heure et en ce lieu, c'est que vous d\xE9sirez quelque chose que vous n'avez pas, et cette chose, moi, je peux vous la fournir. LE CLIENT : Comment pouvez-vous savoir ce que je d\xE9sire, vous qui ne me connaissez pas ? LE DEALER : Parce que je suis celui qui fournit ce que tous d\xE9sirent.",questions:[{type:"qcm",q:"Quelle est la structure de puissance implicite entre le Dealer et le Client \xE0 l'ouverture ?",o:["Le Client domine","Le Dealer domine par l'info et la certitude","Ils sont \xE9gaux","Aucun ne sait rien"],a:1,expl:"Le Dealer poss\xE8de l'information (il sait ce que le Client d\xE9sire avant que le Client lui-m\xEAme le sache). Cette asym\xE9trie cr\xE9e un rapport de force. Le Dealer joue sur l'incertitude du Client. Kolt\xE8s explore comment le pouvoir na\xEEt de la connaissance du d\xE9sir d'autrui."},{type:"qcm",q:"Quel est le r\xF4le du lieu 'ind\xE9termin\xE9' dans cette sc\xE8ne ?",o:["C'est un d\xE9cor r\xE9aliste","Le lieu symbolise l'absence de cadre social, la 'solitude'","C'est une for\xEAt","C'est un appartement"],a:1,expl:"'Dans la solitude des champs de coton' \u2014 le titre sugg\xE8re un non-lieu, l'absence de protection sociale. C'est un espace de rencontre brute, sans institutions. Cela force les deux personnages \xE0 n\xE9gocier sans filet : juste deux \xEAtres face \xE0 face. Le lieu abstrait amplifie l'intimit\xE9 du combat."},{type:"libre",q:"En tant que metteur en sc\xE8ne, comment utiliseriez-vous l'espace sc\xE9nique pour montrer le jeu du Dealer et du Client ? Pensez aux distances, aux regards, \xE0 la mobilit\xE9.",ref:"Possibilit\xE9s : le Dealer peut rester immobile tandis que le Client tourne autour de lui (le Client est attir\xE9 et repouss\xE9). Ou inversement. Les regards peuvent se croiser puis se d\xE9rober. Le Dealer peut avancer lentement vers le Client qui recule \u2014 jeu de pr\xE9dation. Le texte n'indique aucune action, donc c'est \xE0 la mise en sc\xE8ne de cr\xE9er la tension corporelle. Le silence entre les r\xE9pliques devient crucial \u2014 c'est l\xE0 que se joue le vrai rapport de force. Certaines mises en sc\xE8ne jouent l'\xE9rotisme latent de cette rencontre."},{type:"argument",q:"Faut-il clarifier ce que le Dealer vend r\xE9ellement, ou la pi\xE8ce gagne-t-elle \xE0 rester ambigu\xEB ?",positions:[{pour:"Clarifier aiderait le public \xE0 entrer dans la pi\xE8ce. Savoir si c'est de la drogue, de l'amour, du pouvoir, etc., donnerait du sens aux enjeux. L'ambigu\xEFt\xE9 peut para\xEEtre pr\xE9tentieuse."},{contre:"L'ambigu\xEFt\xE9 EST la pi\xE8ce. Kolt\xE8s montre que tous les \xE9changes humains fonctionnent selon cette logique : quelqu'un a quelque chose, quelqu'un d'autre le d\xE9sire. La pi\xE8ce est une m\xE9ditation sur le d\xE9sir plus qu'une intrigue."},{synthese:"Chaque production peut choisir. Certaines clarifient (drogue), d'autres gardent le flou. Ce qui importe, c'est que les acteurs croient en l'enjeu, quelle que soit sa nature. L'ambigu\xEFt\xE9 fonctionne si elle sert la tension dramatique."}]}]},{id:"sa20",tier:"pro",title:"Le retour de Lioubov Andr\xE9ievna",source:"Tchekhov \u2014 La Cerisaie, Acte I",context:"Lioubov Andr\xE9ievna rentre de Paris pour sauver sa cerisaie, qu'elle doit vendre pour payer ses dettes. Elle revient dans sa maison de campagne apr\xE8s des ann\xE9es d'exil, retrouvant des serviteurs fid\xE8les, son domaine en ruines, et un futur qui ne ressemble plus \xE0 son pass\xE9. C'est une sc\xE8ne de retrouvailles charg\xE9e d'\xE9motion contenue et de non-dit tchekhkovien.",extract:"LIOUBOV : Quelle joie de vous voir ! Comment allez-vous ? (Aux domestiques) Gardez mes bagages. Je vais rester ici. Cette maison, ces pi\xE8ces... Je me demande si j'ai bien fait de partir. Les souvenirs me font mal. Mon Dieu, comme tout a chang\xE9 !",questions:[{type:"qcm",q:"Quel est le conflit interne de Lioubov dans ce retour ?",o:["Elle d\xE9teste sa maison","Elle aime sa maison mais la situation financi\xE8re la condamne","Elle veut vendre imm\xE9diatement","Elle a oubli\xE9 d'o\xF9 elle venait"],a:1,expl:"Tchekhov cr\xE9e une tension : Lioubov est heureuse de revenir ('Quelle joie') mais consciente de la catastrophe financi\xE8re ('les souvenirs me font mal'). C'est du non-dit caract\xE9ristique de Tchekhov. Elle exprime l'attachement et la panique simultan\xE9ment, sans clarifier."},{type:"qcm",q:"Comment Tchekhov montre-t-il que l'\xE9poque aristocratique s'effondre ?",o:["Par des monologues politiques","Par le d\xE9tail : 'Cette maison... chang\xE9'","Par des cris de d\xE9sespoir","Par des explications th\xE9\xE2trales"],a:1,expl:"Tchekhov n'explique jamais directement. Il montre par le contraste entre le pass\xE9 (la cerisaie en fleur, la richesse) et le pr\xE9sent (l'argent manque, la maison se d\xE9grade). Lioubov se demande 'comment tout a chang\xE9' \u2014 c'est la Russie qui change, pas juste sa situation financi\xE8re. Le d\xE9tail (les bagages, les serviteurs) cr\xE9e la texture r\xE9aliste."},{type:"libre",q:"Analysez les pauses dans cette tirade. O\xF9 situer les silences pour montrer l'\xE9motion contenue de Lioubov ?",ref:"'Quelle joie de vous voir' \u2014 sinc\xE8re mais rapide, comme si elle se r\xE9fr\xE9ne. Silence apr\xE8s. 'Comment allez-vous' \u2014 une question de courtoisie qui distance. Puis 'Je vais rester ici' \u2014 une d\xE9cision qui n'en est pas une (elle doit rester). Nouvelle pause. 'Cette maison' \u2014 elle retient un sanglot. 'Je me demande' \u2014 vraie question, donc pause pour r\xE9fl\xE9chir. 'Les souvenirs me font mal' \u2014 la vraie phrase, prononc\xE9e bas. 'Mon Dieu, comme tout a chang\xE9' \u2014 r\xE9signation. Les silences sont plus importants que les mots chez Tchekhov."},{type:"argument",q:"Lioubov est-elle sympathique ou irresponsable ? Comment jouer son personnage sans tomber dans le clich\xE9 de 'la pauvre aristocrate' ?",positions:[{pour:"Lioubov a gaspill\xE9 sa fortune en exil \xE0 Paris par faiblesse. Elle est irresponsable envers sa famille et ses serviteurs. Jouer son impuissance n'excuse pas sa faillite personnelle."},{contre:"Lioubov est victime d'une \xE9poque qui s'effondre. Elle ne peut pas inventer les solutions \u2014 la Russie elle-m\xEAme ne le peut pas. Son 'faiblesse' est celle d'une civilisation. La jouer avec dignit\xE9, c'est la rendre humaine."},{synthese:"Tchekhov veut les deux : Lioubov est \xE0 la fois coupable (elle ne s'est pas battue) et victime (elle n'avait pas les outils). Jouer cette ambigu\xEFt\xE9 sans la trancher rend le personnage vivant. C'est une femme lucide sur ses \xE9checs, mais qui ne peut pas changer."}]}]},{id:"sa21",tier:"pro",title:"La temp\xEAte du Roi Lear",source:"Shakespeare (trad.) \u2014 Le Roi Lear, Acte III, sc\xE8ne 2",context:"Le Roi Lear, d\xE9chu par ses filles, s'est enfui dans la temp\xEAte. Il rugit contre la nature, confondant sa col\xE8re personnelle avec le chaos du monde. Cette sc\xE8ne est l'apog\xE9e de sa folie \u2014 la limite entre le personnage humain et une force \xE9l\xE9mentaire. C'est une s\xE9quence po\xE9tique et visc\xE9rale.",extract:"Courez la temp\xEAte ! Que la pluie te cr\xE8ve les yeux ! Frappez, tonnerre ! Je ne suis pas li\xE9 par la gratitude envers toi, ciel. Non, je suis une montagne qui d\xE9fie les \xE9clairs !",questions:[{type:"qcm",q:"Quel est le d\xE9placement dramatique dans cette tirade ?",o:["Lear maudit la temp\xEAte","Lear s'identifie \xE0 la temp\xEAte","Lear chante les louanges du ciel","Lear demande pardon"],a:1,expl:"Au d\xE9but, Lear combat la temp\xEAte ('Courez la temp\xEAte'). \xC0 la fin, il s'identifie \xE0 une montagne, une force \xE9gale ou sup\xE9rieure ('une montagne'). C'est le sommet de son hybris : il se croit de niveau avec la nature. Cette identification le rend invincible et fou en m\xEAme temps."},{type:"qcm",q:"Le langage de Lear dans cette sc\xE8ne est\u2026",o:["Politique","Cosmique et mythologique","Juridique","Tendre"],a:1,expl:"Shakespeare \xE9l\xE8ve Lear au niveau du cosmos. Il ne parle pas de son royaume ou de ses filles \u2014 il parle du ciel, des \xE9clairs, de la montagne. C'est une po\xE9sie de la d\xE9mesure. Le personnage devient un arch\xE9type : l'homme r\xE9volt\xE9 contre l'univers. Le langage monte jusqu'au sublime."},{type:"libre",q:"Comment un acteur peut-il jouer la folie de Lear sans tomber dans la caricature ? Quels sont les signes physiques de sa transformation ?",ref:"La vraie folie chez Shakespeare n'est pas l'hyst\xE9rie \u2014 c'est une logique terrible. Lear pense vraiment qu'il est une montagne. L'acteur doit y croire. Physiquement : verticalit\xE9 croissante, corps qui se dilate, regard qui 'sort' du visage vers un horizon lointain. La voix ne crie pas \u2014 elle r\xE9sonne, profonde, comme si elle venait du sol. Les mains peuvent s'ouvrir en gestes de d\xE9fi qui deviennent presque des gestes de grandiose acceptation. Le d\xE9fi au ciel est aussi une forme d'amour violent."},{type:"argument",q:"Lear est-il victime de ses circonstances ou responsable de sa chute ?",positions:[{pour:"Lear a commenc\xE9 par une vanit\xE9 extr\xEAme \u2014 demander \xE0 ses filles de le flatter. Il a rejet\xE9 celle qui l'aimait vraiment (Cordelia). Ses malheurs sont le r\xE9sultat de ses choix mauvais."},{contre:"Lear est un roi dans un univers hostile. Ses filles sont des monstres. La nature elle-m\xEAme le pers\xE9cute. C'est la condition humaine que Shakespeare montre : la vuln\xE9rabilit\xE9 absolue. Lear n'a aucune chance."},{synthese:"Shakespeare propose les deux : il y a une responsabilit\xE9 de Lear (sa vanit\xE9 initiale) ET une force \xE9crasante qui le d\xE9passe (l'ingratitude, la temp\xEAte). La grandeur du personnage vient de ce qu'il continue de crier malgr\xE9 l'\xE9crasement. C'est une trag\xE9die, pas une simple moralit\xE9."}]}]},{id:"sa22",tier:"pro",title:"La reconnaissance chez Ionesco",source:"Ionesco \u2014 La Cantatrice chauve, tableau I",context:"M. et Mme Smith, un couple anglais ordinaire, se reconnaissent comme mari et femme qu'ils ne savaient pas \xEAtre. Ils se parlent comme des \xE9trangers, d\xE9crivant leurs faits et gestes du jour avec une absence totale d'\xE9motion, comme des robots qui d\xE9couvrent qu'ils sont mari\xE9s. C'est du th\xE9\xE2tre de l'absurde : la vie conjugale r\xE9duite \xE0 un quiproquo m\xE9taphysique.",extract:"MME SMITH : Tiens, comment ! C'est vous, cher ? Vous qui arriviez du bureau. Moi qui vous attendais patiemment depuis dix ans ! M. SMITH : Mais oui, c'est moi. Je venais d'en bas. MME SMITH : Ah, c'est vous ! Et voil\xE0 qu'on apprend qu'on est mari et femme.",questions:[{type:"qcm",q:"Quel est l'effet dramatique principal de cette sc\xE8ne ?",o:["Le suspense romantique","L'absurdit\xE9 du mariage comme institution m\xE9canique","L'amour retrouv\xE9 apr\xE8s des ann\xE9es","La nostalgie du couple"],a:1,expl:"Ionesco d\xE9construit le mythe du couple. M. et Mme Smith se reconnaissent et en parlent avec l'indiff\xE9rence de deux passants. 'Voil\xE0 qu'on apprend qu'on est mari et femme' \u2014 c'est une d\xE9couverte administrative, pas \xE9motionnelle. C'est un commentaire sur la routine conjugale dans la soci\xE9t\xE9 de consommation."},{type:"qcm",q:"Comment la langue d'Ionesco est-elle diff\xE9rente de celle du th\xE9\xE2tre classique ?",o:["Elle est plus po\xE9tique","Elle refuse la logique du sens \u2014 les phrases vides deviennent pleines","Elle est plus \xE9rudite","Elle copie la vie avec r\xE9alisme"],a:1,expl:"Ionesco \xE9crit des dialogues plats, banals, vides. Mais cette platitude devient poignante \u2014 c'est l'inhumanit\xE9 m\xEAme du quotidien. Moli\xE8re aurait rempli cette sc\xE8ne de sous-entendus. Ionesco la vide, et le vide dit tout."},{type:"libre",q:"Proposez une direction de jeu pour cette sc\xE8ne. Comment jouer l'indiff\xE9rence absolue sans ennuyer le public ?",ref:"L'indiff\xE9rence doit \xEAtre jou\xE9e avec une pr\xE9cision absolue. Pas d'\xE9motions feintes, pas de faux sourires. Les com\xE9diens peuvent parler comme des robots, avec des pauses anormales, des gestes m\xE9caniques. Mais l'absence d'\xE9motion elle-m\xEAme doit fasciner. Certaines mises en sc\xE8ne ajoutent des bruitages, du slapstick quotidien \u2014 faire bouillir l'eau, ranger des assiettes \u2014 comme si la vie domestique \xE9tait un m\xE9canisme. Le public rit parce qu'il reconna\xEEt sa propre vie : la parole us\xE9e, les gestes r\xE9p\xE9t\xE9s, l'absence de rencontre r\xE9elle m\xEAme en couple."},{type:"argument",q:"La Cantatrice chauve moque-t-elle surtout la classe bourgeoise ou la condition humaine en g\xE9n\xE9ral ?",positions:[{pour:"Ionesco s'en prend \xE0 la bourgeoisie anglaise : ses conventions, ses bonnes mani\xE8res creuses, son absence de spiritualit\xE9. C'est une satire sociale sp\xE9cifique."},{contre:"Ionesco parle de tous les hommes. Nous sommes tous des robots. La classe n'est qu'un d\xE9cor. La pi\xE8ce est une m\xE9ditation existentielle sur le langage qui ne communique plus."},{synthese:"Les deux niveaux de lecture coexistent. Ionesco peint la bourgeoisie, mais ce qu'il montre est universel. Toute classe peut devenir m\xE9canique, tout couple peut devenir une routine. C'est pourquoi la pi\xE8ce d\xE9passe son contexte initial."}]}]},{id:"sa23",tier:"pro",title:"Dom Juan face au Commandeur",source:"Moli\xE8re \u2014 Dom Juan, Acte IV, sc\xE8ne 6",context:"Dom Juan, le s\xE9ducteur sans scrupules, a os\xE9 inviter la Statue du Commandeur (le p\xE8re de l'une de ses victimes, enterr\xE9 depuis longtemps) \xE0 d\xEEner par d\xE9rision. La Statue arrive, accompagn\xE9e de signes surnaturels. C'est le moment o\xF9 l'impie affronte le divin \u2014 mais Moli\xE8re joue cette confrontation avec ambigu\xEFt\xE9 : Dom Juan reste s\xE9ducteur jusqu'au bout.",extract:"DOM JUAN : La Statue du Commandeur ! Ha ! quelle audace ! Approchez, approchez. (\xC0 Sganarelle) Approchez, approchez. Allons, que cette Statue parle ! Je veux voir ce qu'elle a \xE0 dire. (Riant) N'ayez pas peur. Ce n'est qu'un marbre.",questions:[{type:"qcm",q:"Quel est le registre du langage de Dom Juan face au surnaturel ?",o:["La terreur","Le d\xE9ni rationnel","L'ironie blasph\xE8me","La pri\xE8re"],a:2,expl:"Dom Juan rit du surnaturel. Il traite la Statue comme un objet ('Ce n'est qu'un marbre'). C'est du blasph\xE8me ludique \u2014 il refuse le sacr\xE9. Moli\xE8re montre un homme incapable de redouter, m\xEAme face \xE0 la mort. C'est une forme d'hybris, mais jou\xE9e comme du charme."},{type:"qcm",q:"Comment Moli\xE8re m\xEAle-t-il le comique et le tragique dans cette sc\xE8ne ?",o:["Il n'y a que du comique","Le comique de Dom Juan c\xF4toie une menace r\xE9elle","Le tragique domine","Il n'y a que du tragique"],a:1,expl:"Dom Juan fait rire par son audace, mais la Statue est r\xE9ellement mena\xE7ante. Moli\xE8re cr\xE9e une tension : le public rit du personnage tout en ayant peur. C'est le g\xE9nie du r\xF4le \u2014 s\xE9duisant jusqu'au damnation."},{type:"libre",q:"Comment jouer Dom Juan de sorte qu'on comprenne pourquoi les femmes tombent sous son charme ? Analysez les gestes, le ton, la pr\xE9sence.",ref:"Dom Juan ne doit jamais \xEAtre jou\xE9 comme un 'beau gosse'. Son pouvoir est ailleurs : dans l'autorit\xE9 (il ordonne 'Approchez'), dans l'insouciance face au danger (il rit), dans l'acceptation inconditionnelle du d\xE9sir (il ne juge pas ses propres pulsions). C'est un homme libre \u2014 et c'est cette libert\xE9 qui attire. Physiquement : assurance absolue du corps, regards directs, mouvements \xE9conomes mais d\xE9cid\xE9s. La s\xE9duction n'est pas dans les gestes \u2014 elle est dans l'absence de honte. Il regarde chacun(e) comme si elle \xE9tait l'univers, mais sans jamais s'engager \xE9motionnellement."},{type:"argument",q:"Dom Juan est-il un h\xE9ros ou un monstre ? Peut-on le juger moralement ?",positions:[{pour:"Dom Juan brise des c\u0153urs, abandonne des femmes, moque le divin. C'est un \xE9go\xEFste psychopathe qui m\xE9rite sa damnation. Moli\xE8re le montre comme un danger social."},{contre:"Dom Juan est un h\xE9doniste qui refuse les conventions. Il dit la v\xE9rit\xE9 \u2014 nous voulons tous le plaisir, nous mentons simplement mieux. Jauger Dom Juan c'est se jauger soi-m\xEAme. Moli\xE8re ne le condamne pas, il nous montre."},{synthese:"Moli\xE8re laisse la question ouverte. Dom Juan est s\xE9duisant ET dangereux. L'ambigu\xEFt\xE9 du r\xF4le \u2014 \xE0 la fois jouable et inexcusable \u2014 est ce qui en fait un classique. Chaque \xE9poque le r\xE9interpr\xE8te selon ses propres peurs."}]}]},{id:"sa24",tier:"pro",title:"Louis contemple son absence",source:"Lagarce \u2014 Juste la fin du monde, monologue d'ouverture",context:"Louis, qui va mourir et revient chez sa famille pour la premi\xE8re fois en douze ans, ouvre la pi\xE8ce avec un monologue long et sinueux. Il se demande comment annoncer la nouvelle, comment rompre le silence des ann\xE9es. C'est un monologue d'une densit\xE9 \xE9motionnelle contenue, un homme qui parle pour ne rien dire, qui annonce tout en se cachant.",extract:"Je vais rentrer \xE0 la maison. C'est dr\xF4le parce que j'y suis all\xE9 une fois quand j'avais\u2026 non, ce n'est pas important. Et puis je suis revenu \xE0 nouveau, mais c'\xE9tait diff\xE9rent. Je vais rentrer et je vais dire\u2026 quoi ? Que je suis venu dire quelque chose ?",questions:[{type:"qcm",q:"Quel est le vrai sujet de ce monologue ?",o:["D\xE9crire la maison","Explorer l'impossibilit\xE9 de communiquer","Raconter un voyage","Faire de la po\xE9sie"],a:1,expl:"Louis ressasse son incapacit\xE9 \xE0 parler. 'Je vais dire\u2026 quoi ?' \u2014 la phrase n'aboutit pas. C'est un monologue sur le silence, pas sur la parole. Lagarce montre un homme \xE9touff\xE9 par ce qu'il doit r\xE9v\xE9ler."},{type:"qcm",q:"Comment le temps est-il structur\xE9 dans ce passage ?",o:["Pass\xE9 simple","Enchev\xEAtrement du pass\xE9 et du pr\xE9sent","Futur pr\xE9visible","Pas de temps"],a:1,expl:"Lagarce m\xE9lange les temps : 'j'y suis all\xE9', 'je vais rentrer', 'je suis revenu'. C'est comme si Louis \xE9tait d\xE9j\xE0 mort, d\xE9j\xE0 revenu, toujours en train de revenir. Le texte cr\xE9e une \xE9ternit\xE9 pr\xE9sente o\xF9 le temps s'effondre."},{type:"libre",q:"Analysez les r\xE9p\xE9titions dans ce monologue. Quel est l'effet psychologique de ces boucles textuelles ?",ref:"'Je vais rentrer... je vais dire... quoi ?' \u2014 Louis tourne en cercle. Lagarce r\xE9p\xE8te les structures pour montrer une pens\xE9e pi\xE9g\xE9e. L'acteur doit sentir cette claustrophobie mentale. Chaque r\xE9p\xE9tition ajoute une couche de panique contenue. Le public entend un homme qui \xE9touff\xE9. Les silences entre les boucles sont plus importants que les mots. C'est proche du flux de conscience, mais plus structur\xE9, plus musical."},{type:"argument",q:"La pi\xE8ce gagne-t-elle \xE0 r\xE9v\xE9ler la maladie de Louis d\xE8s le d\xE9part, ou \xE0 garder le secret jusqu'\xE0 la fin ?",positions:[{pour:"R\xE9v\xE9ler imm\xE9diatement cr\xE9e la tension dramatique : chaque \xE9change avec la famille devient une temp\xEAte \xE9motionnelle contenue. Le secret avou\xE9 au spectateur cr\xE9e une intimit\xE9."},{contre:"Garder le secret jusqu'\xE0 la fin respecte l'exp\xE9rience \xE9motionnelle : le spectateur souffre avec Louis de cette impossibilit\xE9 \xE0 dire. C'est plus vrai."},{synthese:"Lagarce choisit de r\xE9v\xE9ler partiellement d\xE8s le d\xE9part (le titre lui-m\xEAme l'indique). Ce n'est pas vraiment un secret \u2014 c'est la difficult\xE9 \xE0 l'accepter et \xE0 le communiquer qui cr\xE9e la tension. Le spectateur sait, mais les personnages ne savent pas \u2014 et cette asym\xE9trie g\xE9n\xE8re toute la pi\xE8ce."}]}]}],LEVEL_SA={figurant:"sa1",apprenti:"sa2",dimanche:"sa3",amateur:"sa4",pensionnaire:"sa5",societaire:"sa6",interprete:"sa7",artiste:"sa8",metteur:"sa9"},AVANTSCENE_BREATHING=[{id:"br1",name:"Coh\xE9rence cardiaque",dur:180,inSec:4,outSec:6,desc:"Inspirez 4 secondes, expirez 6 secondes. Laissez le rythme s'installer naturellement."},{id:"br2",name:"Respiration abdominale",dur:120,inSec:4,outSec:4,desc:"Main sur le ventre. Gonflez \xE0 l'inspiration, rel\xE2chez \xE0 l'expiration. La poitrine ne bouge pas."},{id:"br3",name:"Souffle du com\xE9dien",dur:150,inSec:3,outSec:7,desc:"Inspirez par le nez (3s), expirez lentement en faisant vibrer les l\xE8vres (7s). Sentez la r\xE9sonance."}],AVANTSCENE_BODY=[{id:"bo1",title:"Rel\xE2cher la m\xE2choire",steps:["Ouvrez grand la bouche et b\xE2illez exag\xE9r\xE9ment","Massez les articulations de la m\xE2choire avec les doigts (petits cercles)","Laissez la m\xE2choire pendre, compl\xE8tement rel\xE2ch\xE9e","Faites des mouvements de gauche \xE0 droite, sans tension"]},{id:"bo2",title:"Lib\xE9rer les \xE9paules",steps:["Montez les \xE9paules jusqu'aux oreilles, tenez 5 secondes","Rel\xE2chez d'un coup en soufflant","Faites rouler les \xE9paules vers l'arri\xE8re, lentement, 5 fois","Secouez les bras comme des chiffons mouill\xE9s"]},{id:"bo3",title:"Ancrage et pr\xE9sence",steps:["Pieds parall\xE8les, \xE9cart\xE9s largeur de hanches","Sentez le poids du corps dans la plante des pieds","Fermez les yeux, imaginez des racines sous vos pieds","Grandissez-vous comme un fil tire le sommet de votre cr\xE2ne vers le ciel"]}],AVANTSCENE_MANTRAS=[{text:"Le trac n'est pas ton ennemi. C'est l'\xE9nergie de ton art qui se pr\xE9pare.",author:"Inspiration Stanislavski"},{text:"Ne joue pas. Sois.",author:"Sanford Meisner"},{text:"Le th\xE9\xE2tre, c'est s'approcher le plus possible de la vie. Plus on est vrai, plus on est grand.",author:"Louis Jouvet"},{text:"N'essayez pas de pousser le fleuve ; il coule tout seul.",author:"Proverbe zen, cher \xE0 Peter Brook"},{text:"Le corps sait des choses que la t\xEAte ne sait pas encore.",author:"Jacques Lecoq"},{text:"Le silence est la plus grande arme du com\xE9dien.",author:"Jean-Louis Barrault"},{text:"Chaque soir est le premier soir. Chaque public m\xE9rite ta premi\xE8re fois.",author:"Ariane Mnouchkine"},{text:"Ce n'est pas le talent qui fait l'acteur, c'est le courage.",author:"Inspiration Tchekhov"},{text:"Le personnage n'existe pas sans toi. Tu n'existes pas sans lui. Allez-y ensemble.",author:"Compagnie Castigat"},{text:"Tout est d\xE9j\xE0 en toi. Fais-lui confiance.",author:"Compagnie Castigat"}],AVANTSCENE_VISU=["Fermez les yeux. Respirez trois fois profond\xE9ment.","Imaginez le lieu de votre repr\xE9sentation. La sc\xE8ne, les lumi\xE8res, l'odeur du plateau.","Visualisez-vous en coulisses. Vous \xEAtes calme. Votre corps est pr\xEAt, votre esprit est clair.","Voyez-vous entrer en sc\xE8ne. Sentez vos pieds sur le plancher. L'espace vous appartient.","Entendez votre premi\xE8re r\xE9plique. Elle sort naturellement, port\xE9e par votre souffle.","Le public est avec vous. Chaque silence est un pont entre vous et eux.","Voyez-vous jouer votre sc\xE8ne pr\xE9f\xE9r\xE9e. Vous \xEAtes exactement l\xE0 o\xF9 vous devez \xEAtre.","Maintenant, revenez doucement. Gardez cette image en vous. Vous \xEAtes pr\xEAt\xB7e."],AVANTSCENE_AFFIRMATIONS=["Tu as travaill\xE9 pour \xEAtre ici. Fais confiance \xE0 ton travail.","Ton corps est ton instrument. Il est accord\xE9. Il est pr\xEAt.","Le public n'attend pas la perfection. Il attend la v\xE9rit\xE9.","Chaque respiration te rapproche de ton personnage.","Tu n'es pas seul\xB7e sur sc\xE8ne. Tes partenaires sont l\xE0. Le texte est l\xE0.","Le trac que tu ressens, c'est de l'\xE9nergie pure. Transforme-la en jeu.","Les plus grands ont trembl\xE9 avant toi. Tremble, et joue quand m\xEAme.","Ce soir, le th\xE9\xE2tre a besoin de toi. Exactement comme tu es.","L\xE2che le contr\xF4le. Laisse le personnage te traverser.","Tu as le droit de prendre ton temps. Le silence t'appartient.","Respire. \xC9coute. R\xE9ponds. C'est tout ce qu'on te demande.","Ton \xE9motion est un cadeau que tu fais au public. Offre-la sans retenue."],AVANTSCENE_FORMATS=[{id:"express",name:"Express",dur:"5 min",icon:"\u26A1",modules:["breathing","mantra"]},{id:"standard",name:"Standard",dur:"15 min",icon:"\u{1F3AD}",modules:["breathing","body","mantra","vocalise"]},{id:"complet",name:"Complet",dur:"30 min",icon:"\u2728",modules:["breathing","body","vocalise","detente","mantra","visu"]},{id:"introspection_5",name:"Introspection \xB7 5 min",dur:"5 min",icon:"\u{1F319}",modules:["immersion_short","visu"],group:"introspection"},{id:"introspection_10",name:"Introspection \xB7 10 min",dur:"10 min",icon:"\u{1F319}",modules:["immersion","visu"],group:"introspection"},{id:"introspection_20",name:"Introspection \xB7 20 min",dur:"20 min",icon:"\u{1F319}",modules:["immersion","visu","mantra"],group:"introspection"}],EXAMS={figurant:{name:"Examen \u2014 Le Figurant \u2192 L'Apprenti",minScore:3,questions:[{q:"Quelle est la base de toute projection vocale ?",o:["Le cri","La respiration abdominale","La di
