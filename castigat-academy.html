d:"15 \xE9chauffements vocaux",r:"R",c:s=>(s.warmups||0)>=15},{id:"b29",n:"Zen Master",ic:"\u{1F9D8}",d:"5 s\xE9ances Avant-Sc\xE8ne",r:"C",c:s=>(s.avantScenes||0)>=5},{id:"b30",n:"Papillon Social",ic:"\u{1F98B}",d:"D\xE9fier un ami",r:"C",c:s=>(s.challenges||0)>=1},{id:"b31",n:"Noctambule",ic:"\u{1F319}",d:"3 s\xE9ances Introspection",r:"C",c:s=>(s.connexions||0)>=3},{id:"b32",n:"Souffle de Dragon",ic:"\u{1F409}",d:"50 respirations totales",r:"R",c:s=>(s.totalBreaths||0)>=50},{id:"b41",n:"Poumons d'Acier",ic:"\u{1F4A8}",d:"100 respirations totales",r:"E",c:s=>(s.totalBreaths||0)>=100},{id:"b33",n:"Langue Agile",ic:"\u{1F445}",d:"5 phrases en Challenge Diction",r:"C",c:s=>Math.max(...Object.values(s.challengeScores||{0:0}))>=5},{id:"b34",n:"Bouche en Or",ic:"\u{1F947}",d:"10 phrases en Challenge Diction",r:"R",c:s=>Math.max(...Object.values(s.challengeScores||{0:0}))>=10},{id:"b35",n:"Mitraillette Verbale",ic:"\u{1F4A5}",d:"15 phrases en Challenge Diction",r:"E",c:s=>Math.max(...Object.values(s.challengeScores||{0:0}))>=15},{id:"b36",n:"Sarah Bernhardt",ic:"\u{1F3AD}",d:"20 phrases en Challenge (L\xE9gende !)",r:"L",c:s=>Math.max(...Object.values(s.challengeScores||{0:0}))>=20},{id:"b44",n:"Semaine Parfaite",ic:"\u{1F4C5}",d:"4/4 objectifs en une semaine",r:"R",c:s=>(s.perfectWeeks||0)>=1},{id:"b45",n:"Mois d'Or",ic:"\u{1F3C5}",d:"4 semaines parfaites d'affil\xE9e",r:"L",c:s=>(s.perfectWeeks||0)>=4}],GLOSSAIRE=[{term:"Plateau",def:"La sc\xE8ne elle-m\xEAme, l'espace de jeu.",difficulty:1},{term:"C\xF4t\xE9 cour",def:"Le c\xF4t\xE9 droit de la sc\xE8ne vu depuis la salle (gauche pour l'acteur).",difficulty:1},{term:"Coulisses",def:"Zones lat\xE9rales cach\xE9es du public, o\xF9 les acteurs attendent leurs entr\xE9es.",difficulty:1},{term:"Lointain",def:"Fond de la sc\xE8ne, le plus \xE9loign\xE9 du public.",difficulty:1},{term:"R\xE9plique",def:"Texte dit par un personnage en r\xE9ponse \xE0 un autre personnage.",difficulty:1},{term:"Tirade",def:"Longue r\xE9plique ininterrompue d'un personnage.",difficulty:1},{term:"Monologue",def:"Tirade d'un personnage seul en sc\xE8ne, exprimant ses pens\xE9es intimes.",difficulty:1},{term:"Apart\xE9",def:"R\xE9plique prononc\xE9e \xE0 part, entendue du public mais pas des autres personnages.",difficulty:1},{term:"Avant-sc\xE8ne",def:"Partie de la sc\xE8ne la plus proche du public, devant le rideau.",difficulty:1},{term:"Cintres",def:"Espace au-dessus de la sc\xE8ne o\xF9 sont suspendus d\xE9cors, rideaux et \xE9clairages.",difficulty:1},{term:"Distanciation",def:"Technique brechtienne visant \xE0 emp\xEAcher l'identification \xE9motionnelle du spectateur.",difficulty:2},{term:"Sous-texte",def:"Ce que le personnage pense ou ressent r\xE9ellement, au-del\xE0 de ce qu'il dit.",difficulty:2},{term:"Dramaturge",def:"Celui qui \xE9crit des pi\xE8ces, ou le conseiller litt\xE9raire d'un metteur en sc\xE8ne.",difficulty:2},{term:"Quatri\xE8me mur",def:"Mur imaginaire entre la sc\xE8ne et le public, cr\xE9ant l'illusion du r\xE9alisme.",difficulty:2},{term:"Filage",def:"R\xE9p\xE9tition d'un spectacle du d\xE9but \xE0 la fin sans interruption.",difficulty:2},{term:"G\xE9n\xE9rale",def:"Derni\xE8re r\xE9p\xE9tition avant la premi\xE8re, souvent devant un public invit\xE9.",difficulty:2},{term:"Note d'intention",def:"Document du metteur en sc\xE8ne expliquant sa vision artistique du spectacle.",difficulty:2},{term:"Distribution",def:"R\xE9partition des r\xF4les entre les com\xE9diens.",difficulty:2},{term:"C\xF4t\xE9 jardin",def:"Le c\xF4t\xE9 gauche de la sc\xE8ne vu depuis la salle (droite pour l'acteur).",difficulty:2},{term:"Entr\xE9e/Sortie",def:"Moment o\xF9 un personnage appara\xEEt ou quitte la sc\xE8ne. Chaque entr\xE9e modifie l'\xE9nergie.",difficulty:2},{term:"Conduite",def:"Document technique listant tous les effets (lumi\xE8re, son) cue par cue.",difficulty:3},{term:"Contre-emploi",def:"Confier un r\xF4le \xE0 un acteur dont le physique ou le temp\xE9rament est \xE0 l'oppos\xE9 du personnage.",difficulty:3},{term:"R\xE9gie",def:"Espace technique d'o\xF9 sont contr\xF4l\xE9s lumi\xE8re, son et effets pendant le spectacle.",difficulty:3},{term:"R\xE9sidence",def:"P\xE9riode de travail dans un lieu d'accueil, souvent avant la cr\xE9ation d'un spectacle.",difficulty:3},{term:"Italienne",def:"R\xE9p\xE9tition du texte seul, sans jeu ni d\xE9placements, pour v\xE9rifier la m\xE9morisation.",difficulty:3},{term:"Trac",def:"Anxi\xE9t\xE9 avant d'entrer en sc\xE8ne. Naturel et m\xEAme souhaitable \u2014 c'est de l'\xE9nergie.",difficulty:3},{term:"Trois coups",def:"Tradition fran\xE7aise : trois coups frapp\xE9s sur le plancher de sc\xE8ne avant le lever de rideau.",difficulty:3},{term:"Unit\xE9s (r\xE8gle des trois)",def:"Temps (24h), lieu (un seul), action (une seule intrigue) \u2014 r\xE8gle du classicisme.",difficulty:3}],FEED_QUOTES=[{text:"Le th\xE9\xE2tre, c'est \xEAtre vrai dans des circonstances imaginaires.",author:"Stanislavski"},{text:"Je peux prendre n'importe quel espace vide et l'appeler une sc\xE8ne nue.",author:"Peter Brook"},{text:"Le th\xE9\xE2tre est l'art de l'\xE9coute avant d'\xEAtre l'art de la parole.",author:"Ariane Mnouchkine"},{text:"Jouer, c'est mentir en disant la v\xE9rit\xE9.",author:"Jean Cocteau"},{text:"Le silence est la plus grande pers\xE9cution.",author:"Blaise Pascal"},{text:"Le vrai th\xE9\xE2tre na\xEEt d'un groupe de gens qui ont quelque chose \xE0 dire.",author:"Grotowski"},{text:"Chaque personnage que j'ai jou\xE9 m'a appris quelque chose sur moi-m\xEAme.",author:"Meryl Streep"},{text:"La sc\xE8ne est un lieu o\xF9 l'on peut enfin \xEAtre soi-m\xEAme.",author:"Luigi Pirandello"},{text:"Le th\xE9\xE2tre est fait pour nous apprendre qu'il y a autre chose que ce que l'on voit.",author:"Antoine Vitez"},{text:"Tout acteur a un secret. Le bon acteur ne le montre jamais enti\xE8rement.",author:"Louis Jouvet"}],FEED_CHALLENGES=[{title:"Le d\xE9fi du miroir",desc:"Passez 5 minutes devant un miroir \xE0 jouer 7 \xE9motions diff\xE9rentes sans un mot.",xp:50},{title:"Le virelangue impossible",desc:"Ma\xEEtrisez : \xAB Si six scies scient six cypr\xE8s, six cent six scies scient six cent six cypr\xE8s. \xBB",xp:40},{title:"La sc\xE8ne du quotidien",desc:"Transformez un moment banal de votre journ\xE9e en sc\xE8ne de th\xE9\xE2tre. Filmez.",xp:60},{title:"Le monologue en 1 minute",desc:"\xC9crivez et jouez un monologue en moins de 60 secondes chrono.",xp:50}],MONO_PERSO={fm1:"harpagon",fm2:"cyrano",fm25:"cyrano",fm3:"phedre",fm7:"celimene",fm8:"lucky",fm10:"antigone",fm11:"rodrigue",fm4:"fm4",fm5:"fm5",fm6:"fm6",fm9:"fm9",fm12:"fm12",fm13:"fm13",fm14:"fm14",fm15:"fm15",fm16:"fm16",fm17:"fm17",fm18:"fm18",fm19:"fm19",fm20:"fm20",fm21:"fm21",fm22:"fm22",fm23:"fm23",fm24:"fm24"},MONO_GRAD={1:"linear-gradient(135deg,#8A6A22,#4A3A18)",2:"linear-gradient(135deg,#6A5228,#332814)",3:"linear-gradient(135deg,#3E3468,#221E42)"},FEED_MONOLOGUES=[{id:"fm1",title:"Harpagon \u2014 le vol",source:"Moli\xE8re \u2014 L'Avare, Acte IV, sc.7",text:"Au voleur ! au voleur ! \xE0 l'assassin ! au meurtrier ! Justice, juste Ciel ! je suis perdu, je suis assassin\xE9, on m'a coup\xE9 la gorge, on m'a d\xE9rob\xE9 mon argent. Qui peut-ce \xEAtre ? Qu'est-il devenu ? O\xF9 est-il ? O\xF9 se cache-t-il ? Que ferai-je pour le trouver ? O\xF9 courir ? O\xF9 ne pas courir ? N'est-il point l\xE0 ? N'est-il point ici ? Qui est-ce ? Arr\xEAte. Rends-moi mon argent, coquin... Ah ! c'est moi. Mon esprit est troubl\xE9, et j'ignore o\xF9 je suis, qui je suis, et ce que je fais. H\xE9las ! mon pauvre argent, mon pauvre argent, mon cher ami ! on m'a priv\xE9 de toi ; et puisque tu m'es enlev\xE9, j'ai perdu mon support, ma consolation, ma joie ; tout est fini pour moi, et je n'ai plus que faire au monde : sans toi, il m'est impossible de vivre. C'en est fait, je n'en puis plus ; je me meurs, je suis mort, je suis enterr\xE9. N'y a-t-il personne qui veuille me ressusciter, en me rendant mon cher argent, ou en m'apprenant qui l'a pris ?",tier:"debutant",difficulty:1,genre:"homme",tips:"Jouez la panique croissante. Chaque question est plus d\xE9sesp\xE9r\xE9e que la pr\xE9c\xE9dente. Le corps s'agite, les yeux cherchent partout. Le moment o\xF9 il s'attrape lui-m\xEAme est le sommet comique."},{id:"fm12",title:"Tartuffe \u2014 la s\xE9duction",source:"Moli\xE8re \u2014 Tartuffe, Acte III, sc.3",text:"Le Ciel d\xE9fend, de vrai, certains contentements ; mais on trouve avec lui des accommodements. Selon divers besoins, il est une science d'\xE9tendre les liens de notre conscience et de rectifier le mal de l'action avec la puret\xE9 de notre intention. De ces secrets, Madame, on saura vous instruire ; vous n'avez seulement qu'\xE0 vous laisser conduire. Contentez mon d\xE9sir, et n'ayez point d'effroi : je vous r\xE9ponds de tout, et prends le mal sur moi. Ah ! pour \xEAtre d\xE9vot, je n'en suis pas moins homme ; et lorsqu'on vient \xE0 voir vos c\xE9lestes appas, un c\u0153ur se laisse prendre, et ne raisonne pas. Je sais qu'un tel discours de moi para\xEEt \xE9trange ; mais, Madame, apr\xE8s tout, je ne suis pas un ange.",tier:"debutant",difficulty:1,genre:"homme",tips:"Tartuffe d\xE9tourne le langage religieux pour s\xE9duire. Jouez la douceur onctueuse, la fausse pi\xE9t\xE9. Le danger est sous le miel. Chaque argument th\xE9ologique est un pas de plus vers Elmire."},{id:"fm19",title:"Sganarelle \u2014 le tabac",source:"Moli\xE8re \u2014 Dom Juan, Acte I, sc.1",text:"Quoi que puisse dire Aristote et toute la Philosophie, il n'est rien d'\xE9gal au tabac : c'est la passion des honn\xEAtes gens, et qui vit sans tabac n'est pas digne de vivre. Non seulement il r\xE9jouit et purge les cerveaux humains, mais encore il instruit les \xE2mes \xE0 la vertu, et l'on apprend avec lui \xE0 devenir honn\xEAte homme. Ne voyez-vous pas bien, d\xE8s qu'on en prend, de quelle mani\xE8re obligeante on en use avec tout le monde, et comme on est ravi d'en donner \xE0 droit et \xE0 gauche, partout o\xF9 l'on se trouve ? On n'attend pas m\xEAme qu'on en demande, et l'on court au-devant du souhait des gens : tant il est vrai que le tabac inspire des sentiments d'honneur et de vertu \xE0 tous ceux qui en prennent.",tier:"debutant",difficulty:1,genre:"homme",tips:"C'est un \xE9loge absurde prononc\xE9 avec un s\xE9rieux total. Le comique vient du d\xE9calage entre la grandiloquence du ton et la trivialit\xE9 du sujet. Sganarelle est convaincu de chaque mot."},{id:"fm21",title:"Argan \u2014 le malade",source:"Moli\xE8re \u2014 Le Malade imaginaire, Acte I, sc.1",text:"Trois et deux font cinq, et cinq font dix, et dix font vingt. Soixante-trois livres quatre sols six deniers. Si bien donc que de ce mois j'ai pris une, deux, trois, quatre, cinq, six, sept et huit m\xE9decines ; et un, deux, trois, quatre, cinq, six, sept, huit, neuf, dix, onze et douze lavements ; et l'autre mois il y avait douze m\xE9decines et vingt lavements. Je ne m'\xE9tonne pas si je ne me porte pas si bien ce mois-ci que l'autre. Je le dirai \xE0 Monsieur Purgon, afin qu'il mette ordre \xE0 cela. Allons, qu'on m'\xF4te tout ceci. Il n'y a personne : j'ai beau dire, on me laisse toujours seul ; il n'y a pas moyen de les arr\xEAter ici. Drelin, drelin, drelin : point d'affaire. Drelin, drelin, drelin : ils sont sourds. Toinette ! Drelin, drelin, drelin : tout comme si je ne sonnais point. Chienne, coquine ! Drelin, drelin, drelin : j'enrage.",tier:"debutant",difficulty:1,genre:"homme",tips:"Argan compte ses m\xE9dicaments avec l'obsession d'un avare comptant son or. C'est \xE0 la fois path\xE9tique et hilarant. Le corps est celui d'un homme persuad\xE9 d'\xEAtre mourant. Les 'drelin' sont de plus en plus rageurs."},{id:"fm17",title:"Scapin \u2014 la gal\xE8re",source:"Moli\xE8re \u2014 Les Fourberies de Scapin, Acte II, sc.7",text:"Que diable allait-il faire dans cette gal\xE8re ? Ah, maudite gal\xE8re ! Tra\xEEtre de Turc \xE0 tous les diables ! Il faut, Seigneur G\xE9ronte, il faut que vous fassiez vite, il ne m'a donn\xE9 que deux heures. Songez que cinq cents \xE9cus ce n'est rien au prix de votre fils. Et, comme je vous disais, il ne faut pas un sou de plus, et si vous n'allez qu\xE9rir cette somme, votre fils sera emmen\xE9 en Alger. Que diable allait-il faire dans cette gal\xE8re ? Mais songez, Monsieur, que le temps presse, et que vous courez risque de perdre votre fils. H\xE9las ! mon pauvre ma\xEEtre, peut-\xEAtre que je ne te verrai de ma vie, et qu'\xE0 l'heure que je parle, on t'emm\xE8ne esclave en Alger. Que diable allait-il faire dans cette gal\xE8re ?",tier:"debutant",difficulty:1,genre:"homme",tips:"Scapin joue la com\xE9die \xE0 G\xE9ronte. C'est du th\xE9\xE2tre dans le th\xE9\xE2tre. Exag\xE9rez le d\xE9sespoir \u2014 le public sait que c'est faux et c'est \xE7a qui est dr\xF4le. Le refrain 'Que diable allait-il faire dans cette gal\xE8re ?' revient comme un gag."},{id:"fm23",title:"Alceste \u2014 la sinc\xE9rit\xE9",source:"Moli\xE8re \u2014 Le Misanthrope, Acte I, sc.1",text:"Je veux qu'on soit sinc\xE8re, et qu'en homme d'honneur on ne l\xE2che aucun mot qui ne parte du c\u0153ur. Non, je ne puis souffrir cette l\xE2che m\xE9thode qu'affectent la plupart de vos gens \xE0 la mode ; et je ne hais rien tant que les contorsions de tous ces grands faiseurs de protestations, ces affables donneurs d'embrassades frivoles, ces obligeants diseurs d'inutiles paroles, qui de civilit\xE9s avec tous font combat, et traitent du m\xEAme air l'honn\xEAte homme et le fat. Quel avantage a-t-on qu'un homme vous caresse, vous jure amiti\xE9, foi, z\xE8le, estime, tendresse, et vous fasse de vous un \xE9loge \xE9clatant, lorsqu'au premier faquin il court en faire autant ? Moi, je veux me f\xE2cher, et ne veux point entendre.",tier:"debutant",difficulty:1,genre:"homme",tips:"Alceste est un id\xE9aliste furieux. Sa col\xE8re est sinc\xE8re mais aussi comique \u2014 il est le seul \xE0 ne pas voir l'ironie de sa position. Jouez la conviction absolue. Chaque exemple l'\xE9nerve davantage."},{id:"fm2",title:"Cyrano \u2014 la tirade du nez",source:"Rostand \u2014 Cyrano de Bergerac, Acte I, sc.4",text:"Ah ! non ! c'est un peu court, jeune homme ! On pouvait dire... Oh ! Dieu !... bien des choses en somme... En variant le ton, par exemple, tenez : Agressif : \xAB Moi, monsieur, si j'avais un tel nez, il faudrait sur-le-champ que je me l'amputasse ! \xBB Amical : \xAB Mais il doit tremper dans votre tasse ! Pour boire, faites-vous fabriquer un hanap ! \xBB Descriptif : \xAB C'est un roc !... c'est un pic !... c'est un cap ! Que dis-je, c'est un cap ?... C'est une p\xE9ninsule ! \xBB Gracieux : \xAB Aimez-vous \xE0 ce point les oiseaux que paternellement vous vous pr\xE9occup\xE2tes de tendre ce perchoir \xE0 leurs petites pattes ? \xBB Truculent : \xAB \xC7\xE0, monsieur, lorsque vous p\xE9tunez, la vapeur du tabac vous sort-elle du nez sans qu'un voisin ne crie au feu de chemin\xE9e ? \xBB Pr\xE9venant : \xAB Gardez-vous, votre t\xEAte entra\xEEn\xE9e par ce poids, de tomber en avant sur le sol ! \xBB Voil\xE0 ce qu'\xE0 peu pr\xE8s, mon cher, vous m'auriez dit si vous aviez un peu de lettres et d'esprit.",tier:"debutant",difficulty:1,genre:"homme",tips:"L'humour masque la blessure. Cyrano attaque avant qu'on l'attaque. Chaque registre a son ton propre \u2014 changez de voix, de posture. Le panache est l'armure de la douleur."},{id:"fm4",title:"Hamlet \u2014 \xEAtre ou ne pas \xEAtre",source:"Shakespeare (trad.) \u2014 Hamlet, Acte III, sc.1",text:"\xCAtre, ou ne pas \xEAtre, c'est l\xE0 la question. Y a-t-il plus de noblesse d'\xE2me \xE0 subir la fronde et les fl\xE8ches de la fortune outrageante, ou bien \xE0 s'armer contre une mer de douleurs et \xE0 l'arr\xEAter par une r\xE9volte ? Mourir... dormir, rien de plus ; et dire que par ce sommeil nous mettons fin aux maux du c\u0153ur et aux mille tortures naturelles qui sont le lot de la chair : c'est l\xE0 un d\xE9nouement qu'on doit souhaiter avec ferveur. Mourir... dormir, dormir ! peut-\xEAtre r\xEAver ! Oui, l\xE0 est l'obstacle ; car quels r\xEAves peut-il nous venir dans ce sommeil de la mort, quand nous sommes d\xE9barrass\xE9s de l'\xE9treinte de cette vie ? Voil\xE0 qui doit nous arr\xEAter. C'est cette r\xE9flexion-l\xE0 qui nous vaut la calamit\xE9 d'une si longue existence.",tier:"intermediaire",difficulty:2,genre:"homme",tips:"Ce n'est pas une d\xE9clamation \u2014 c'est une r\xE9flexion intime \xE0 voix haute. Hamlet pense en temps r\xE9el. Laissez les silences vivre. Chaque pens\xE9e en entra\xEEne une autre, comme un esprit qui tourne en boucle."},{id:"fm6",title:"Dom Juan \u2014 l'hypocrisie",source:"Moli\xE8re \u2014 Dom Juan, Acte V, sc.2",text:"L'hypocrisie est un vice \xE0 la mode, et tous les vices \xE0 la mode passent pour vertus. Le personnage d'homme de bien est le meilleur de tous les personnages qu'on puisse jouer aujourd'hui, et la profession d'hypocrite a de merveilleux avantages. C'est un art de qui l'imposture est toujours respect\xE9e ; et quoiqu'on la d\xE9couvre, on n'ose rien dire contre elle. Tous les autres vices des hommes sont expos\xE9s \xE0 la censure, et chacun a la libert\xE9 de les attaquer hautement ; mais l'hypocrisie est un vice privil\xE9gi\xE9, qui, de sa main, ferme la bouche \xE0 tout le monde, et jouit en repos d'une impunit\xE9 souveraine. On lie, \xE0 force de grimaces, une soci\xE9t\xE9 \xE9troite avec tous les gens du parti. Qui en choque un, se les jette tous sur les bras ; et ceux que l'on sait m\xEAme agir de bonne foi l\xE0-dessus, et que chacun conna\xEEt pour \xEAtre v\xE9ritablement touch\xE9s, ceux-l\xE0, dis-je, sont toujours les dupes des autres.",tier:"intermediaire",difficulty:2,genre:"homme",tips:"Dom Juan jubile. C'est un manifeste cynique livr\xE9 avec charme et intelligence. Le sourire ne quitte jamais les yeux. Il d\xE9voile les rouages du monde avec un plaisir presque enfantin."},{id:"fm11",title:"Le Cid \u2014 les stances",source:"Corneille \u2014 Le Cid, Acte I, sc.6",text:"Perc\xE9 jusques au fond du c\u0153ur d'une atteinte impr\xE9vue aussi bien que mortelle, mis\xE9rable vengeur d'une juste querelle, et malheureux objet d'une injuste rigueur, je demeure immobile, et mon \xE2me abattue c\xE8de au coup qui me tue. Si pr\xE8s de voir mon feu r\xE9compens\xE9, \xF4 Dieu, l'\xE9trange peine ! En cet affront mon p\xE8re est l'offens\xE9, et l'offenseur le p\xE8re de Chim\xE8ne ! Que je sens de rudes combats ! Contre mon propre honneur mon amour s'int\xE9resse : il faut venger un p\xE8re, et perdre une ma\xEEtresse. L'un m'anime le c\u0153ur, l'autre retient mon bras. R\xE9duit au triste choix ou de trahir ma flamme, ou de vivre en inf\xE2me, des deux c\xF4t\xE9s mon mal est infini. \xD4 Dieu, l'\xE9trange peine ! Faut-il laisser un affront impuni ? Faut-il punir le p\xE8re de Chim\xE8ne ?",tier:"intermediaire",difficulty:2,genre:"homme",tips:"Rodrigue est d\xE9chir\xE9 entre l'honneur et l'amour. Chaque vers est un balancement entre les deux. Le conflit int\xE9rieur doit se lire physiquement. Les stances sont un vrai monologue int\xE9rieur \u2014 pas un discours, une torture."},{id:"fm15",title:"Figaro \u2014 le monologue",source:"Beaumarchais \u2014 Le Mariage de Figaro, Acte V, sc.3",text:"Non, Monsieur le Comte, vous ne l'aurez pas... vous ne l'aurez pas. Parce que vous \xEAtes un grand Seigneur, vous vous croyez un grand g\xE9nie !... Noblesse, fortune, un rang, des places, tout cela rend si fier ! Qu'avez-vous fait pour tant de biens ? Vous vous \xEAtes donn\xE9 la peine de na\xEEtre, et rien de plus. Du reste, homme assez ordinaire ! Tandis que moi, morbleu ! perdu dans la foule obscure, il m'a fallu d\xE9ployer plus de science et de calculs pour subsister seulement, qu'on n'en a mis depuis cent ans \xE0 gouverner toutes les Espagnes : et vous voulez jouter... On imprime mes id\xE9es, et voil\xE0 ma libert\xE9 supprim\xE9e ! Il s'\xE9l\xE8ve une question sur la nature des richesses ; et, comme il n'est pas n\xE9cessaire de tenir les choses pour en raisonner, n'ayant pas un sou, j'\xE9cris sur la valeur de l'argent et sur son produit net : aussit\xF4t je vois, du fond d'un fiacre, baisser pour moi le pont d'un ch\xE2teau fort. Que je voudrais bien tenir un de ces puissants de quatre jours, si l\xE9gers sur le mal qu'ils ordonnent !",tier:"intermediaire",difficulty:2,genre:"homme",tips:"Figaro parle au nom de tous les opprim\xE9s. C'est un discours politique autant qu'intime. L'ironie est l'arme du faible contre le puissant. Le rythme s'acc\xE9l\xE8re avec la col\xE8re."},{id:"fm20",title:"Titus \u2014 le sacrifice",source:"Racine \u2014 B\xE9r\xE9nice, Acte IV, sc.4",text:"Eh bien ! Titus, que viens-tu faire ? B\xE9r\xE9nice t'attend. O\xF9 viens-tu, t\xE9m\xE9raire ? Tes adieux sont-ils pr\xEAts ? T'es-tu bien consult\xE9 ? Ton c\u0153ur te promet-il assez de cruaut\xE9 ? Car enfin au combat qui pour toi se pr\xE9pare, c'est peu d'\xEAtre constant, il faut \xEAtre barbare. Soutiendrai-je ces yeux dont la douce langueur sait si bien d\xE9couvrir les chemins de mon c\u0153ur ? Quand je verrai ces yeux arm\xE9s de tous leurs charmes, attach\xE9s sur les miens, m'accabler de leurs larmes, me souviendrai-je alors de mon triste devoir ? Pourrai-je dire enfin : Je ne veux plus vous voir ? Je viens percer un c\u0153ur que j'adore, qui m'aime. Et pourquoi le percer ? Qui l'ordonne ? Moi-m\xEAme.",tier:"intermediaire",difficulty:2,genre:"homme",tips:"Titus se parle \xE0 lui-m\xEAme avant d'affronter B\xE9r\xE9nice. C'est un homme qui se pr\xE9pare \xE0 se briser le c\u0153ur. Le conflit entre le devoir et l'amour est d\xE9chirant. Il se tutoie \u2014 c'est un proc\xE8s qu'il se fait."},{id:"fm22",title:"Perdican \u2014 l'amour",source:"Musset \u2014 On ne badine pas avec l'amour, Acte II, sc.5",text:"Tous les hommes sont menteurs, inconstants, faux, bavards, hypocrites, orgueilleux et l\xE2ches, m\xE9prisables et sensuels ; toutes les femmes sont perfides, artificieuses, vaniteuses, curieuses et d\xE9prav\xE9es ; le monde n'est qu'un \xE9gout sans fond o\xF9 les phoques les plus informes rampent et se tordent sur des montagnes de fange ; mais il y a au monde une chose sainte et sublime, c'est l'union de deux de ces \xEAtres si imparfaits et si affreux. On est souvent tromp\xE9 en amour, souvent bless\xE9 et souvent malheureux ; mais on aime, et quand on est sur le bord de sa tombe, on se retourne pour regarder en arri\xE8re, et on se dit : J'ai souffert souvent, je me suis tromp\xE9 quelquefois, mais j'ai aim\xE9. C'est moi qui ai v\xE9cu, et non pas un \xEAtre factice cr\xE9\xE9 par mon orgueil et mon ennui.",tier:"intermediaire",difficulty:2,genre:"homme",tips:"Le discours bascule du cynisme le plus noir \xE0 la d\xE9claration d'amour la plus pure. Ce virage est le c\u0153ur du monologue \u2014 pr\xE9parez-le, ne le pr\xE9cipitez pas. La derni\xE8re phrase doit \xEAtre bouleversante."},{id:"fm10",title:"Antigone \u2014 le refus",source:"Anouilh \u2014 Antigone",text:"Vous me d\xE9go\xFBtez tous avec votre bonheur ! Avec votre vie qu'il faut aimer co\xFBte que co\xFBte. On dirait des chiens qui l\xE8chent tout ce qu'ils trouvent. Et cette petite chance pour tous les jours, si on n'est pas trop exigeant. Moi, je veux tout, tout de suite, et que ce soit entier, ou alors je refuse ! Je ne veux pas \xEAtre modeste, moi, et me contenter d'un petit morceau si j'ai \xE9t\xE9 bien sage. Je veux \xEAtre s\xFBre de tout aujourd'hui et que cela soit aussi beau que quand j'\xE9tais petite, ou mourir. Je ne veux pas comprendre. C'est bon pour vous. Moi je suis l\xE0 pour autre chose que pour comprendre. Je suis l\xE0 pour vous dire non et pour mourir.",tier:"intermediaire",difficulty:2,genre:"femme",tips:"Antigone est d'une clart\xE9 absolue. Pas de pathos, pas de tremblements \u2014 une d\xE9termination pure. La force vient de la simplicit\xE9. Elle oppose le tout au compromis \u2014 c'est une r\xE9volte totale contre le monde adulte."},{id:"fm3",title:"Ph\xE8dre \u2014 l'aveu",source:"Racine \u2014 Ph\xE8dre, Acte II, sc.5",text:"Oui, Prince, je languis, je br\xFBle pour Th\xE9s\xE9e. Je l'aime, non point tel que l'ont vu les enfers, volage adorateur de mille objets divers, qui va du dieu des morts d\xE9shonorer la couche ; mais fid\xE8le, mais fier, et m\xEAme un peu farouche, charmant, jeune, tra\xEEnant tous les c\u0153urs apr\xE8s soi, tel qu'on d\xE9peint nos dieux, ou tel que je vous voi. Il avait votre port, vos yeux, votre langage, cette noble pudeur colorait son visage lorsque de notre Cr\xE8te il traversa les flots, digne sujet des v\u0153ux des filles de Minos. Que faisiez-vous alors ? Pourquoi, sans Hippolyte, des h\xE9ros de la Gr\xE8ce assembla-t-il l'\xE9lite ? Pourquoi, trop jeune encor, ne p\xFBtes-vous alors entrer dans le vaisseau qui le mit sur nos bords ? Par vous aurait p\xE9ri le monstre de la Cr\xE8te. Oui, c'est vous que j'aime.",tier:"intermediaire",difficulty:2,genre:"femme",tips:"Le glissement de Th\xE9s\xE9e \xE0 Hippolyte est le c\u0153ur de la tirade. Commencez dans le contr\xF4le, laissez la passion d\xE9border. Quand elle dit 'tel que je vous voi', le masque tombe \u2014 elle ne peut plus mentir."},{id:"fm7",title:"C\xE9lim\xE8ne \u2014 les portraits",source:"Moli\xE8re \u2014 Le Misanthrope, Acte II, sc.4",text:"Cl\xE9onte ? Il est de ces gens qui, par un long s\xE9jour dans la cour, ont su se faire un merveilleux usage du monde. Il brille de cela dans tout ce qu'il d\xE9bite ; le beau langage, en tout, est son moindre talent ; car il sait de chacun copier l'agr\xE9ment, et se mettre partout d'une fa\xE7on si ais\xE9e qu'il para\xEEt n'avoir rien de sa propre pens\xE9e. Damon, le raisonneur, qui m'importune, h\xE9las, vient me voir chaque jour, sans rien dire de neuf, et me fait en causant de si longs pr\xE9ambules que j'en b\xE2ille d'ennui vingt fois pendant ses fables. Timante encore : le secret est son grand caract\xE8re ; il entre dans un myst\xE8re, se penche \xE0 votre oreille, et d'un air important vous dit... rien du tout ! Ma foi, ce sont les portraits du temps.",tier:"intermediaire",difficulty:2,genre:"femme",tips:"C\xE9lim\xE8ne est brillante et cruelle. Elle fait rire la galerie aux d\xE9pens des absents. Jouez l'intelligence du trait d'esprit, pas la m\xE9chancet\xE9. Chaque portrait est un num\xE9ro \u2014 changez de ton pour chaque personnage croqu\xE9."},{id:"fm5",title:"M\xE9d\xE9e \u2014 l'invocation",source:"Corneille \u2014 M\xE9d\xE9e, Acte I, sc.5",text:"Souverains protecteurs des lois de l'hym\xE9n\xE9e, Dieux, garants de la foi que Jason m'a donn\xE9e, Vous qu'il prit \xE0 t\xE9moin d'une immortelle ardeur, Voyez de quel m\xE9pris vous traite son parjure, Et m'aidez \xE0 venger cette commune injure. Et toi, s\u0153ur du Soleil, toi qui me vois rougir de tant de l\xE2chet\xE9s, approuve par ta rougeur le trouble de ma honte ! Est-ce assez, ma vengeance, est-ce assez de fureur ? Ah ! quelle l\xE2chet\xE9 ! qui craint de trop oser n'a qu'un c\u0153ur qui se tra\xEEne et qui va s'\xE9craser. Pour qui sont ces serpents qui sifflent sur vos t\xEAtes ? D\xE9ployons \xE0 ses yeux un spectacle nouveau : faisons agir ensemble et le fer et la flamme, et par un bel exc\xE8s couronnons cette trame. Jason me r\xE9pudie ! et qui l'aurait pu croire ? S'il a manqu\xE9 d'amour, manquons de bonne foi. Et que nos ennemis, que la terre et les cieux, les Dieux, les \xE9l\xE9ments, tout, tout tremble \xE0 mes yeux.",tier:"avance",difficulty:3,genre:"femme",tips:"M\xE9d\xE9e passe de la supplication \xE0 la menace. Les dieux sont ses t\xE9moins mais aussi ses armes. La transformation doit \xEAtre visible physiquement. Sa voix descend dans les graves \xE0 mesure que la vengeance prend forme."},{id:"fm8",title:"Lucky \u2014 le discours",source:"Beckett \u2014 En attendant Godot, Acte I",text:"\xC9tant donn\xE9 l'existence telle qu'elle jaillit des r\xE9cents travaux publics de Poin\xE7on et Wattmann d'un Dieu personnel quaquaquaqua \xE0 barbe blanche quaqua hors du temps de l'\xE9tendue qui du haut de sa divine apathie sa divine athambie sa divine aphasie nous aime bien \xE0 quelques exceptions pr\xE8s on ne sait pourquoi mais \xE7a viendra et souffre \xE0 l'instar de la divine Miranda avec ceux qui sont on ne sait pourquoi mais on a le temps dans le tourment dans les feux dont les feux les flammes pour peu que \xE7a dure encore un peu et qui peut en douter mettront \xE0 la fin le feu aux poutres assavoir mettront \xE0 la fin le feu aux poutres et assavoir la t\xEAte la t\xEAte la t\xEAte en Normandie malgr\xE9 le tennis les faits sont l\xE0 on ne sait pourquoi en d\xE9pit du tennis les faits sont l\xE0 la t\xEAte h\xE9las la t\xEAte la t\xEAte en Normandie malgr\xE9 le tennis...",tier:"avance",difficulty:3,genre:"homme",tips:"Le chaos EST le texte. Il n'y a pas de ponctuation logique \u2014 c'est un flux de conscience bris\xE9. Trouvez votre propre rythme dans la d\xE9sint\xE9gration. L'urgence de communiquer est le moteur, m\xEAme si le langage s'effondre."},{id:"fm13",title:"Ruy Blas \u2014 le ver de terre",source:"Hugo \u2014 Ruy Blas, Acte III, sc.2",text:"Bon app\xE9tit, messieurs ! \xD4 ministres int\xE8gres ! Conseillers vertueux ! Voil\xE0 votre fa\xE7on de servir, serviteurs qui pillez la maison ! Donc vous n'avez pas honte et vous choisissez l'heure, l'heure sombre o\xF9 l'Espagne agonisante pleure ! Donc vous n'avez ici pas d'autres int\xE9r\xEAts que remplir votre poche et vous moquer du reste ! Soyez fl\xE9tris, devant votre pays qui tombe, fossoyeurs qui venez le voler dans sa tombe ! Mais voyez, regardez, ayez quelque pudeur. L'Espagne et sa vertu, l'Espagne et sa grandeur, tout s'en va. Et l'on voit cheminer les affaires, l'\xC9tat est un cadavre, ils sont les vers de terre ! Charles Quint, dans ces temps d'opprobre et de terreur, que fais-tu dans ta tombe, \xF4 puissant Empereur ? Oh ! l\xE8ve-toi ! Viens voir !",tier:"avance",difficulty:3,genre:"homme",tips:"C'est un volcan qui explose. La col\xE8re est juste, les mots sont des armes. Projetez chaque accusation comme un coup de poing. Le rythme hugolien s'acc\xE9l\xE8re \u2014 les vers sont de plus en plus courts, de plus en plus percutants."},{id:"fm9",title:"Roxane \u2014 la r\xE9v\xE9lation",source:"Rostand \u2014 Cyrano de Bergerac, Acte V, sc.5",text:"C'\xE9tait vous ! J'aurais d\xFB deviner quand il disait mon nom ! Non ! Non ! Ce n'est pas vrai ! Je n'aimais qu'un seul \xEAtre et je le perds deux fois ! Cette lettre ? ces pleurs ? Ce sang ? Tout cela, tout, c'\xE9tait vous ! Et cette voix dans la nuit, c'\xE9tait la v\xF4tre. Je vous dis que depuis quatorze ans j'ai entendu sonner dans l'air cette voix tendre et grave et que jamais je ne l'ai oubli\xE9e. L'\xE2me, c'\xE9tait la v\xF4tre ! Pourquoi vous \xEAtre tu pendant quatorze ans, puisque sur cette lettre o\xF9, lui, n'\xE9tait pour rien, ces pleurs \xE9taient de vous ? Pourquoi vous \xEAtre tu ? Pourquoi ? Tout ce bonheur perdu, ces ann\xE9es, ces larmes, ce silence \u2014 pourquoi ? Et lui qui meurt ce soir encore une fois \u2014 pourquoi ?",tier:"avance",difficulty:3,genre:"femme",tips:"La r\xE9v\xE9lation d\xE9truit et illumine en m\xEAme temps. Jouez l'effondrement et l'\xE9merveillement simultan\xE9ment. Le deuil cohabite avec la d\xE9couverte. Chaque 'pourquoi' est une blessure qui s'ouvre."},{id:"fm14",title:"B\xE9r\xE9nice \u2014 l'adieu",source:"Racine \u2014 B\xE9r\xE9nice, Acte V, sc.7",text:"Dans un mois, dans un an, comment souffrirons-nous, Seigneur, que tant de mers me s\xE9parent de vous ? Que le jour recommence et que le jour finisse, sans que jamais Titus puisse voir B\xE9r\xE9nice, sans que de tout le jour je puisse voir Titus ? Mais quelle est mon erreur, et que de soins perdus ! L'ingrat, de mon d\xE9part consol\xE9 par avance, daignera-t-il compter les jours de mon absence ? Ces jours si longs pour moi lui sembleront trop courts. Je n'aurai pas, Madame, \xE0 compter tant de jours. J'esp\xE8re que bient\xF4t la triste renomm\xE9e vous fera confesser que vous \xE9tiez aim\xE9e. Vous conna\xEEtrez Titus... Mais, ma princesse, adieu. Pour la derni\xE8re fois, adieu, Seigneur. H\xE9las !",tier:"avance",difficulty:3,genre:"femme",tips:"La douleur racinienne est contenue, pas cri\xE9e. Chaque mot est pes\xE9, chaque silence est un gouffre. La musicalit\xE9 de l'alexandrin porte le chagrin. Le dernier 'H\xE9las' doit contenir tout ce qu'elle ne peut plus dire."},{id:"fm16",title:"Hermione \u2014 la fureur",source:"Racine \u2014 Andromaque, Acte V, sc.1",text:"O\xF9 suis-je ? Qu'ai-je fait ? Que dois-je faire encore ? Quel transport me saisit ? Quel chagrin me d\xE9vore ? Errante, et sans dessein, je cours dans ce palais. Ah ! ne puis-je savoir si j'aime ou si je hais ? Le cruel ! de quel \u0153il il m'a cong\xE9di\xE9e ! Sans piti\xE9, sans douleur, au moins \xE9tudi\xE9e. L'ai-je vu se troubler et me plaindre un moment ? En ai-je pu tirer un seul g\xE9missement ? Muet \xE0 mes soupirs, tranquille \xE0 mes alarmes, semblait-il seulement qu'il e\xFBt part \xE0 mes larmes ? Et je le plains encore ! Et, pour comble d'ennui, mon c\u0153ur, mon l\xE2che c\u0153ur s'int\xE9resse pour lui ? Je tremble au seul penser du coup qui le menace ? Et, pr\xEAte \xE0 me venger, je lui fais d\xE9j\xE0 gr\xE2ce ? Non, ne r\xE9voquons point l'arr\xEAt de mon courroux : qu'il p\xE9risse !",tier:"avance",difficulty:3,genre:"femme",tips:"Hermione est d\xE9chir\xE9e entre l'amour et la rage. Les questions ne sont pas rh\xE9toriques \u2014 elle cherche vraiment la r\xE9ponse. Le corps est en crise. Le va-et-vient entre vengeance et pardon est physique."},{id:"fm18",title:"Camille \u2014 les impr\xE9cations",source:"Corneille \u2014 Horace, Acte IV, sc.5",text:"Rome, l'unique objet de mon ressentiment ! Rome, \xE0 qui vient ton bras d'immoler mon amant ! Rome qui t'a vu na\xEEtre, et que ton c\u0153ur adore ! Rome enfin que je hais parce qu'elle t'honore ! Puissent tous ses voisins ensemble conjur\xE9s saper ses fondements encore mal assur\xE9s ! Et si ce n'est assez de toute l'Italie, que l'Orient contre elle \xE0 l'Occident s'allie ; que cent peuples unis des bouts de l'univers passent pour la d\xE9truire et les monts et les mers ! Qu'elle-m\xEAme sur soi renverse ses murailles, et de ses propres mains d\xE9chire ses entrailles ! Que le courroux du ciel, allum\xE9 par mes v\u0153ux, fasse pleuvoir sur elle un d\xE9luge de feux ! Puiss\xE9-je de mes yeux y voir tomber ce foudre, voir ses maisons en cendres, et tes lauriers en poudre, voir le dernier Romain \xE0 son dernier soupir, moi seule en \xEAtre cause, et mourir de plaisir !",tier:"avance",difficulty:3,genre:"femme",tips:"Camille maudit Rome devant son fr\xE8re qui vient de tuer son amant. C'est un acte de bravoure suicidaire. Chaque 'Rome' est un coup de poignard. L'impr\xE9cation monte crescendo jusqu'\xE0 l'image finale \u2014 sa propre mort de plaisir."},{id:"fm24",title:"N\xE9ron \u2014 la cruaut\xE9",source:"Racine \u2014 Britannicus, Acte II, sc.2",text:"Excit\xE9 d'un d\xE9sir curieux, cette nuit je l'ai vue arriver en ces lieux, triste, levant au ciel ses yeux mouill\xE9s de larmes, qui brillaient au travers des flambeaux et des armes. Belle, sans ornements, dans le simple appareil d'une beaut\xE9 qu'on vient d'arracher au sommeil. Que veux-tu ? Je ne sais si cette n\xE9gligence, les ombres, les flambeaux, les cris et le silence, et le farouche aspect de ses fiers ravisseurs, relevaient de ses yeux les timides douceurs. Quoi qu'il en soit, ravi d'une si belle vue, j'ai voulu lui parler, et ma voix s'est perdue : immobile, saisi d'un long \xE9tonnement, je l'ai laiss\xE9e passer dans son appartement. J'ai pass\xE9 dans le mien. C'est l\xE0 que, solitaire, de son image en vain j'ai voulu me distraire. Trop pr\xE9sente \xE0 mes yeux, je croyais lui parler ; j'aimais jusqu'\xE0 ses pleurs que je faisais couler.",tier:"avance",difficulty:3,genre:"homme",tips:"N\xE9ron d\xE9crit Junie avec une beaut\xE9 terrifiante. Derri\xE8re l'\xE9merveillement esth\xE9tique, il y a le pr\xE9dateur. La douceur des mots cache la violence du d\xE9sir. Le dernier vers est gla\xE7ant \u2014 il aime ses propres crimes."},{id:"fm25",title:"Cyrano \u2014 la mort",source:"Rostand \u2014 Cyrano de Bergerac, Acte V, sc.6",text:"Non, non, mon cher amour, je ne vous aimais pas ! Le soir, quand j'avais fait quelque beau paraphe de mon nom dans le ciel, et qu'ensuite tremblant, je laissais le doux bien du geste extravagant, je savais, en montant vers les \xE2mes les meilleures, que c'est vous ma beaut\xE9, vous mon id\xE9al. Et je ne vous aimais pas. Que je n'aie eu de joie qui ne f\xFBt tout enti\xE8re \xE0 vous ! Voici que je meurs. C'est Roxane qui pleure. Adieu ! Philosophe, physicien, rimeur, bretteur, musicien, et voyageur a\xE9rien, grand riposteur du tac au tac, amant aussi \u2014 pas pour son bien ! \u2014 ci-g\xEEt Hercule-Savinien de Cyrano de Bergerac, qui fut tout, et qui ne fut rien. Mais je m'en vais, pardonnez-moi de ne m'en aller que ce soir. Oui, vous m'arrachez tout, le laurier et la rose ! Arrachez ! Il y a malgr\xE9 vous quelque chose que j'emporte, et ce soir, quand j'entrerai chez Dieu, mon salut balaiera largement le seuil bleu, quelque chose que sans un pli, sans une tache, j'emporte malgr\xE9 vous... et c'est... Mon panache.",tier:"avance",difficulty:3,genre:"homme",tips:"Cyrano fait son propre \xE9loge fun\xE8bre puis meurt debout. L'humour masque l'agonie. Il faut que le public rie et pleure en m\xEAme temps. Le panache est l\xE0 jusqu'au dernier souffle. Le mot final doit r\xE9sonner comme un dernier coup d'\xE9p\xE9e."}],FEED_MICROCOURS=[{id:"mc1",title:"Le sous-texte",content:["Le sous-texte, c'est ce que le personnage pense vraiment, derri\xE8re ce qu'il dit.","Exemple : quand Iago dit \xAB Prenez garde \xE0 la jalousie \xBB, son sous-texte est \xAB Sois jaloux \xBB.","Pour trouver le sous-texte : demandez-vous \xAB Que VEUT mon personnage dans cette sc\xE8ne ? \xBB puis \xAB Que DIT-il pour l'obtenir ? \xBB","Le d\xE9calage entre les deux, c'est le sous-texte. C'est l\xE0 que vit le jeu."],icon:"\u{1F3AD}"},{id:"mc2",title:"La respiration du com\xE9dien",content:["Tout commence par le souffle. Sans respiration, pas de voix. Sans voix, pas de jeu.","La respiration abdominale : inspirez par le nez, le ventre se gonfle. Expirez par la bouche, le ventre rentre. La poitrine ne bouge PAS.","Exercice : inspirez 4 secondes, retenez 4 secondes, expirez 8 secondes. Faites 10 cycles.","Sur sc\xE8ne, la respiration porte l'\xE9motion. Un personnage stress\xE9 respire court et haut. Un personnage serein respire long et bas."],icon:"\u{1F32C}\uFE0F"},{id:"mc3",title:"Les rapports de force",content:["Dans chaque sc\xE8ne, un personnage domine et un autre est domin\xE9. Parfois \xE7a bascule.","Le rapport de force n'est pas toujours celui qu'on croit. Un valet peut dominer son ma\xEEtre (Iago/Othello, Figaro/Almaviva).","Pour identifier le rapport de force, demandez : \xAB Qui a l'information ? Qui contr\xF4le le rythme ? Qui fait bouger l'autre ? \xBB","Sur sc\xE8ne, le rapport de force se traduit physiquement : regard, posture, occupation de l'espace, hauteur."],icon:"\u2694\uFE0F"},{id:"mc4",title:"L'adresse au public",content:["Au th\xE9\xE2tre, on ne joue pas pour la cam\xE9ra \u2014 on joue pour des \xEAtres humains vivants devant soi.","Le quatri\xE8me mur est un choix, pas une obligation. Brecht le brise volontairement. Shakespeare aussi.","M\xEAme quand vous ne regardez pas le public, vous jouez VERS lui. La voix se projette vers le fond de salle, le corps se place en ouverture.","L'apart\xE9 est un outil puissant : le personnage confie quelque chose au public que les autres personnages n'entendent pas. \xC7a cr\xE9e une complicit\xE9."],icon:"\u{1F465}"},{id:"mc5",title:"Le rythme sc\xE9nique",content:["Le rythme, c'est la musique invisible de la sc\xE8ne. Acc\xE9l\xE9rations, ralentissements, silences.","Un silence est aussi important qu'une r\xE9plique. Il peut valoir plus qu'un monologue entier.","Exercice : prenez une sc\xE8ne et marquez les temps forts (\u2B06\uFE0F) et les temps faibles (\u2B07\uFE0F). Le rythme na\xEEt de cette alternance.","Attention \xE0 la \xAB monotonie rythmique \xBB \u2014 le pi\xE8ge du d\xE9butant qui dit tout sur le m\xEAme tempo. Variez !"],icon:"\u{1F941}"},{id:"mc6",title:"Le corps raconte",content:["Le public voit avant d'entendre. Votre corps dit la v\xE9rit\xE9 m\xEAme quand votre texte ment.","Michael Chekhov proposait d'associer un geste physique \xE0 chaque \xE9tat int\xE9rieur \u2014 pas une r\xE8gle universelle, un outil d'exploration : quel mouvement pourrait porter cette col\xE8re, cette peur, cette joie ? Deux acteurs trouveront deux gestes diff\xE9rents, et les deux peuvent \xEAtre justes.","Le centre du corps peut changer selon le personnage. Un intellectuel peut vivre dans sa t\xEAte. Un s\xE9ducteur dans son bassin. Un guerrier dans sa poitrine \u2014 \xE0 vous de choisir, pas de suivre une case toute faite.","Exercice : traversez la sc\xE8ne 5 fois avec 5 centres diff\xE9rents. Observez comment le personnage change, et gardez celui qui vous semble le plus juste \u2014 pas le plus 'correct'."],icon:"\u{1F3CB}"},{id:"mc7",title:"La diction fran\xE7aise",content:["Les consonnes portent le sens, les voyelles portent l'\xE9motion. Articuler, c'est respecter les deux.","La liaison est obligatoire en vers classique. \xAB Les\u203Famants \xBB se lie, \xAB les amants | heureux \xBB se lie aussi.","Le \xAB e muet \xBB se prononce en alexandrin : \xAB Je suis ma\xEEtr(e) de moi comm(e) de l'univers \xBB.","Exercice quotidien : lisez un texte classique en exag\xE9rant CHAQUE consonne. Puis rel\xE2chez progressivement vers le naturel."],icon:"\u{1F5E3}\uFE0F"},{id:"mc8",title:"Jouer l'\xE9coute",content:["90% du jeu, c'est l'\xE9coute. Le personnage qui ne parle pas est tout aussi important que celui qui parle.","\xC9couter sur sc\xE8ne, ce n'est pas attendre son tour de parler. C'est R\xC9AGIR en temps r\xE9el \xE0 ce qu'on entend.","Exercice : dans une sc\xE8ne \xE0 deux, jouez votre r\xF4le en vous interdisant de penser \xE0 votre prochaine r\xE9plique. \xC9coutez VRAIMENT.","L'\xE9coute se voit dans le regard, la respiration, les micro-mouvements. Le public le sent imm\xE9diatement."],icon:"\u{1F442}"}],FEED_DAILY_EXERCISES=[{id:"de1",title:"L'\xE9motion en 10 secondes",desc:"Choisissez une \xE9motion. Fermez les yeux 10 secondes. Ouvrez-les en \xE9tant DANS cette \xE9motion. Filmez.",xp:25},{id:"de2",title:"La marche du personnage",desc:"Marchez dans votre salon comme 3 personnages diff\xE9rents : un roi, un enfant, un vieillard. 2 minutes chacun.",xp:25},{id:"de3",title:"Le miroir expressif",desc:"Devant un miroir : joie \u2192 tristesse \u2192 col\xE8re \u2192 peur \u2192 surprise \u2192 d\xE9go\xFBt. 30 secondes par \xE9motion.",xp:20},{id:"de4",title:"Le texte \xE0 l'envers",desc:"Prenez un texte que vous connaissez. Dites-le en commen\xE7ant par la derni\xE8re phrase. Observez ce qui change.",xp:30},{id:"de5",title:"L'observation du jour",desc:"Observez un inconnu 30 secondes. Inventez sa vie, sa voix, sa d\xE9marche. Jouez-le devant votre miroir.",xp:25},{id:"de6",title:"Le silence habit\xE9",desc:"Tenez-vous debout en silence pendant 2 minutes. Pas d'action. Juste : \xEAtre pr\xE9sent. C'est le plus dur.",xp:20},{id:"de7",title:"La r\xE9plique pi\xE9g\xE9e",desc:"Dites \xAB Je t'aime \xBB avec 5 intentions diff\xE9rentes : menace, supplication, ironie, joie, indiff\xE9rence.",xp:25}],MONTEXTE_PARCOURS=[{id:"e1",name:"Premi\xE8re lecture",icon:"\u{1F4D6}",color:"var(--gold)",intro:"Avant de jouer un texte, il faut d'abord le comprendre. Pas l'analyser, pas l'interpr\xE9ter \u2014 juste le comprendre. De quoi parle-t-il ? C'est la base de tout. Un com\xE9dien qui ne comprend pas pr\xE9cis\xE9ment ce qu'il dit ne pourra jamais le faire vivre.",questions:[{q:"De quoi parle ce texte ? R\xE9sumez l'essentiel en 2-3 phrases, comme si vous l'expliquiez \xE0 quelqu'un qui ne l'a jamais lu.",tip:"Commencez toujours par le plus simple. Si vous ne pouvez pas r\xE9sumer clairement, c'est que quelque chose vous \xE9chappe encore \u2014 et c'est normal."},{q:"Y a-t-il des mots ou des expressions que vous ne comprenez pas ? Listez-les et cherchez leur sens.",tip:"Ne faites jamais semblant de comprendre un mot. Un seul mot mal compris peut fausser toute votre interpr\xE9tation."},{q:"Dans quel \xE9tat \xE9motionnel est votre personnage au d\xE9but du texte ? Et \xE0 la fin ? Est-ce que \xE7a change ?",tip:"Le trajet \xE9motionnel du personnage est votre feuille de route. Si rien ne change entre le d\xE9but et la fin, cherchez mieux \u2014 il y a toujours un mouvement."}]},{id:"e2",name:"Le contexte",icon:"\u{1F3DB}\uFE0F",color:"var(--gold-dim)",intro:"Un texte n'existe jamais dans le vide. Que s'est-il pass\xE9 juste avant cette sc\xE8ne ? Pourquoi votre personnage parle-t-il maintenant ? Le contexte, c'est le terreau dans lequel pousse votre interpr\xE9tation. Sans contexte, vous r\xE9citez. Avec, vous jouez.",questions:[{q:"Que s'est-il pass\xE9 juste AVANT ce texte ? Quel \xE9v\xE9nement d\xE9clenche cette prise de parole ?",tip:"Votre personnage ne parle pas par hasard. Quelque chose vient de se passer qui rend cette parole urgente, n\xE9cessaire, in\xE9vitable."},{q:"O\xF9 et quand se d\xE9roule la sc\xE8ne ? Comment le lieu et le moment influencent-ils ce que dit le personnage ?",tip:"On ne parle pas de la m\xEAme fa\xE7on dans un salon que dans une prison, en plein jour que la nuit. Le lieu agit sur le corps et la voix."},{q:"Quelle est la relation entre votre personnage et les personnes pr\xE9sentes (ou absentes) ? Comment cette relation colore-t-elle chaque mot ?",tip:"La m\xEAme phrase (\xAB je t'aime \xBB) ne se dit pas du tout de la m\xEAme fa\xE7on selon qu'on s'adresse \xE0 un amant, un parent, un ennemi."}]},{id:"e3",name:"L'adresse",icon:"\u{1F465}",color:"var(--coral)",intro:"Au th\xE9\xE2tre, la question fondamentale est : \xE0 qui parle-t-on ? Votre personnage s'adresse \xE0 quelqu'un \u2014 un autre personnage, le public, lui-m\xEAme, Dieu, un absent. L'adresse d\xE9termine tout : le volume, le regard, la distance, l'intention. Changez l'adresse, et tout le texte change.",questions:[{q:"\xC0 qui parle votre personnage ? Y a-t-il un seul interlocuteur ou plusieurs ? L'adresse change-t-elle au cours du texte ?",tip:"Attention aux changements d'adresse \u2014 ce sont souvent les moments les plus int\xE9ressants. Le personnage se parle \xE0 lui-m\xEAme puis se tourne vers l'autre : ce virage est un \xE9v\xE9nement."},{q:"Votre personnage dit-il la v\xE9rit\xE9 \xE0 son interlocuteur ? Ou cache-t-il quelque chose ? Pourquoi ?",tip:"Le d\xE9calage entre ce qu'on dit et ce qu'on pense, c'est le sous-texte. C'est l\xE0 que le jeu prend toute sa richesse."},{q:"Si votre personnage pouvait dire la v\xE9rit\xE9 brute \xE0 son interlocuteur, sans filtre, que dirait-il ?",tip:"Cet exercice vous r\xE9v\xE8le le sous-texte. La distance entre la v\xE9rit\xE9 brute et le texte r\xE9el, c'est exactement l'espace dans lequel vous jouez."}]},{id:"e4",name:"Les intentions",icon:"\u{1F3AF}",color:"var(--emerald)",intro:"Un personnage ne parle jamais pour rien. Il veut obtenir quelque chose \u2014 de l'autre, de lui-m\xEAme, du monde. L'intention, c'est le moteur de chaque r\xE9plique. Sans intention claire, le jeu est mou. \xAB Que veut mon personnage ? \xBB est LA question que tout acteur doit se poser \xE0 chaque instant.",questions:[{q:"Quel est l'objectif principal de votre personnage dans ce texte ? Que cherche-t-il \xE0 obtenir ?",tip:"L'objectif doit \xEAtre concret et pr\xE9cis. Pas \xAB il est triste \xBB mais \xAB il veut que l'autre revienne \xBB. L'objectif, c'est un verbe d'action."},{q:"Quels obstacles l'emp\xEAchent d'atteindre son objectif ? Sont-ils internes (doutes, peur) ou externes (un autre personnage, les circonstances) ?",tip:"Pas d'obstacles = pas de drame = pas de jeu. Plus l'obstacle est fort, plus l'intention doit \xEAtre puissante pour le surmonter."},{q:"D\xE9coupez votre texte en \xAB unit\xE9s d'intention \xBB. \xC0 chaque changement de tactique du personnage, marquez une pause. Combien d'unit\xE9s trouvez-vous ?",tip:"Un personnage change de tactique quand sa premi\xE8re approche ne fonctionne pas. Il supplie, puis menace, puis s\xE9duit. Chaque changement est un \xE9v\xE9nement sc\xE9nique."},{q:"Quel est l'enjeu ? Que se passe-t-il si votre personnage \xE9choue ?",tip:"Plus l'enjeu est vital, plus la sc\xE8ne est forte. Jouez comme si la vie de votre personnage en d\xE9pendait \u2014 souvent, symboliquement, c'est le cas."}]},{id:"e5",name:"Les rapports de force",icon:"\u2694\uFE0F",color:"var(--coral)",intro:"Dans toute sc\xE8ne, il y a un rapport de force. Quelqu'un domine, quelqu'un subit \u2014 et souvent, \xE7a bascule. Le rapport de force n'est pas toujours celui qu'on croit : un valet peut dominer son ma\xEEtre par le savoir, un enfant peut dominer un adulte par l'\xE9motion. Comprendre le rapport de force, c'est comprendre l'architecture invisible de la sc\xE8ne.",questions:[{q:"Qui domine au d\xE9but du texte ? Comment cette domination se manifeste-t-elle (parole, silence, position, savoir) ?",tip:"La domination n'est pas toujours cri\xE9e. Parfois, celui qui parle le moins est celui qui contr\xF4le le plus."},{q:"Le rapport de force \xE9volue-t-il au cours du texte ? Y a-t-il un moment de bascule ? Qu'est-ce qui le provoque ?",tip:"Le moment o\xF9 le rapport de force bascule est souvent le climax de la sc\xE8ne. Rep\xE9rez-le et faites-le exister physiquement."},{q:"Quelles \xAB armes \xBB utilise votre personnage pour prendre ou garder le pouvoir ? (ironie, s\xE9duction, menace, silence, savoir, vuln\xE9rabilit\xE9\u2026)",tip:"Chaque personnage a sa strat\xE9gie. C\xE9lim\xE8ne utilise l'esprit, Ph\xE8dre la vuln\xE9rabilit\xE9, Figaro l'ironie, N\xE9ron la menace. Quelle est la v\xF4tre ?"}]},{id:"e6",name:"Le rythme et le corps",icon:"\u{1F941}",color:"var(--violet)",intro:"Le texte est une partition. Il a ses acc\xE9l\xE9rations, ses ralentissements, ses silences. Le rythme porte l'\xE9motion autant que les mots. Et le corps traduit tout ce que la voix ne dit pas. Un personnage ne pense pas seulement avec sa t\xEAte \u2014 il pense avec ses pieds, ses mains, son souffle.",questions:[{q:"O\xF9 sont les acc\xE9l\xE9rations et les ralentissements dans votre texte ? Qu'est-ce qui les provoque \xE9motionnellement ?",tip:"En g\xE9n\xE9ral, l'\xE9motion acc\xE9l\xE8re le rythme (col\xE8re, peur, passion) et la r\xE9flexion le ralentit (doute, m\xE9lancolie, calcul). Mais l'inverse peut \xEAtre tr\xE8s puissant aussi."},{q:"Rep\xE9rez les silences \u2014 explicites (didascalies) ou implicites (changements de sujet, phrases inachev\xE9es). Que se passe-t-il dans ces silences ?",tip:"Le silence n'est jamais vide au th\xE9\xE2tre. Quelque chose se passe dans la t\xEAte du personnage. Le public le sent. Ne remplissez jamais un silence \u2014 habitez-le."},{q:"Comment le corps de votre personnage \xE9volue-t-il au fil du texte ? Est-il ouvert ou ferm\xE9 ? Tendu ou rel\xE2ch\xE9 ? Ancr\xE9 ou en d\xE9s\xE9quilibre ?",tip:"Avant de travailler la voix, travaillez le corps. Essayez de jouer votre texte sans un mot, juste avec le corps. Ce qui reste, c'est l'essentiel."}]},{id:"e7",name:"L'interpr\xE9tation",icon:"\u{1F3AC}",color:"var(--gold-light)",intro:"Vous avez compris le texte, le contexte, l'adresse, les intentions, les rapports de force, le rythme. Maintenant, c'est \xE0 vous. L'interpr\xE9tation, c'est VOS choix. Il n'y a pas une seule fa\xE7on de jouer un texte \u2014 il y a la v\xF4tre. C'est ici que le travail d'analyse se transforme en jeu vivant.",questions:[{q:"Quelle est VOTRE vision de ce personnage ? Qu'est-ce qui vous touche, vous intrigue ou vous d\xE9range chez lui ?",tip:"Votre rapport personnel au personnage est votre force. Vous n'avez pas besoin de l'aimer \u2014 vous avez besoin de le comprendre."},{q:"Si vous ne deviez retenir qu'un seul moment cl\xE9 dans ce texte \u2014 celui o\xF9 tout bascule \u2014 lequel serait-ce ?",tip:"Ce moment est le c\u0153ur de votre interpr\xE9tation. Tout le reste doit mener vers lui ou en d\xE9couler."},{q:"Dites votre texte \xE0 voix haute, debout, trois fois de suite. Qu'est-ce qui change entre la premi\xE8re et la troisi\xE8me fois ?",tip:"Le texte doit passer par le corps. Tant qu'il est dans la t\xEAte, il n'est pas pr\xEAt. C'est en le disant et en le redisant qu'il devient v\xF4tre."}]}],WARMUP_LEVELS=[{id:"debutant",name:"D\xE9butant",icon:"\u{1F33F}",color:"var(--gold)",unlockXP:0},{id:"intermediaire",name:"Interm\xE9diaire",icon:"\u{1F525}",color:"var(--coral)",unlockXP:500},{id:"avance",name:"Avanc\xE9",icon:"\u{1F48E}",color:"var(--violet)",unlockXP:2e3}],WARMUP_EXERCISES=[{id:"w1",title:"Les chaussettes",phrase:"Les chaussettes de l'archiduchesse sont-elles s\xE8ches",cat:"Diction",dur:"2 min",level:"debutant",difficulty:1},{id:"w2",title:"Projection de base",phrase:"\xD4 rage \xD4 d\xE9sespoir \xD4 vieillesse ennemie",cat:"Projection",dur:"2 min",level:"debutant",difficulty:1},{id:"w3",title:"Les voyelles",phrase:"A E I O U OU AN ON IN",cat:"Vocalise",dur:"1 min",level:"debutant",difficulty:1},{id:"w4",title:"Souffle continu",phrase:"Tenez un aaaaah le plus longtemps possible sans forcer",cat:"Respiration",dur:"1 min",level:"debutant",difficulty:1},{id:"w5",title:"Le chasseur",phrase:"Un chasseur sachant chasser sait chasser sans son chien de chasse",cat:"Diction",dur:"2 min",level:"debutant",difficulty:1},{id:"w6",title:"Les gros rats",phrase:"Trois gros rats gris dans trois gros trous ronds rongent trois gros cro\xFBtons",cat:"Diction",dur:"2 min",level:"debutant",difficulty:1},{id:"w7",title:"Didon d\xEEna",phrase:"Didon d\xEEna dit-on du dos d'un dodu dindon",cat:"Diction",dur:"2 min",level:"intermediaire",difficulty:2},{id:"w8",title:"Excuses exquises",phrase:"Je veux et j'exige d'exquises excuses du juge qui juge",cat:"Diction",dur:"2 min",level:"intermediaire",difficulty:2},{id:"w9",title:"Les six scies",phrase:"Si six scies scient six cypr\xE8s six cent six scies scient six cent six cypr\xE8s",cat:"Diction",dur:"2 min",level:"intermediaire",difficulty:2},{id:"w10",title:"Projection Corneille",phrase:"Je suis ma\xEEtre de moi comme de l'univers je le suis je veux l'\xEAtre",cat:"Projection",dur:"2 min",level:"intermediaire",difficulty:2},{id:"w11",title:"Les consonnes dures",phrase:"Panier piano panier piano panier piano plus vite encore",cat:"Diction",dur:"2 min",level:"intermediaire",difficulty:2},{id:"w12",title:"Souffle et texte",phrase:"\xCAtre ou ne pas \xEAtre telle est la question est-il plus noble pour l'\xE2me de souffrir",cat:"Respiration",dur:"2 min",level:"intermediaire",difficulty:2},{id:"w13",title:"L'alexandrin",phrase:"Pour qui sont ces serpents qui sifflent sur vos t\xEAtes",cat:"Diction",dur:"2 min",level:"avance",difficulty:3},{id:"w14",title:"Triple encha\xEEnement",phrase:"Fruits frais fruits frits fruits cuits fruits crus dans la cour du grand cours du roi",cat:"Diction",dur:"2 min",level:"avance",difficulty:3},{id:"w15",title:"Cyrano endurance",phrase:"C'est un roc c'est un pic c'est un cap que dis-je c'est un cap c'est une p\xE9ninsule",cat:"Projection",dur:"2 min",level:"avance",difficulty:3},{id:"w16",title:"Ph\xE8dre",phrase:"Tout m'afflige et me nuit et conspire \xE0 me nuire",cat:"Projection",dur:"2 min",level:"avance",difficulty:3},{id:"w17",title:"L'impossible",phrase:"Six chacals chass\xE8rent six chiens dans six sachets de chanvre sur six chevaux de selle",cat:"Diction",dur:"2 min",level:"avance",difficulty:3},{id:"w18",title:"Souffle marathon",phrase:"Nul ne na\xEEt ni ne meurt nain dans la nuit noire des neiges du nord ni dans les nids nich\xE9s",cat:"Respiration",dur:"2 min",level:"avance",difficulty:3}],CHALLENGE_PHRASES={debutant:["Les chausse
